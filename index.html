
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>🙏 Jesus Songs – Admin & Public</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f7f3ee;
            color: #222;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #f5e6d3;
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.9rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .header h1 i {
            color: #f0c040;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        #searchInput {
            padding: .5rem 1rem .5rem 2.2rem;
            border: none;
            border-radius: 30px;
            font-size: .95rem;
            background: rgba(255,255,255,.15);
            color: #fff;
            outline: 2px solid transparent;
            transition: .3s;
            min-width: 200px;
        }

        #searchInput::placeholder {
            color: rgba(255,255,255,.6);
        }

        #searchInput:focus {
            outline-color: #f0c040;
            background: rgba(255,255,255,.25);
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,.5);
        }

        .btn {
            padding: .5rem 1.2rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: .25s;
            background: #f0c040;
            color: #1a1a2e;
        }

        .btn:hover {
            transform: scale(1.03);
            opacity: .9;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #f0c040;
            color: #f0c040;
        }

        .btn-outline:hover {
            background: #f0c040;
            color: #1a1a2e;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }

        .song-count {
            font-size: .9rem;
            color: rgba(255,255,255,.7);
        }

        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
            gap: 1.5rem;
        }

        .song-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,.06);
            transition: .3s;
            border-left: 5px solid #b8860b;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .song-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,.1);
        }

        .song-card-header {
            padding: 1.2rem 1.5rem .5rem;
        }

        .song-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .song-title i {
            color: #b8860b;
            margin-right: .4rem;
        }

        .song-card-body {
            padding: 0 1.5rem .8rem;
            flex: 1;
        }

        .song-preview {
            color: #555;
            font-style: italic;
            font-size: .9rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .song-link {
            padding: 0 1.5rem .7rem;
        }

        .song-link a {
            color: #1a6fb5;
            text-decoration: none;
            font-size: .9rem;
        }

        .song-footer {
            padding: .7rem 1.5rem 1rem;
            border-top: 1px solid #f0ebe5;
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            color: #999;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            grid-column: 1 / -1;
            color: #777;
        }

        .admin-panel {
            display: none;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h2 {
            margin-bottom: 1rem;
            color: #1a1a2e;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: .3rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: .7rem 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: .95rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .admin-song-list {
            margin-top: 2rem;
            border-top: 2px dashed #ddd;
            padding-top: 1.5rem;
        }

        .admin-song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .7rem 0;
            border-bottom: 1px solid #eee;
        }

        .admin-song-item .actions {
            display: flex;
            gap: .5rem;
        }

        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-modal {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
            text-align: center;
        }

        .login-modal h2 {
            margin-bottom: 1.5rem;
            color: #1a1a2e;
        }

        .login-modal input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .login-modal .btn {
            width: 100%;
            padding: .7rem;
        }

        .login-error {
            color: #c0392b;
            font-size: .9rem;
            margin-top: .7rem;
        }

        .song-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            backdrop-filter: blur(6px);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .song-detail-overlay.active {
            display: flex;
        }

        .song-detail-modal {
            background: #fff;
            border-radius: 28px;
            max-width: 720px;
            width: 100%;
            padding: 2.5rem;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #888;
            cursor: pointer;
            border: none;
            background: none;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
            padding-right: 2rem;
        }

        .detail-title i {
            color: #b8860b;
            margin-right: .5rem;
        }

        .detail-lyrics {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            line-height: 1.9;
            white-space: pre-line;
            color: #2c2c2c;
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 2px solid #f0ebe5;
            border-bottom: 2px solid #f0ebe5;
        }

        .detail-link a {
            color: #1a6fb5;
            text-decoration: none;
        }

        .footer {
            background: #1a1a2e;
            color: rgba(255,255,255,.4);
            text-align: center;
            padding: 1.2rem;
            font-size: .8rem;
            margin-top: 2rem;
        }

        @media(max-width:650px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: .8rem;
            }

            .header-controls {
                justify-content: center;
            }

            #searchInput {
                width: 100%;
                min-width: 150px;
            }

            .songs-grid {
                grid-template-columns: 1fr;
            }

            .song-detail-modal {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>

    <div class="header-controls">

        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
            />
        </div>

        <span class="song-count" id="songCount">
            Loading...
        </span>

        <button
            class="btn btn-outline"
            id="adminToggleBtn"
        >
            <i class="fas fa-user-shield"></i>
            Admin
        </button>

    </div>

</header>


<!-- LOGIN -->

<div
    class="login-overlay"
    id="loginOverlay"
>

    <div class="login-modal">

        <h2>
            <i class="fas fa-lock"></i>
            Admin Login
        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin Email"
        />

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        />

        <button
            class="btn"
            id="loginBtn"
        >
            Login
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

        <p style="margin-top:1rem;font-size:.8rem;color:#999;">
            Login using your Supabase admin account
        </p>

    </div>

</div>


<!-- SONG DETAIL -->

<div
    class="song-detail-overlay"
    id="songDetailOverlay"
>

    <div class="song-detail-modal">

        <button
            class="close-btn"
            id="detailCloseBtn"
        >
            &times;
        </button>

        <div
            class="detail-title"
            id="detailTitle"
        >
            Song
        </div>

        <div
            class="detail-lyrics"
            id="detailLyrics"
        ></div>

        <div
            class="detail-link"
            id="detailLink"
        ></div>

    </div>

</div>


<main class="main">

    <!-- ADMIN PANEL -->

    <div
        class="admin-panel"
        id="adminPanel"
    >

        <h2>
            <i class="fas fa-plus-circle"></i>
            Add New Song
        </h2>

        <div class="form-group">

            <label>
                Song Title *
            </label>

            <input
                type="text"
                id="songTitle"
                placeholder="e.g. Amazing Grace"
            />

        </div>


        <div class="form-group">

            <label>
                Lyrics *
            </label>

            <textarea
                id="songLyrics"
                placeholder="Enter full lyrics..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Audio / YouTube Link
            </label>

            <input
                type="url"
                id="songLink"
                placeholder="https://..."
            />

        </div>


        <div class="form-group">

            <label>
                Category
            </label>

            <input
                type="text"
                id="songCategory"
                placeholder="Worship"
            />

        </div>


        <button
            class="btn"
            id="addSongBtn"
        >
            <i class="fas fa-save"></i>
            Add Song
        </button>


        <hr style="margin:1.5rem 0;" />


        <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            "
        >

            <h3>
                Existing Songs
            </h3>

            <button
                class="btn btn-danger"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>


        <div
            class="admin-song-list"
            id="adminSongList"
        ></div>

    </div>


    <!-- PUBLIC SONGS -->

    <div
        class="songs-grid"
        id="songsGrid"
    ></div>

</main>


<footer class="footer">

    <p>
        ✝️ Jesus Songs · Powered by Supabase
    </p>

</footer>


<script>

/* ============================================================
   SUPABASE CONFIGURATION
   ============================================================ */

const SUPABASE_URL =
    "https://nlybxlbtqvueulacwwju.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_PzB8o8cCresQ496jXnimbA_UyJ0yJ-6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ============================================================
   STATE
   ============================================================ */

let songs = [];

let searchQuery = "";

let currentUser = null;


/* ============================================================
   DOM
   ============================================================ */

const grid =
    document.getElementById("songsGrid");

const searchInput =
    document.getElementById("searchInput");

const songCount =
    document.getElementById("songCount");

const adminPanel =
    document.getElementById("adminPanel");

const adminToggleBtn =
    document.getElementById("adminToggleBtn");

const loginOverlay =
    document.getElementById("loginOverlay");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const addSongBtn =
    document.getElementById("addSongBtn");

const songTitle =
    document.getElementById("songTitle");

const songLyrics =
    document.getElementById("songLyrics");

const songLink =
    document.getElementById("songLink");

const songCategory =
    document.getElementById("songCategory");

const adminSongList =
    document.getElementById("adminSongList");

const detailOverlay =
    document.getElementById("songDetailOverlay");

const detailCloseBtn =
    document.getElementById("detailCloseBtn");

const detailTitle =
    document.getElementById("detailTitle");

const detailLyrics =
    document.getElementById("detailLyrics");

const detailLink =
    document.getElementById("detailLink");


/* ============================================================
   LOAD SONGS FROM SUPABASE
   ============================================================ */

async function loadSongs() {

    songCount.textContent = "Loading...";

    const {
        data,
        error
    } = await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
            ascending: true
        });


    if (error) {

        console.error(error);

        grid.innerHTML = `
            <div class="no-results">
                <i
                    class="fas fa-exclamation-triangle"
                    style="font-size:2rem;"
                ></i>

                <p>
                    Failed to load songs.
                </p>

                <small>
                    ${error.message}
                </small>
            </div>
        `;

        songCount.textContent = "0 songs";

        return;
    }


    songs = data || [];

    renderSongs();

    renderAdminList();
}


/* ============================================================
   RENDER PUBLIC SONGS
   ============================================================ */

function renderSongs() {

    const q =
        searchQuery
            .toLowerCase()
            .trim();


    const filtered =
        songs.filter(song => {

            return (
                (song.title || "")
                    .toLowerCase()
                    .includes(q)

                ||

                (song.lyrics || "")
                    .toLowerCase()
                    .includes(q)

                ||

                (song.category || "")
                    .toLowerCase()
                    .includes(q)
            );

        });


    songCount.textContent =
        `${filtered.length} song${filtered.length !== 1 ? "s" : ""}`;


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="no-results">

                <i
                    class="fas fa-music"
                    style="
                    font-size:2rem;
                    opacity:.4;
                    "
                ></i>

                <p>
                    No songs found
                </p>

            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered.map(song => {

            const preview =
                (song.lyrics || "")
                    .split("\n")
                    .filter(x => x.trim() !== "")[0]
                    || "...";


            const link =
                song.audio_url || "";


            return `

                <div
                    class="song-card"
                    data-id="${song.id}"
                >

                    <div class="song-card-header">

                        <span class="song-title">

                            <i class="fas fa-music"></i>

                            ${escapeHTML(song.title)}

                        </span>

                    </div>


                    <div class="song-card-body">

                        <div class="song-preview">

                            ${escapeHTML(preview)}

                        </div>

                    </div>


                    ${
                        link
                        ?
                        `
                        <div class="song-link">

                            <a
                                href="${escapeAttribute(link)}"
                                target="_blank"
                                rel="noopener"
                            >

                                <i
                                    class="fas fa-play-circle"
                                ></i>

                                Play / Watch

                            </a>

                        </div>
                        `
                        :
                        ""
                    }


                    <div class="song-footer">

                        <span>

                            <i class="far fa-eye"></i>

                            Tap to view full

                        </span>

                        <i
                            class="fas fa-arrow-right"
                            style="color:#b8860b;"
                        ></i>

                    </div>

                </div>
            `;

        }).join("");
}


/* ============================================================
   ADMIN SONG LIST
   ============================================================ */

function renderAdminList() {

    if (!currentUser) {

        adminSongList.innerHTML = "";

        return;
    }


    if (songs.length === 0) {

        adminSongList.innerHTML =
            "<p style='color:#999;'>No songs yet.</p>";

        return;
    }


    adminSongList.innerHTML =
        songs.map(song => {

            return `

                <div class="admin-song-item">

                    <span>

                        ${escapeHTML(song.title)}

                    </span>


                    <div class="actions">

                        <button
                            class="btn btn-danger delete-song"
                            data-id="${song.id}"
                            style="
                            padding:.25rem .8rem;
                            font-size:.8rem;
                            "
                        >

                            <i
                                class="fas fa-trash"
                            ></i>

                            Delete

                        </button>

                    </div>

                </div>
            `;

        }).join("");


    document
        .querySelectorAll(".delete-song")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    deleteSong(
                        Number(button.dataset.id)
                    );

                }
            );

        });
}


/* ============================================================
   OPEN SONG DETAIL
   ============================================================ */

function openDetail(song) {

    detailTitle.innerHTML = `
        <i class="fas fa-music"></i>
        ${escapeHTML(song.title)}
    `;


    detailLyrics.textContent =
        song.lyrics || "No lyrics available.";


    if (song.audio_url) {

        detailLink.innerHTML = `

            <a
                href="${escapeAttribute(song.audio_url)}"
                target="_blank"
                rel="noopener"
            >

                <i class="fas fa-play-circle"></i>

                Play / Watch

            </a>
        `;

    } else {

        detailLink.innerHTML = "";

    }


    detailOverlay.classList.add("active");

    document.body.style.overflow = "hidden";
}


function closeDetail() {

    detailOverlay.classList.remove("active");

    document.body.style.overflow = "";
}


/* ============================================================
   LOGIN
   ============================================================ */

async function login() {

    const email =
        loginEmail.value.trim();

    const password =
        loginPassword.value;


    if (!email || !password) {

        loginError.textContent =
            "Please enter email and password.";

        return;
    }


    loginError.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if (error) {

        console.error(error);

        loginError.textContent =
            "❌ " + error.message;

        return;
    }


    currentUser =
        data.user;


    loginOverlay.classList.remove("active");

    adminPanel.classList.add("active");


    adminToggleBtn.innerHTML =
        `<i class="fas fa-user"></i> Logout`;


    adminToggleBtn.style.background =
        "#2ecc71";

    adminToggleBtn.style.color =
        "#fff";


    renderAdminList();

    alert("✅ Admin login successful!");
}


/* ============================================================
   LOGOUT
   ============================================================ */

async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    adminPanel.classList.remove("active");


    adminToggleBtn.innerHTML =
        `<i class="fas fa-user-shield"></i> Admin`;


    adminToggleBtn.style.background = "";

    adminToggleBtn.style.color = "";


    renderAdminList();
}


/* ============================================================
   ADD SONG TO SUPABASE
   ============================================================ */

async function addSong() {

    if (!currentUser) {

        alert("Please login as admin first.");

        return;
    }


    const title =
        songTitle.value.trim();

    const lyrics =
        songLyrics.value.trim();

    const link =
        songLink.value.trim();

    const category =
        songCategory.value.trim();


    if (!title || !lyrics) {

        alert(
            "Song title and lyrics are required."
        );

        return;
    }


    addSongBtn.disabled = true;

    addSongBtn.textContent =
        "Saving...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("songs")
            .insert([
                {
                    title: title,
                    artist: "Jesus Songs",
                    lyrics: lyrics,
                    audio_url: link || null,
                    category: category || "Worship"
                }
            ])
            .select();


    addSongBtn.disabled = false;

    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;


    if (error) {

        console.error(error);

        alert(
            "❌ Failed to add song:\n" +
            error.message
        );

        return;
    }


    songTitle.value = "";

    songLyrics.value = "";

    songLink.value = "";

    songCategory.value = "";


    await loadSongs();


    alert("✅ Song added to Supabase!");
}


/* ============================================================
   DELETE SONG
   ============================================================ */

async function deleteSong(id) {

    if (!currentUser) {

        alert("Please login first.");

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this song?"
        );


    if (!confirmed) return;


    const {
        error
    } =
        await supabaseClient
            .from("songs")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        return;
    }


    await loadSongs();


    alert("✅ Song deleted.");
}


/* ============================================================
   SEARCH
   ============================================================ */

searchInput.addEventListener(
    "input",
    function () {

        searchQuery =
            this.value;

        renderSongs();

    }
);


/* ============================================================
   ADMIN BUTTON
   ============================================================ */

adminToggleBtn.addEventListener(
    "click",
    async function () {

        if (currentUser) {

            await logout();

        } else {

            loginOverlay.classList.add("active");

            loginError.textContent = "";

            loginEmail.focus();

        }

    }
);


/* ============================================================
   LOGIN EVENTS
   ============================================================ */

loginBtn.addEventListener(
    "click",
    login
);


loginPassword.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            login();

        }

    }
);


loginEmail.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            login();

        }

    }
);


/* ============================================================
   CLOSE LOGIN
   ============================================================ */

loginOverlay.addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            loginOverlay.classList.remove("active");

        }

    }
);


/* ============================================================
   CLOSE SONG DETAIL
   ============================================================ */

detailCloseBtn.addEventListener(
    "click",
    closeDetail
);


detailOverlay.addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            closeDetail();

        }

    }
);


document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" &&
            detailOverlay.classList.contains("active")
        ) {

            closeDetail();

        }

    }
);


/* ============================================================
   SONG CARD CLICK
   ============================================================ */

grid.addEventListener(
    "click",
    function(e) {

        if (e.target.closest("a")) {

            return;

        }


        const card =
            e.target.closest(".song-card");


        if (!card) return;


        const id =
            Number(card.dataset.id);


        const song =
            songs.find(
                s => Number(s.id) === id
            );


        if (song) {

            openDetail(song);

        }

    }
);


/* ============================================================
   ADD SONG
   ============================================================ */

addSongBtn.addEventListener(
    "click",
    addSong
);


/* ============================================================
   LOGOUT
   ============================================================ */

logoutBtn.addEventListener(
    "click",
    logout
);


/* ============================================================
   SECURITY HELPERS
   ============================================================ */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHTML(value);
}


/* ============================================================
   CHECK EXISTING LOGIN SESSION
   ============================================================ */

async function checkUser() {

    const {
        data
    } =
        await supabaseClient.auth.getUser();


    if (data && data.user) {

        currentUser =
            data.user;

        adminPanel.classList.add("active");

        adminToggleBtn.innerHTML =
            `<i class="fas fa-user"></i> Logout`;

        adminToggleBtn.style.background =
            "#2ecc71";

        adminToggleBtn.style.color =
            "#fff";

    }

}


/* ============================================================
   START
   ============================================================ */

async function init() {

    await checkUser();

    await loadSongs();

}


init();


/* ============================================================
   AUTH STATE LISTENER
   ============================================================ */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (session && session.user) {

            currentUser =
                session.user;

        } else {

            currentUser = null;

        }

    }
);

</script>
