
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>🙏 Jesus Songs – Admin & Public</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f3ee;
            --surface: #ffffff;
            --surface-2: #fbf8f4;
            --text: #222;
            --muted: #666;
            --border: #e8e0d7;
            --gold: #b8860b;
            --shadow: 0 6px 20px rgba(0,0,0,.06);
        }

        body.dark {
            --bg: #0f1117;
            --surface: #181b24;
            --surface-2: #20242f;
            --text: #f2f4f8;
            --muted: #aeb6c4;
            --border: #303644;
            --gold: #f0c040;
            --shadow: 0 8px 28px rgba(0,0,0,.35);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .25s ease, color .25s ease;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #f5e6d3;
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.9rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .header h1 i {
            color: #f0c040;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        #searchInput {
            padding: .5rem 1rem .5rem 2.2rem;
            border: none;
            border-radius: 30px;
            font-size: .95rem;
            background: rgba(255,255,255,.15);
            color: #fff;
            outline: 2px solid transparent;
            transition: .3s;
            min-width: 200px;
        }

        #searchInput::placeholder {
            color: rgba(255,255,255,.6);
        }

        #searchInput:focus {
            outline-color: #f0c040;
            background: rgba(255,255,255,.25);
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,.5);
        }

        .btn {
            padding: .5rem 1.2rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: .25s;
            background: #f0c040;
            color: #1a1a2e;
        }

        .btn:hover {
            transform: scale(1.03);
            opacity: .9;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #f0c040;
            color: #f0c040;
        }

        .btn-outline:hover {
            background: #f0c040;
            color: #1a1a2e;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }

        .song-count {
            font-size: .9rem;
            color: rgba(255,255,255,.7);
        }

        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
            gap: 1.5rem;
        }

        .song-card {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: .3s;
            border-left: 5px solid #b8860b;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .song-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,.1);
        }

        .song-card-header {
            padding: 1.2rem 1.5rem .5rem;
        }

        .song-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }

        .song-title i {
            color: #b8860b;
            margin-right: .4rem;
        }

        .song-card-body {
            padding: 0 1.5rem .8rem;
            flex: 1;
        }

        .song-preview {
            color: var(--muted);
            font-style: italic;
            font-size: .9rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .song-link {
            padding: 0 1.5rem .7rem;
        }

        .song-link a {
            color: #1a6fb5;
            text-decoration: none;
            font-size: .9rem;
        }

        .song-footer {
            padding: .7rem 1.5rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            color: var(--muted);
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            grid-column: 1 / -1;
            color: #777;
        }

        .admin-panel {
            display: none;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h2 {
            margin-bottom: 1rem;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: .3rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: .7rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: .95rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .admin-song-list {
            margin-top: 2rem;
            border-top: 2px dashed #ddd;
            padding-top: 1.5rem;
        }

        .admin-song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .7rem 0;
            border-bottom: 1px solid #eee;
        }

        .admin-song-item .actions {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn-edit {
            background: #3498db;
            color: #fff;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .edit-badge {
            display: inline-block;
            margin-left: .5rem;
            padding: .2rem .55rem;
            border-radius: 12px;
            background: #eaf4ff;
            color: #4da3ff;
            font-size: .72rem;
            font-weight: 700;
        }

        .form-actions {
            display: flex;
            gap: .7rem;
            flex-wrap: wrap;
        }

        .btn-cancel {
            background: #777;
            color: #fff;
        }

        .status-message {
            margin-top: .8rem;
            font-size: .9rem;
            min-height: 1.2rem;
        }

        /* THEME TOGGLE */
        .theme-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* CUSTOM MINI PLAYER - YOUTUBE VIDEO IS NEVER VISIBLE */
        .youtube-player {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 330px;
            max-width: calc(100vw - 36px);
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 14px 40px rgba(0,0,0,.25);
            z-index: 500;
            display: none;
        }

        .youtube-player.active { display: block; }

        .youtube-player-head {
            min-height: 58px;
            padding: .65rem .75rem;
            background: var(--surface-2);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
        }

        .youtube-player-info {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: .65rem;
        }

        .mini-music-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex: 0 0 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0c040;
            color: #1a1a2e;
        }

        .youtube-player-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-weight: 700;
            font-size: .86rem;
        }

        .mini-playing {
            display: block;
            color: var(--muted);
            font-size: .7rem;
            margin-top: 2px;
        }

        .youtube-player-actions {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .youtube-player-actions button {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: .95rem;
        }

        .youtube-player-actions button:hover {
            background: var(--border);
        }

        /* The actual YouTube iframe is audio-only and visually hidden. */
        .youtube-frame {
            position: fixed;
            width: 1px;
            height: 1px;
            left: -10000px;
            top: -10000px;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }

        .mini-player-progress {
            height: 3px;
            background: var(--border);
        }

        .mini-player-progress span {
            display: block;
            width: 0%;
            height: 100%;
            background: #f0c040;
            transition: width .5s linear;
        }

        .youtube-player.mini {
            width: 230px !important;
        }

        .youtube-player.mini .mini-playing {
            display: none;
        }

        .youtube-player.mini .mini-music-icon {
            width: 34px;
            height: 34px;
            flex-basis: 34px;
        }

        .youtube-player.mini .youtube-player-head {
            min-height: 50px;
            padding: .5rem .6rem;
        }

        .song-actions {
            display: flex;
            gap: .55rem;
            flex-wrap: wrap;
            padding: .2rem 1.5rem .9rem;
        }
        .song-action-btn {
            padding: .45rem .8rem;
            border: 0;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
            font-size: .82rem;
            background: #f0c040;
            color: #1a1a2e;
        }
        .song-action-btn.secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        body.dark .song-action-btn.secondary {
            background: #252a36;
        }

        @media(max-width:650px) {
            .youtube-player {
                right: 10px;
                bottom: 10px;
                width: calc(100vw - 20px);
            }
        }

        @media(max-width:650px) {
            .admin-song-item {
                align-items: flex-start;
                gap: .7rem;
                flex-direction: column;
            }

            .admin-song-item .actions {
                width: 100%;
                justify-content: flex-start;
            }
        }

        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-modal {
            background: var(--surface);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
            text-align: center;
        }

        .login-modal h2 {
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .login-modal input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .login-modal .btn {
            width: 100%;
            padding: .7rem;
        }

        .login-error {
            color: #c0392b;
            font-size: .9rem;
            margin-top: .7rem;
        }

        .song-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            backdrop-filter: blur(6px);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .song-detail-overlay.active {
            display: flex;
        }

        .song-detail-modal {
            background: var(--surface);
            border-radius: 28px;
            max-width: 720px;
            width: 100%;
            padding: 2.5rem;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #888;
            cursor: pointer;
            border: none;
            background: none;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            padding-right: 2rem;
        }

        .detail-title i {
            color: #b8860b;
            margin-right: .5rem;
        }

        .detail-lyrics {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            line-height: 1.9;
            white-space: pre-line;
            color: var(--text);
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 2px solid var(--border);
            border-bottom: 2px solid var(--border);
        }

        .detail-link a {
            color: #1a6fb5;
            text-decoration: none;
        }

        .footer {
            background: #1a1a2e;
            color: rgba(255,255,255,.4);
            text-align: center;
            padding: 1.2rem;
            font-size: .8rem;
            margin-top: 2rem;
        }

        @media(max-width:650px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: .8rem;
            }

            .header-controls {
                justify-content: center;
            }

            #searchInput {
                width: 100%;
                min-width: 150px;
            }

            .songs-grid {
                grid-template-columns: 1fr;
            }

            .song-detail-modal {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>

    <div class="header-controls">

        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
            />
        </div>

        <span class="song-count" id="songCount">
            Loading...
        </span>

        <button
            class="btn btn-outline theme-btn"
            id="themeToggleBtn"
            type="button"
            title="Toggle dark/light mode"
            aria-label="Toggle dark/light mode"
        >
            <i class="fas fa-moon"></i>
        </button>

        <button
            class="btn btn-outline"
            id="adminToggleBtn"
        >
            <i class="fas fa-user-shield"></i>
            Admin
        </button>

    </div>

</header>


<!-- LOGIN -->

<div
    class="login-overlay"
    id="loginOverlay"
>

    <div class="login-modal">

        <h2>
            <i class="fas fa-lock"></i>
            Admin Login
        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin Email"
        />

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        />

        <button
            class="btn"
            id="loginBtn"
        >
            Login
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

        <p style="margin-top:1rem;font-size:.8rem;color:#999;">
            Login using your Supabase admin account
        </p>

    </div>

</div>


<!-- SONG DETAIL -->

<div
    class="song-detail-overlay"
    id="songDetailOverlay"
>

    <div class="song-detail-modal">

        <button
            class="close-btn"
            id="detailCloseBtn"
        >
            &times;
        </button>

        <div
            class="detail-title"
            id="detailTitle"
        >
            Song
        </div>

        <div
            class="detail-lyrics"
            id="detailLyrics"
        ></div>

        <div
            class="detail-link"
            id="detailLink"
        ></div>

    </div>

</div>


<main class="main">

    <!-- ADMIN PANEL -->

    <div
        class="admin-panel"
        id="adminPanel"
    >

        <input type="hidden" id="editingSongId" value="">

        <h2>
            <i class="fas fa-plus-circle"></i>
            Add New Song
        </h2>

        <div class="form-group">

            <label>
                Song Title *
            </label>

            <input
                type="text"
                id="songTitle"
                placeholder="e.g. Amazing Grace"
            />

        </div>


        <div class="form-group">

            <label>
                Lyrics *
            </label>

            <textarea
                id="songLyrics"
                placeholder="Enter full lyrics..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Audio / YouTube Link
            </label>

            <input
                type="url"
                id="songLink"
                placeholder="https://..."
            />

        </div>


        <div class="form-group">

            <label>
                Category
            </label>

            <input
                type="text"
                id="songCategory"
                placeholder="Worship"
            />

        </div>


        <div class="form-actions">

            <button
                class="btn"
                id="addSongBtn"
            >
                <i class="fas fa-save"></i>
                Add Song
            </button>

            <button
                class="btn btn-cancel"
                id="cancelEditBtn"
                type="button"
                style="display:none;"
            >
                <i class="fas fa-times"></i>
                Cancel Edit
            </button>

        </div>

        <div class="status-message" id="formStatus"></div>


        <hr style="margin:1.5rem 0;" />


        <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            "
        >

            <h3>
                Existing Songs
            </h3>

            <button
                class="btn btn-danger"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>


        <div
            class="admin-song-list"
            id="adminSongList"
        ></div>

    </div>


    <!-- PUBLIC SONGS -->

    <div
        class="songs-grid"
        id="songsGrid"
    ></div>

</main>


<!-- CUSTOM MINI PLAYER
     The YouTube iframe below is hidden completely.
     Only this custom mini-player UI is displayed. -->
<div class="youtube-player" id="youtubePlayer">
    <div class="youtube-player-head">
        <div class="youtube-player-info">
            <div class="mini-music-icon">
                <i class="fas fa-music"></i>
            </div>
            <div style="min-width:0;">
                <div class="youtube-player-title" id="youtubePlayerTitle">Now Playing</div>
                <span class="mini-playing">♪ Playing from YouTube</span>
            </div>
        </div>

        <div class="youtube-player-actions">
            <button id="youtubeMinBtn" type="button" title="Mini Player">
                <i class="fas fa-minus"></i>
            </button>
            <button id="youtubeCloseBtn" type="button" title="Stop">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <div class="mini-player-progress">
        <span id="miniPlayerProgress"></span>
    </div>

    <!-- Hidden YouTube audio source -->
    <iframe
        id="youtubeFrame"
        class="youtube-frame"
        title="Audio source"
        allow="autoplay; encrypted-media"
    ></iframe>
</div>

<footer class="footer">

    <p>
        ✝️ Jesus Songs · Powered by Branks3
    </p>

</footer>


<script>

/* ============================================================
   SUPABASE CONFIGURATION
   ============================================================ */

const SUPABASE_URL =
    "https://nlybxlbtqvueulacwwju.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_PzB8o8cCresQ496jXnimbA_UyJ0yJ-6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ============================================================
   STATE
   ============================================================ */

let songs = [];

let searchQuery = "";

let currentUser = null;


/* ============================================================
   DOM
   ============================================================ */

const grid =
    document.getElementById("songsGrid");

const searchInput =
    document.getElementById("searchInput");

const songCount =
    document.getElementById("songCount");

const adminPanel =
    document.getElementById("adminPanel");

const adminToggleBtn =
    document.getElementById("adminToggleBtn");

const loginOverlay =
    document.getElementById("loginOverlay");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");

const logoutBtn =
    document.getElementById("logoutBtn");

const addSongBtn =
    document.getElementById("addSongBtn");

const cancelEditBtn =
    document.getElementById("cancelEditBtn");

const editingSongId =
    document.getElementById("editingSongId");

const formStatus =
    document.getElementById("formStatus");

const songTitle =
    document.getElementById("songTitle");

const songLyrics =
    document.getElementById("songLyrics");

const songLink =
    document.getElementById("songLink");

const songCategory =
    document.getElementById("songCategory");

const adminSongList =
    document.getElementById("adminSongList");

const detailOverlay =
    document.getElementById("songDetailOverlay");

const detailCloseBtn =
    document.getElementById("detailCloseBtn");

const detailTitle =
    document.getElementById("detailTitle");

const detailLyrics =
    document.getElementById("detailLyrics");

const detailLink =
    document.getElementById("detailLink");

const themeToggleBtn =
    document.getElementById("themeToggleBtn");

const youtubePlayer =
    document.getElementById("youtubePlayer");

const youtubeFrame =
    document.getElementById("youtubeFrame");

const youtubePlayerTitle =
    document.getElementById("youtubePlayerTitle");

const youtubeCloseBtn =
    document.getElementById("youtubeCloseBtn");

const youtubeMinBtn =
    document.getElementById("youtubeMinBtn");

const miniPlayerProgress =
    document.getElementById("miniPlayerProgress");


/* ============================================================
   LOAD SONGS FROM SUPABASE
   ============================================================ */

async function loadSongs() {

    songCount.textContent = "Loading...";

    const {
        data,
        error
    } = await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
            ascending: true
        });


    if (error) {

        console.error(error);

        grid.innerHTML = `
            <div class="no-results">
                <i
                    class="fas fa-exclamation-triangle"
                    style="font-size:2rem;"
                ></i>

                <p>
                    Failed to load songs.
                </p>

                <small>
                    ${error.message}
                </small>
            </div>
        `;

        songCount.textContent = "0 songs";

        return;
    }


    songs = data || [];

    renderSongs();

    renderAdminList();
}


/* ============================================================
   RENDER PUBLIC SONGS
   ============================================================ */

function renderSongs() {

    const q =
        searchQuery
            .toLowerCase()
            .trim();


    const filtered =
        songs.filter(song => {

            return (
                (song.title || "")
                    .toLowerCase()
                    .includes(q)

                ||

                (song.lyrics || "")
                    .toLowerCase()
                    .includes(q)

                ||

                (song.category || "")
                    .toLowerCase()
                    .includes(q)
            );

        });


    songCount.textContent =
        `${filtered.length} song${filtered.length !== 1 ? "s" : ""}`;


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="no-results">

                <i
                    class="fas fa-music"
                    style="
                    font-size:2rem;
                    opacity:.4;
                    "
                ></i>

                <p>
                    No songs found
                </p>

            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered.map(song => {

            const preview =
                (song.lyrics || "")
                    .split("\n")
                    .filter(x => x.trim() !== "")[0]
                    || "...";


            const link =
                song.audio_url || "";


            return `

                <div
                    class="song-card"
                    data-id="${song.id}"
                >

                    <div class="song-card-header">

                        <span class="song-title">

                            <i class="fas fa-music"></i>

                            ${escapeHTML(song.title)}

                        </span>

                    </div>


                    <div class="song-card-body">

                        <div class="song-preview">

                            ${escapeHTML(preview)}

                        </div>

                    </div>


                    <div class="song-actions">
                        ${
                            link
                            ? `
                            <button
                                type="button"
                                class="song-action-btn play-song"
                                data-id="${song.id}"
                            >
                                <i class="fas fa-play"></i> Play
                            </button>
                            `
                            : ""
                        }
                        <button
                            type="button"
                            class="song-action-btn secondary view-song"
                            data-id="${song.id}"
                        >
                            <i class="far fa-eye"></i> View
                        </button>
                    </div>


                    <div class="song-footer">

                        <span>

                            <i class="far fa-eye"></i>

                            Tap to view full

                        </span>

                        <i
                            class="fas fa-arrow-right"
                            style="color:#b8860b;"
                        ></i>

                    </div>

                </div>
            `;

        }).join("");
}


/* ============================================================
   ADMIN SONG LIST
   ============================================================ */

function renderAdminList() {

    if (!currentUser) {
        adminSongList.innerHTML = "";
        return;
    }

    if (songs.length === 0) {
        adminSongList.innerHTML =
            "<p style='color:#999;'>No songs yet.</p>";
        return;
    }

    adminSongList.innerHTML =
        songs.map(song => {

            return `
                <div class="admin-song-item">

                    <span>
                        ${escapeHTML(song.title)}
                        ${
                            Number(editingSongId.value) === Number(song.id)
                            ? `<span class="edit-badge">Editing</span>`
                            : ""
                        }
                    </span>

                    <div class="actions">

                        <button
                            class="btn btn-edit edit-song"
                            data-id="${song.id}"
                            style="
                            padding:.25rem .8rem;
                            font-size:.8rem;
                            "
                        >
                            <i class="fas fa-pen"></i>
                            Edit
                        </button>

                        <button
                            class="btn btn-danger delete-song"
                            data-id="${song.id}"
                            style="
                            padding:.25rem .8rem;
                            font-size:.8rem;
                            "
                        >
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>

                    </div>

                </div>
            `;

        }).join("");

    document
        .querySelectorAll(".edit-song")
        .forEach(button => {

            button.addEventListener("click", () => {
                startEditSong(Number(button.dataset.id));
            });

        });

    document
        .querySelectorAll(".delete-song")
        .forEach(button => {

            button.addEventListener("click", () => {
                deleteSong(Number(button.dataset.id));
            });

        });
}

/* ============================================================
   OPEN SONG DETAIL
   ============================================================ */

function openDetail(song) {
    detailTitle.innerHTML = `
        <i class="fas fa-music"></i>
        ${escapeHTML(song.title)}
    `;

    detailLyrics.textContent =
        song.lyrics || "No lyrics available.";

    if (song.audio_url) {
        detailLink.innerHTML = `
            <button
                type="button"
                class="song-action-btn"
                id="detailPlayBtn"
            >
                <i class="fas fa-play"></i> Play Song
            </button>
        `;

        document.getElementById("detailPlayBtn").addEventListener("click", () => {
            playYouTube(song);
        });
    } else {
        detailLink.innerHTML = `
            <span style="color:var(--muted);">
                <i class="fas fa-info-circle"></i> No YouTube link added.
            </span>
        `;
    }

    detailOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
}


function closeDetail() {

    detailOverlay.classList.remove("active");

    document.body.style.overflow = "";
}


/* ============================================================
   DARK / LIGHT MODE
   ============================================================ */

function applyTheme(theme) {
    const isDark = theme === "dark";
    document.body.classList.toggle("dark", isDark);

    themeToggleBtn.innerHTML = isDark
        ? `<i class="fas fa-sun"></i>`
        : `<i class="fas fa-moon"></i>`;

    themeToggleBtn.title = isDark
        ? "Switch to light mode"
        : "Switch to dark mode";

    localStorage.setItem("jesusSongsTheme", theme);
}

function initTheme() {
    const savedTheme = localStorage.getItem("jesusSongsTheme");
    if (savedTheme === "dark" || savedTheme === "light") {
        applyTheme(savedTheme);
        return;
    }

    const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

    applyTheme(prefersDark ? "dark" : "light");
}

themeToggleBtn.addEventListener("click", () => {
    applyTheme(document.body.classList.contains("dark") ? "light" : "dark");
});


/* ============================================================
   YOUTUBE BACKGROUND PLAYER
   ============================================================ */

function getYouTubeId(url) {
    if (!url) return null;

    try {
        const value = String(url).trim();

        const patterns = [
            /youtu\.be\/([^?&#/]+)/i,
            /youtube\.com\/watch\?[^#]*v=([^?&#/]+)/i,
            /youtube\.com\/shorts\/([^?&#/]+)/i,
            /youtube\.com\/embed\/([^?&#/]+)/i,
            /youtube-nocookie\.com\/embed\/([^?&#/]+)/i
        ];

        for (const pattern of patterns) {
            const match = value.match(pattern);
            if (match && match[1]) return match[1];
        }

        // If the admin pasted only the 11-character video ID
        if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
            return value;
        }
    } catch (error) {
        console.error("YouTube URL parse error:", error);
    }

    return null;
}

function playYouTube(song) {
    const videoId = getYouTubeId(song.audio_url);

    if (!videoId) {
        alert(
            "This is not a valid YouTube link.\\n\\n" +
            "Use a normal YouTube URL such as:\\n" +
            "https://www.youtube.com/watch?v=VIDEO_ID"
        );
        return;
    }

    youtubePlayerTitle.textContent =
        song.title || "Now Playing";

    if (miniPlayerProgress) {
        miniPlayerProgress.style.width = "0%";
    }

    /*
      IMPORTANT:
      The YouTube iframe is completely hidden off-screen.
      The user only sees our custom mini-player.
      autoplay=1 starts the YouTube audio after the Play button click.
    */
    youtubeFrame.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1";

    youtubePlayer.classList.add("active");
    youtubePlayer.classList.remove("mini");
}

function stopYouTube() {
    youtubeFrame.src = "";
    youtubePlayer.classList.remove("active");
    youtubePlayer.classList.remove("mini");

    if (miniPlayerProgress) {
        miniPlayerProgress.style.width = "0%";
    }

    youtubePlayerTitle.textContent = "Now Playing";
}

function minimizeYouTube() {
    /*
      The player is already a mini-player.
      This button only toggles a smaller compact version.
      The hidden YouTube iframe remains loaded, so playback continues.
    */
    youtubePlayer.classList.toggle("mini");

    if (youtubePlayer.classList.contains("mini")) {
        youtubePlayer.style.width = "230px";
    } else {
        youtubePlayer.style.width = "";
    }
}

youtubeCloseBtn.addEventListener("click", stopYouTube);
youtubeMinBtn.addEventListener("click", minimizeYouTube);

/* ============================================================
   LOGIN
   ============================================================ */

async function login() {

    const email =
        loginEmail.value.trim();

    const password =
        loginPassword.value;


    if (!email || !password) {

        loginError.textContent =
            "Please enter email and password.";

        return;
    }


    loginError.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if (error) {

        console.error(error);

        loginError.textContent =
            "❌ " + error.message;

        return;
    }


    currentUser =
        data.user;


    loginOverlay.classList.remove("active");

    adminPanel.classList.add("active");


    adminToggleBtn.innerHTML =
        `<i class="fas fa-user"></i> Logout`;


    adminToggleBtn.style.background =
        "#2ecc71";

    adminToggleBtn.style.color =
        "#fff";


    renderAdminList();

    alert("✅ Admin login successful!");
}


/* ============================================================
   LOGOUT
   ============================================================ */

async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    adminPanel.classList.remove("active");


    adminToggleBtn.innerHTML =
        `<i class="fas fa-user-shield"></i> Admin`;


    adminToggleBtn.style.background = "";

    adminToggleBtn.style.color = "";


    renderAdminList();
}


/* ============================================================
   ADD SONG TO SUPABASE
   ============================================================ */

async function addSong() {

    if (!currentUser) {

        alert("Please login as admin first.");

        return;
    }

    // If an existing song is selected for editing,
    // update that song instead of inserting a new row.
    const editId = Number(editingSongId.value);

    if (editId) {
        await updateSong(editId);
        return;
    }


    const title =
        songTitle.value.trim();

    const lyrics =
        songLyrics.value.trim();

    const link =
        songLink.value.trim();

    const category =
        songCategory.value.trim();


    if (!title || !lyrics) {

        alert(
            "Song title and lyrics are required."
        );

        return;
    }


    addSongBtn.disabled = true;

    addSongBtn.textContent =
        "Saving...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("songs")
            .insert([
                {
                    title: title,
                    artist: "Jesus Songs",
                    lyrics: lyrics,
                    audio_url: link || null,
                    category: category || "Worship"
                }
            ])
            .select();


    addSongBtn.disabled = false;

    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;


    if (error) {

        console.error(error);

        alert(
            "❌ Failed to add song:\n" +
            error.message
        );

        return;
    }


    songTitle.value = "";

    songLyrics.value = "";

    songLink.value = "";

    songCategory.value = "";


    await loadSongs();


    alert("✅ Song added to Supabase!");
}


/* ============================================================
   EDIT / UPDATE SONG
   ============================================================ */

function startEditSong(id) {

    if (!currentUser) {
        alert("Please login first.");
        return;
    }

    const song = songs.find(
        s => Number(s.id) === Number(id)
    );

    if (!song) {
        alert("Song not found.");
        return;
    }

    editingSongId.value = song.id;

    songTitle.value = song.title || "";
    songLyrics.value = song.lyrics || "";
    songLink.value = song.audio_url || "";
    songCategory.value = song.category || "";

    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Update Song`;

    cancelEditBtn.style.display = "inline-block";

    formStatus.textContent =
        `Editing: ${song.title || "Untitled song"}`;

    formStatus.style.color = "#2471a3";

    renderAdminList();

    document
        .getElementById("songTitle")
        .scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    songTitle.focus();
}


function cancelEdit() {

    editingSongId.value = "";

    songTitle.value = "";
    songLyrics.value = "";
    songLink.value = "";
    songCategory.value = "";

    addSongBtn.disabled = false;

    addSongBtn.innerHTML =
        `<i class="fas fa-save"></i> Add Song`;

    cancelEditBtn.style.display = "none";

    formStatus.textContent = "";

    renderAdminList();
}


async function updateSong(id) {

    if (!currentUser) {
        alert("Please login first.");
        return;
    }

    const title =
        songTitle.value.trim();

    const lyrics =
        songLyrics.value.trim();

    const link =
        songLink.value.trim();

    const category =
        songCategory.value.trim();

    if (!title || !lyrics) {
        alert("Song title and lyrics are required.");
        return;
    }

    addSongBtn.disabled = true;
    cancelEditBtn.disabled = true;

    addSongBtn.innerHTML =
        `<i class="fas fa-spinner fa-spin"></i> Updating...`;

    formStatus.textContent = "Updating song...";
    formStatus.style.color = "#2471a3";

    const {
        error
    } =
        await supabaseClient
            .from("songs")
            .update({
                title: title,
                lyrics: lyrics,
                audio_url: link || null,
                category: category || "Worship"
            })
            .eq("id", id);

    addSongBtn.disabled = false;
    cancelEditBtn.disabled = false;

    if (error) {

        console.error(error);

        formStatus.textContent =
            "❌ Update failed: " + error.message;

        formStatus.style.color = "#c0392b";

        addSongBtn.innerHTML =
            `<i class="fas fa-save"></i> Update Song`;

        return;
    }

    cancelEdit();

    await loadSongs();

    alert("✅ Song updated successfully!");
}


/* ============================================================
   DELETE SONG
   ============================================================ */

async function deleteSong(id) {

    if (!currentUser) {

        alert("Please login first.");

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this song?"
        );


    if (!confirmed) return;


    const {
        error
    } =
        await supabaseClient
            .from("songs")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        return;
    }


    await loadSongs();


    alert("✅ Song deleted.");
}


/* ============================================================
   SEARCH
   ============================================================ */

searchInput.addEventListener(
    "input",
    function () {

        searchQuery =
            this.value;

        renderSongs();

    }
);


/* ============================================================
   ADMIN BUTTON
   ============================================================ */

adminToggleBtn.addEventListener(
    "click",
    async function () {

        if (currentUser) {

            await logout();

        } else {

            loginOverlay.classList.add("active");

            loginError.textContent = "";

            loginEmail.focus();

        }

    }
);


/* ============================================================
   LOGIN EVENTS
   ============================================================ */

loginBtn.addEventListener(
    "click",
    login
);


loginPassword.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            login();

        }

    }
);


loginEmail.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            login();

        }

    }
);


/* ============================================================
   CLOSE LOGIN
   ============================================================ */

loginOverlay.addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            loginOverlay.classList.remove("active");

        }

    }
);


/* ============================================================
   CLOSE SONG DETAIL
   ============================================================ */

detailCloseBtn.addEventListener(
    "click",
    closeDetail
);


detailOverlay.addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            closeDetail();

        }

    }
);


document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape" &&
            detailOverlay.classList.contains("active")
        ) {

            closeDetail();

        }

    }
);


/* ============================================================
   PLAY / VIEW BUTTONS
   ============================================================ */

grid.addEventListener("click", function(e) {
    const playButton = e.target.closest(".play-song");
    const viewButton = e.target.closest(".view-song");

    if (!playButton && !viewButton) return;

    e.stopPropagation();

    const id = Number(
        (playButton || viewButton).dataset.id
    );

    const song = songs.find(
        s => Number(s.id) === id
    );

    if (!song) return;

    if (playButton) {
        playYouTube(song);
    } else {
        openDetail(song);
    }
});


/* ============================================================
   SONG CARD CLICK
   ============================================================ */

grid.addEventListener(
    "click",
    function(e) {

        if (e.target.closest("a, button")) {
            return;
        }


        const card =
            e.target.closest(".song-card");


        if (!card) return;


        const id =
            Number(card.dataset.id);


        const song =
            songs.find(
                s => Number(s.id) === id
            );


        if (song) {

            openDetail(song);

        }

    }
);


/* ============================================================
   ADD SONG
   ============================================================ */

addSongBtn.addEventListener(
    "click",
    addSong
);

cancelEditBtn.addEventListener(
    "click",
    cancelEdit
);


/* ============================================================
   LOGOUT
   ============================================================ */

logoutBtn.addEventListener(
    "click",
    logout
);


/* ============================================================
   SECURITY HELPERS
   ============================================================ */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHTML(value);
}


/* ============================================================
   CHECK EXISTING LOGIN SESSION
   ============================================================ */

async function checkUser() {

    const {
        data
    } =
        await supabaseClient.auth.getUser();


    if (data && data.user) {

        currentUser =
            data.user;

        adminPanel.classList.add("active");

        adminToggleBtn.innerHTML =
            `<i class="fas fa-user"></i> Logout`;

        adminToggleBtn.style.background =
            "#2ecc71";

        adminToggleBtn.style.color =
            "#fff";

    }

}


/* ============================================================
   START
   ============================================================ */

async function init() {

    initTheme();

    await checkUser();

    await loadSongs();

}


init();


/* ============================================================
   AUTH STATE LISTENER
   ============================================================ */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (session && session.user) {

            currentUser =
                session.user;

        } else {

            currentUser = null;

        }

    }
);

</script>
