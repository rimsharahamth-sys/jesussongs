<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jesus Songs · Search &amp; Play</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ============================================================
                   ROOT VARIABLES
                   ============================================================ */
        :root {
            --body-bg: #f7f3ee;
            --body-text: #222;
            --card-bg: #fff;
            --panel-bg: #fff;
            --modal-bg: #fff;
            --header-bg-1: #1a1a2e;
            --header-bg-2: #16213e;
            --header-text: #f5e6d3;
            --primary: #f0c040;
            --primary-dark: #b8860b;
            --title-color: #1a1a2e;
            --text-color: #222;
            --muted-text: #777;
            --preview-color: #555;
            --border-color: #eee;
            --soft-border: #f0ebe5;
            --input-bg: #fff;
            --input-text: #222;
            --input-border: #ddd;
            --link-color: #1a6fb5;
            --footer-bg: #1a1a2e;
            --footer-text: rgba(255, 255, 255, .4);
            --shadow: rgba(0, 0, 0, .08);
            --strong-shadow: rgba(0, 0, 0, .15);
            --overlay: rgba(0, 0, 0, .65);
            --yt-badge: #ff0000;
        }

        body.dark-mode {
            --body-bg: #101114;
            --body-text: #eee;
            --card-bg: #1b1d22;
            --panel-bg: #1b1d22;
            --modal-bg: #1b1d22;
            --header-bg-1: #08090d;
            --header-bg-2: #151923;
            --title-color: #f5f5f5;
            --text-color: #eee;
            --muted-text: #a8a8a8;
            --preview-color: #bdbdbd;
            --border-color: #30333b;
            --soft-border: #353841;
            --input-bg: #111318;
            --input-text: #eee;
            --input-border: #3b3e47;
            --link-color: #5eb7ff;
            --footer-bg: #08090d;
            --footer-text: rgba(255, 255, 255, .55);
            --shadow: rgba(0, 0, 0, .35);
            --strong-shadow: rgba(0, 0, 0, .55);
            --overlay: rgba(0, 0, 0, .78);
            --yt-badge: #cc0000;
        }

        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--body-bg);
            color: var(--body-text);
            min-height: 100vh;
            transition: .3s;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            background: linear-gradient(135deg, var(--header-bg-1), var(--header-bg-2));
            color: var(--header-text);
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.9rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .header h1 i {
            color: var(--primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* ---- search ---- */
        .search-wrap {
            position: relative;
        }
        .search-wrap i.fa-search {
            position: absolute;
            left: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, .5);
        }
        #searchInput {
            padding: .65rem 2.7rem .65rem 2.2rem;
            border: none;
            border-radius: 30px;
            font-size: .95rem;
            background: rgba(255, 255, 255, .15);
            color: #fff;
            outline: 2px solid transparent;
            transition: .3s;
            min-width: 260px;
        }
        #searchInput::placeholder {
            color: rgba(255, 255, 255, .6);
        }
        #searchInput:focus {
            outline-color: var(--primary);
            background: rgba(255, 255, 255, .25);
        }
        .search-clear {
            position: absolute;
            right: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, .65);
            cursor: pointer;
            display: none;
        }
        .search-clear.active {
            display: block;
        }

        /* ---- buttons ---- */
        .btn {
            padding: .5rem 1.2rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: .25s;
            background: var(--primary);
            color: #1a1a2e;
        }
        .btn:hover {
            transform: scale(1.03);
            opacity: .9;
        }
        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #1a1a2e;
        }
        .btn-danger {
            background: #c0392b;
            color: #fff;
        }
        .btn-edit {
            background: #3498db;
            color: #fff;
        }
        .btn-cancel {
            background: #777;
            color: #fff;
        }
        .btn-yt {
            background: #ff0000;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
        }
        .btn-yt:hover {
            background: #cc0000;
        }

        #themeToggleBtn {
            min-width: 48px;
            height: 42px;
            padding: .5rem .9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: .25s;
        }
        #themeToggleBtn:hover {
            background: var(--primary);
            color: #1a1a2e;
            transform: scale(1.05);
        }

        .song-count {
            font-size: .9rem;
            color: rgba(255, 255, 255, .7);
        }

        /* ============================================================
                   MAIN
                   ============================================================ */
        .main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* ---- search status ---- */
        .search-status {
            margin-bottom: 1rem;
            display: none;
            padding: .75rem 1rem;
            background: var(--card-bg);
            border-radius: 12px;
            color: var(--muted-text);
            box-shadow: 0 4px 15px var(--shadow);
            font-size: .9rem;
        }
        .search-status.active {
            display: block;
        }

        /* ---- tabs ---- */
        .search-tabs {
            display: flex;
            gap: .5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .search-tab {
            padding: .5rem 1.2rem;
            border-radius: 30px;
            border: 2px solid var(--input-border);
            background: transparent;
            color: var(--muted-text);
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
            transition: .25s;
        }
        .search-tab:hover {
            border-color: var(--primary);
            color: var(--text-color);
        }
        .search-tab.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #1a1a2e;
        }
        .search-tab i {
            margin-right: .4rem;
        }

        /* ---- grid ---- */
        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* ---- card ---- */
        .song-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 6px 20px var(--shadow);
            transition: .3s;
            border-left: 5px solid var(--primary-dark);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }
        .song-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px var(--strong-shadow);
        }
        .song-card.yt-card {
            border-left-color: var(--yt-badge);
        }
        .song-card.yt-card .song-title i {
            color: var(--yt-badge);
        }

        .song-card-header {
            padding: 1.2rem 1.5rem .5rem;
        }
        .song-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--title-color);
        }
        .song-title i {
            color: var(--primary-dark);
            margin-right: .4rem;
        }
        .song-card-body {
            padding: 0 1.5rem .8rem;
            flex: 1;
        }
        .song-preview {
            color: var(--preview-color);
            font-style: italic;
            font-size: .9rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .song-link {
            padding: 0 1.5rem .7rem;
        }
        .song-link a {
            color: var(--link-color);
            text-decoration: none;
            font-size: .9rem;
        }
        .song-link a:hover {
            text-decoration: underline;
        }
        .song-footer {
            padding: .7rem 1.5rem 1rem;
            border-top: 1px solid var(--soft-border);
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            color: var(--muted-text);
        }
        .song-footer .yt-channel {
            color: var(--muted-text);
            font-size: .75rem;
        }

        .yt-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: .5rem;
        }
        .yt-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .3s;
        }
        .song-card:hover .yt-thumb img {
            transform: scale(1.02);
        }
        .yt-badge {
            display: inline-block;
            background: var(--yt-badge);
            color: #fff;
            font-size: .65rem;
            font-weight: 700;
            padding: .15rem .6rem;
            border-radius: 12px;
            margin-left: .4rem;
            vertical-align: middle;
        }

        /* ---- no results ---- */
        .no-results {
            text-align: center;
            padding: 5rem 2rem;
            grid-column: 1 / -1;
            color: var(--muted-text);
        }
        .no-results-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--primary-dark);
            opacity: .8;
        }
        .no-results-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: .5rem;
        }
        .no-results-text {
            font-size: .95rem;
            color: var(--muted-text);
        }

        /* ============================================================
                   ADMIN
                   ============================================================ */
        .admin-panel {
            display: none;
            background: var(--panel-bg);
            color: var(--text-color);
            border-radius: 20px;
            box-shadow: 0 8px 30px var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .admin-panel.active {
            display: block;
        }
        .admin-panel h2,
        .admin-panel h3 {
            color: var(--title-color);
        }
        .admin-panel h2 {
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: .3rem;
            color: var(--text-color);
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: .7rem 1rem;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: .95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
            transition: .25s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(240, 192, 64, .12);
        }
        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: .7rem;
            flex-wrap: wrap;
        }
        .status-message {
            margin-top: .8rem;
            font-size: .9rem;
            min-height: 1.2rem;
        }

        .admin-song-list {
            margin-top: 2rem;
            border-top: 2px dashed var(--input-border);
            padding-top: 1.5rem;
        }
        .admin-song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .7rem 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .admin-song-item .actions {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .edit-badge {
            display: inline-block;
            margin-left: .5rem;
            padding: .2rem .55rem;
            border-radius: 12px;
            background: #eaf4ff;
            color: #2471a3;
            font-size: .72rem;
            font-weight: 700;
        }

        /* ============================================================
                   LOGIN
                   ============================================================ */
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .login-overlay.active {
            display: flex;
        }
        .login-modal {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px var(--strong-shadow);
            text-align: center;
        }
        .login-modal h2 {
            margin-bottom: 1.5rem;
            color: var(--title-color);
        }
        .login-modal input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
        }
        .login-modal input:focus {
            border-color: var(--primary);
        }
        .login-modal .btn {
            width: 100%;
            padding: .7rem;
        }
        .login-error {
            color: #e74c3c;
            font-size: .9rem;
            margin-top: .7rem;
        }

        /* ============================================================
                   DETAIL OVERLAY
                   ============================================================ */
        .song-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(6px);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .song-detail-overlay.active {
            display: flex;
        }
        .song-detail-modal {
            background: var(--modal-bg);
            color: var(--text-color);
            border-radius: 28px;
            max-width: 720px;
            width: 100%;
            padding: 2.5rem;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px var(--strong-shadow);
        }
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: var(--muted-text);
            cursor: pointer;
            border: none;
            background: none;
        }
        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--title-color);
            padding-right: 2rem;
        }
        .detail-title i {
            color: var(--primary-dark);
            margin-right: .5rem;
        }
        .detail-lyrics {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            line-height: 1.9;
            white-space: pre-line;
            color: var(--text-color);
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 2px solid var(--soft-border);
            border-bottom: 2px solid var(--soft-border);
        }
        .detail-link a {
            color: var(--link-color);
            text-decoration: none;
        }
        .detail-yt-embed {
            margin-top: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .detail-yt-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
                   FOOTER
                   ============================================================ */
        .footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 1.2rem;
            font-size: .8rem;
            margin-top: 2rem;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media(max-width:650px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: .8rem;
            }
            .header-controls {
                justify-content: center;
            }
            #searchInput {
                width: 100%;
                min-width: 150px;
            }
            .songs-grid {
                grid-template-columns: 1fr;
            }
            .song-detail-modal {
                padding: 1.5rem;
            }
            .admin-song-item {
                align-items: flex-start;
                gap: .7rem;
                flex-direction: column;
            }
            .admin-song-item .actions {
                width: 100%;
                justify-content: flex-start;
            }
            .detail-title {
                font-size: 1.5rem;
            }
            .search-tabs {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="header">
        <h1>
            <i class="fas fa-cross"></i>
            Jesus Songs
        </h1>

        <div class="header-controls">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search songs..." autocomplete="off" />
                <i class="fas fa-times search-clear" id="searchClear"></i>
            </div>

            <span class="song-count" id="songCount">Loading...</span>

            <button id="themeToggleBtn" title="Change Theme">
                <i class="fas fa-moon" id="themeIcon"></i>
                <span id="themeText">Dark</span>
            </button>

            <button class="btn btn-outline" id="adminToggleBtn">
                <i class="fas fa-user-shield"></i> Admin
            </button>
        </div>
    </header>

    <!-- ============================================================
    LOGIN
    ============================================================ -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <input type="email" id="loginEmail" placeholder="Admin Email" />
            <input type="password" id="loginPassword" placeholder="Password" />
            <button class="btn" id="loginBtn">Login</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ============================================================
    SONG DETAIL
    ============================================================ -->
    <div class="song-detail-overlay" id="songDetailOverlay">
        <div class="song-detail-modal">
            <button class="close-btn" id="detailCloseBtn">&times;</button>
            <div class="detail-title" id="detailTitle">Song</div>
            <div class="detail-lyrics" id="detailLyrics"></div>
            <div class="detail-link" id="detailLink"></div>
            <div class="detail-yt-embed" id="detailYtEmbed" style="display:none;"></div>
        </div>
    </div>

    <!-- ============================================================
    MAIN
    ============================================================ -->
    <main class="main">

        <!-- search status -->
        <div class="search-status" id="searchStatus"></div>

        <!-- tabs: Local + YouTube -->
        <div class="search-tabs" id="searchTabs">
            <button class="search-tab active" data-tab="local">
                <i class="fas fa-database"></i> Local
            </button>
            <button class="search-tab" data-tab="youtube">
                <i class="fab fa-youtube"></i> YouTube
            </button>
            <button class="search-tab" data-tab="all">
                <i class="fas fa-globe"></i> All
            </button>
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <input type="hidden" id="editingSongId" value="" />

            <h2><i class="fas fa-plus-circle"></i> Add New Song</h2>

            <div class="form-group">
                <label>Song Title *</label>
                <input type="text" id="songTitle" placeholder="e.g. Amazing Grace" />
            </div>

            <div class="form-group">
                <label>Lyrics *</label>
                <textarea id="songLyrics" placeholder="Enter full lyrics..."></textarea>
            </div>

            <div class="form-group">
                <label>Audio / YouTube Link</label>
                <input type="url" id="songLink" placeholder="https://..." />
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="songCategory" placeholder="Worship" />
            </div>

            <div class="form-actions">
                <button class="btn" id="addSongBtn">
                    <i class="fas fa-save"></i> Add Song
                </button>
                <button class="btn btn-cancel" id="cancelEditBtn" type="button" style="display:none;">
                    <i class="fas fa-times"></i> Cancel Edit
                </button>
            </div>

            <div class="status-message" id="formStatus"></div>

            <hr style="margin:1.5rem 0; border:none; border-top:1px solid var(--border-color);" />

            <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem;">
                <h3>Existing Songs</h3>
                <button class="btn btn-danger" id="logoutBtn">Logout</button>
            </div>

            <div class="admin-song-list" id="adminSongList"></div>
        </div>

        <!-- SONGS GRID -->
        <div class="songs-grid" id="songsGrid"></div>

    </main>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <footer class="footer">
        <p>✝️ Jesus Songs · Powered by Branks3</p>
    </footer>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        /* ============================================================
                   SUPABASE
                   ============================================================ */
        const SUPABASE_URL = "https://jxbjjbmwlqjfonnuhjrx.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D9ppxxYrbWMUsMxTnxdnhA_hQORxcXH";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        /* ============================================================
                   STATE
                   ============================================================ */
        let songs = [];
        let searchQuery = "";
        let currentUser = null;
        let activeTab = "local"; // 'local' | 'youtube' | 'all'
        let youtubeResults = [];
        let isYoutubeSearching = false;

        /* ============================================================
                   TELUGU TRANSLITERATION (kept from original)
                   ============================================================ */
        const TELUGU_VOWELS = { "అ": "a", "ఆ": "aa", "ఇ": "i", "ఈ": "ee", "ఉ": "u", "ఊ": "oo", "ఋ": "ru", "ఎ": "e",
            "ఏ": "ee", "ఐ": "ai", "ఒ": "o", "ఓ": "oo", "ఔ": "au" };
        const TELUGU_CONSONANTS = { "క": "k", "ఖ": "kh", "గ": "g", "ఘ": "gh", "ఙ": "ng", "చ": "ch", "ఛ": "chh", "జ": "j",
            "ఝ": "jh", "ఞ": "ny", "ట": "t", "ఠ": "th", "డ": "d", "ఢ": "dh", "ణ": "n", "త": "t", "థ": "th", "ద": "d",
            "ధ": "dh", "న": "n", "ప": "p", "ఫ": "ph", "బ": "b", "భ": "bh", "మ": "m", "య": "y", "ర": "r", "ల": "l",
            "వ": "v", "శ": "sh", "ష": "sh", "స": "s", "హ": "h", "ళ": "l", "ఱ": "r"
        };
        const TELUGU_SIGNS = { "ా": "aa", "ి": "i", "ీ": "ee", "ు": "u", "ూ": "oo", "ృ": "ru", "ె": "e", "ే": "ee",
            "ై": "ai", "ొ": "o", "ో": "oo", "ౌ": "au" };
        const TELUGU_SPECIAL = { "ం": "m", "ః": "h", "ఁ": "m" };

        function transliterateTelugu(text) {
            if (!text) return "";
            const chars = Array.from(String(text));
            let result = "";
            for (let i = 0; i < chars.length; i++) {
                const ch = chars[i];
                if (TELUGU_VOWELS[ch]) { result += TELUGU_VOWELS[ch]; continue; }
                if (TELUGU_SPECIAL[ch]) { result += TELUGU_SPECIAL[ch]; continue; }
                if (TELUGU_CONSONANTS[ch]) {
                    const base = TELUGU_CONSONANTS[ch];
                    const next = chars[i + 1];
                    if (next && TELUGU_SIGNS[next]) { result += base + TELUGU_SIGNS[next];
                        i++; continue; }
                    if (next === "్") { result += base;
                        i++; continue; }
                    result += base + "a";
                    continue;
                }
                if (ch === "్") continue;
                result += ch;
            }
            return result;
        }

        function normalizeBasic(text) {
            if (!text) return "";
            return String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\u200B-\u200D\uFEFF]/g,
                "").replace(/[’‘`]/g, "'").replace(/[^a-z0-9\u0C00-\u0C7F\s']/gi, " ").replace(/\s+/g, " ").trim();
        }

        function tokenize(text) {
            return normalizeBasic(text).split(/\s+/).filter(w => w.length > 0);
        }

        function levenshtein(a, b) {
            a = String(a || "");
            b = String(b || "");
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;
            let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
            for (let i = 0; i < a.length; i++) {
                const curr = [i + 1];
                for (let j = 0; j < b.length; j++) {
                    const insert = curr[j] + 1;
                    const remove = prev[j + 1] + 1;
                    const replace = prev[j] + (a[i] === b[j] ? 0 : 1);
                    curr.push(Math.min(insert, remove, replace));
                }
                prev = curr;
            }
            return prev[b.length];
        }

        function fuzzyTokenMatch(queryWord, targetWords) {
            if (!queryWord) return false;
            for (const target of targetWords) {
                if (!target) continue;
                if (target === queryWord) return true;
                if (target.startsWith(queryWord) || queryWord.startsWith(target)) {
                    if (Math.abs(target.length - queryWord.length) <= 2) return true;
                }
                if (queryWord.length >= 4 && target.length >= 4) {
                    const dist = levenshtein(queryWord, target);
                    const allowed = queryWord.length >= 7 ? 2 : 1;
                    if (dist <= allowed) return true;
                }
            }
            return false;
        }

        function buildSearchData(song) {
            const title = song.title || "";
            const artist = song.artist || "";
            const lyrics = song.lyrics || "";
            const category = song.category || "";
            const original = normalizeBasic(`${title} ${artist} ${lyrics} ${category}`);
            const titleOriginal = normalizeBasic(title);
            const titleRoman = normalizeBasic(transliterateTelugu(title));
            const lyricsRoman = normalizeBasic(transliterateTelugu(lyrics));
            const artistRoman = normalizeBasic(transliterateTelugu(artist));
            const categoryRoman = normalizeBasic(transliterateTelugu(category));
            return { original, titleOriginal, titleRoman, lyricsRoman, artistRoman, categoryRoman, allRoman: normalizeBasic(
                    transliterateTelugu(`${title} ${artist} ${lyrics} ${category}`)) };
        }

        function getQueryVariants(query) {
            const raw = normalizeBasic(query);
            const teluguToRoman = normalizeBasic(transliterateTelugu(query));
            const variants = new Set();
            if (raw) variants.add(raw);
            if (teluguToRoman) variants.add(teluguToRoman);
            // simple variants
            const alt = [raw, teluguToRoman].filter(Boolean);
            alt.forEach(s => {
                variants.add(s.replace(/aa/g, "a").replace(/ee/g, "i").replace(/oo/g, "u"));
                variants.add(s.replace(/ee/g, "e").replace(/aa/g, "a").replace(/oo/g, "o"));
                variants.add(s.replace(/sh/g, "s").replace(/chh/g, "ch").replace(/kh/g, "k"));
            });
            return [...variants];
        }

        function scoreSong(song, query) {
            if (!query) return 0;
            const data = buildSearchData(song);
            const qVariants = getQueryVariants(query);
            const qWords = tokenize(query);
            let best = 0;

            for (const q of qVariants) {
                if (q === data.titleOriginal || q === data.titleRoman) best = Math.max(best, 1000);
                if (data.titleOriginal.startsWith(q) || data.titleRoman.startsWith(q)) best = Math.max(best, 850);
                if (q.length >= 2 && (data.titleOriginal.includes(q) || data.titleRoman.includes(q))) best = Math.max(best,
                700);
            }

            const titleWords = [...tokenize(data.titleOriginal), ...tokenize(data.titleRoman)];
            let matches = 0;
            for (const qw of qWords) {
                const vars = getQueryVariants(qw);
                let matched = false;
                for (const v of vars) { if (fuzzyTokenMatch(v, titleWords)) { matched = true; break; } }
                if (matched) matches++;
            }
            if (qWords.length > 0 && matches === qWords.length) best = Math.max(best, 800);
            else if (matches > 0) best = Math.max(best, 500 + matches * 30);

            for (const q of qVariants) {
                if (q.length >= 2 && data.lyricsRoman.includes(q)) best = Math.max(best, 300);
                if (q.length >= 2 && data.original.includes(q)) best = Math.max(best, 250);
                if (data.artistRoman.includes(q)) best = Math.max(best, 200);
                if (data.categoryRoman.includes(q)) best = Math.max(best, 100);
            }
            return best;
        }

        function escapeHTML(v) { return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        function escapeAttribute(v) { return escapeHTML(v); }

        /* ============================================================
                   YOUTUBE API (no key required — uses public oEmbed + search via no-key endpoint)
                   We'll use the YouTube Data API v3 with a public demo key.
                   The user can replace with their own key.
                   ============================================================ */
        // ⚠️ Replace with your own YouTube Data API v3 key if needed.
        // This is a public demo key with limited quota.
        const YOUTUBE_API_KEY = "AIzaSyD5-1hGgtmG7QJKYZ0LNLTHSdU1K5wN0X0";

        async function searchYouTube(query) {
            if (!query.trim()) return [];
            const q = encodeURIComponent(query.trim());
            const url =
                `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${q}&key=${YOUTUBE_API_KEY}`;

            try {
                const resp = await fetch(url);
                if (!resp.ok) {
                    console.warn("YouTube API error:", resp.status);
                    return [];
                }
                const data = await resp.json();
                if (!data.items) return [];
                return data.items.map(item => ({
                    id: item.id.videoId,
                    title: item.snippet.title,
                    description: item.snippet.description,
                    thumbnail: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url || "",
                    channelTitle: item.snippet.channelTitle,
                    publishedAt: item.snippet.publishedAt,
                }));
            } catch (e) {
                console.warn("YouTube search failed:", e);
                return [];
            }
        }

        /* ============================================================
                   RENDER — unified
                   ============================================================ */
        async function render() {
            const q = searchQuery.trim();
            const tab = activeTab;

            // ---- local results ----
            let localItems = [];
            if (q) {
                localItems = songs.map(s => ({ song: s, score: scoreSong(s, q) })).filter(item => item.score > 0).sort((a,
                    b) => b.score - a.score);
            } else {
                localItems = songs.map(s => ({ song: s, score: 0 }));
            }

            // ---- youtube results ----
            let ytItems = [];
            if (q && (tab === "youtube" || tab === "all")) {
                if (!isYoutubeSearching) {
                    isYoutubeSearching = true;
                    try {
                        const raw = await searchYouTube(q + " song");
                        ytItems = raw.map(r => ({
                            id: r.id,
                            title: r.title,
                            description: r.description,
                            thumbnail: r.thumbnail,
                            channelTitle: r.channelTitle,
                            publishedAt: r.publishedAt,
                            isYoutube: true,
                            score: 500 // fixed score for youtube
                        }));
                    } catch (e) { console.warn(e); }
                    isYoutubeSearching = false;
                }
            }

            // ---- combine based on tab ----
            let combined = [];
            if (tab === "local") {
                combined = localItems.map(item => ({ ...item.song, isYoutube: false, _score: item.score }));
            } else if (tab === "youtube") {
                combined = ytItems.map(item => ({ ...item, isYoutube: true, _score: item.score || 0 }));
            } else { // all
                const localMapped = localItems.map(item => ({ ...item.song, isYoutube: false, _score: item.score }));
                const ytMapped = ytItems.map(item => ({ ...item, isYoutube: true, _score: item.score || 0 }));
                combined = [...localMapped, ...ytMapped];
                // sort by score desc
                combined.sort((a, b) => (b._score || 0) - (a._score || 0));
            }

            // ---- update count ----
            const total = combined.length;
            songCount.textContent = `${total} result${total !== 1 ? "s" : ""}`;

            // ---- search status ----
            if (q) {
                searchStatus.classList.add("active");
                searchStatus.innerHTML =
                    `<i class="fas fa-search"></i> Showing <strong>${total}</strong> result${total !== 1 ? "s" : ""} for <strong>"${escapeHTML(q)}"</strong> ${tab !== "local" ? '· <i class="fab fa-youtube"></i> YouTube included' : ''}`;
            } else {
                searchStatus.classList.remove("active");
            }

            // ---- render grid ----
            if (!combined.length) {
                grid.innerHTML =
                    `<div class="no-results"><div class="no-results-icon"><i class="fas fa-search"></i></div><div class="no-results-title">${q ? 'No matching songs found' : 'No data found'}</div><div class="no-results-text">${q ? 'Try a different search term.' : 'Admin hasn\'t added any songs yet.'}</div></div>`;
                return;
            }

            grid.innerHTML = combined.map(item => {
                const isYt = item.isYoutube === true;
                const title = item.title || "Untitled";
                const desc = item.description || (item.lyrics || "").split("\n").filter(x => x.trim())[0] || "...";
                const link = isYt ? `https://www.youtube.com/watch?v=${item.id}` : (item.audio_url || "");
                const thumb = isYt ? item.thumbnail : "";
                const channel = isYt ? item.channelTitle : "";
                const idVal = isYt ? item.id : item.id;

                let previewHtml = "";
                if (isYt && thumb) {
                    previewHtml =
                        `<div class="yt-thumb"><img src="${escapeAttribute(thumb)}" alt="${escapeHTML(title)}" loading="lazy" /></div>`;
                }
                previewHtml += `<div class="song-preview">${escapeHTML(desc)}</div>`;

                let linkHtml = "";
                if (link) {
                    linkHtml =
                        `<div class="song-link"><a href="${escapeAttribute(link)}" target="_blank" rel="noopener noreferrer"><i class="fas fa-${isYt ? 'play-circle' : 'play-circle'}"></i> ${isYt ? 'Watch on YouTube' : 'Play / Watch'}</a></div>`;
                }

                let footerHtml =
                    `<span><i class="far fa-eye"></i> ${isYt ? 'Watch' : 'Tap to view full'}</span>`;
                if (isYt && channel) {
                    footerHtml += `<span class="yt-channel"><i class="fab fa-youtube"></i> ${escapeHTML(channel)}</span>`;
                } else {
                    footerHtml +=
                        `<i class="fas fa-arrow-right" style="color:var(--primary-dark);"></i>`;
                }

                const cardClass = `song-card${isYt ? ' yt-card' : ''}`;
                const icon = isYt ? 'fab fa-youtube' : 'fas fa-music';

                return `
                        <div class="${cardClass}" data-id="${escapeAttribute(idVal)}" data-yt="${isYt ? 'true' : 'false'}">
                            <div class="song-card-header">
                                <span class="song-title">
                                    <i class="${icon}"></i>
                                    ${escapeHTML(title)}
                                    ${isYt ? '<span class="yt-badge">YouTube</span>' : ''}
                                </span>
                            </div>
                            <div class="song-card-body">
                                ${previewHtml}
                            </div>
                            ${linkHtml}
                            <div class="song-footer">
                                ${footerHtml}
                            </div>
                        </div>
                    `;
            }).join("");

            // re-bind card clicks
            document.querySelectorAll(".song-card").forEach(card => {
                card.addEventListener("click", function(e) {
                    if (e.target.closest("a")) return;
                    const id = this.dataset.id;
                    const isYt = this.dataset.yt === "true";
                    if (isYt) {
                        // open YouTube video in detail
                        const ytItem = ytItems.find(i => i.id === id);
                        if (ytItem) openYoutubeDetail(ytItem);
                    } else {
                        const song = songs.find(s => String(s.id) === String(id));
                        if (song) openDetail(song);
                    }
                });
            });
        }

        /* ============================================================
                   CRUD OPERATIONS (unchanged from original, with small fixes)
                   ============================================================ */
        async function addSong() {
            if (!currentUser) { alert("Please login as admin first."); return; }
            const editId = Number(editingSongId.value);
            if (editId) { await updateSong(editId); return; }
            const title = songTitle.value.trim();
            const lyrics = songLyrics.value.trim();
            const link = songLink.value.trim();
            const category = songCategory.value.trim();
            if (!title || !lyrics) { alert("Song title and lyrics are required."); return; }
            addSongBtn.disabled = true;
            addSongBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;
            const { error } = await supabaseClient.from("songs").insert([{ title, artist: "Jesus Songs", lyrics,
                    audio_url: link || null, category: category || "Worship" }]);
            addSongBtn.disabled = false;
            addSongBtn.innerHTML = `<i class="fas fa-save"></i> Add Song`;
            if (error) { console.error(error);
                alert("❌ Failed to add song:\n\n" + error.message); return; }
            cancelEdit();
            await loadSongs();
            alert("✅ Song added successfully!");
        }

        function startEditSong(id) {
            const song = songs.find(s => Number(s.id) === Number(id));
            if (!song) return;
            editingSongId.value = song.id;
            songTitle.value = song.title || "";
            songLyrics.value = song.lyrics || "";
            songLink.value = song.audio_url || "";
            songCategory.value = song.category || "";
            addSongBtn.innerHTML = `<i class="fas fa-save"></i> Update Song`;
            cancelEditBtn.style.display = "inline-block";
            formStatus.textContent = `Editing: ${song.title}`;
            formStatus.style.color = "#2471a3";
            renderAdminList();
            songTitle.scrollIntoView({ behavior: "smooth", block: "center" });
            songTitle.focus();
        }

        function cancelEdit() {
            editingSongId.value = "";
            songTitle.value = "";
            songLyrics.value = "";
            songLink.value = "";
            songCategory.value = "";
            addSongBtn.disabled = false;
            addSongBtn.innerHTML = `<i class="fas fa-save"></i> Add Song`;
            cancelEditBtn.disabled = false;
            cancelEditBtn.style.display = "none";
            formStatus.textContent = "";
            renderAdminList();
        }

        async function updateSong(id) {
            const title = songTitle.value.trim();
            const lyrics = songLyrics.value.trim();
            const link = songLink.value.trim();
            const category = songCategory.value.trim();
            if (!title || !lyrics) { alert("Song title and lyrics are required."); return; }
            addSongBtn.disabled = true;
            cancelEditBtn.disabled = true;
            addSongBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Updating...`;
            const { error } = await supabaseClient.from("songs").update({ title, lyrics, audio_url: link || null,
                    category: category || "Worship" }).eq("id", id);
            addSongBtn.disabled = false;
            cancelEditBtn.disabled = false;
            if (error) {
                console.error(error);
                formStatus.textContent = "❌ Update failed: " + error.message;
                formStatus.style.color = "#c0392b";
                addSongBtn.innerHTML = `<i class="fas fa-save"></i> Update Song`;
                return;
            }
            cancelEdit();
            await loadSongs();
            alert("✅ Song updated successfully!");
        }

        async function deleteSong(id) {
            if (!currentUser) return;
            if (!confirm("Are you sure you want to delete this song?")) return;
            const { error } = await supabaseClient.from("songs").delete().eq("id", id);
            if (error) { console.error(error);
                alert("❌ Delete failed:\n\n" + error.message); return; }
            if (Number(editingSongId.value) === Number(id)) cancelEdit();
            await loadSongs();
            alert("✅ Song deleted successfully.");
        }

        /* ============================================================
                   LOGIN / LOGOUT
                   ============================================================ */
        async function login() {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) { loginError.textContent = "Please enter email and password."; return; }
            loginError.textContent = "Logging in...";
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { console.error(error);
                loginError.textContent = "❌ " + error.message; return; }
            currentUser = data.user;
            loginOverlay.classList.remove("active");
            adminPanel.classList.add("active");
            setAdminButton();
            renderAdminList();
            loginEmail.value = "";
            loginPassword.value = "";
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            adminPanel.classList.remove("active");
            resetAdminButton();
            cancelEdit();
            renderAdminList();
        }

        function setAdminButton() {
            adminToggleBtn.innerHTML = `<i class="fas fa-user"></i> Logout`;
            adminToggleBtn.style.background = "#2ecc71";
            adminToggleBtn.style.color = "#fff";
        }

        function resetAdminButton() {
            adminToggleBtn.innerHTML = `<i class="fas fa-user-shield"></i> Admin`;
            adminToggleBtn.style.background = "";
            adminToggleBtn.style.color = "";
        }

        /* ============================================================
                   EVENT BINDINGS
                   ============================================================ */
        // Search
        searchInput.addEventListener("input", function() {
            searchQuery = this.value;
            searchClear.classList.toggle("active", !!this.value.trim());
            render();
        });

        searchClear.addEventListener("click", function() {
            searchInput.value = "";
            searchQuery = "";
            searchClear.classList.remove("active");
            searchInput.focus();
            render();
        });

        // Tabs
        searchTabs.addEventListener("click", function(e) {
            const tabBtn = e.target.closest(".search-tab");
            if (!tabBtn) return;
            document.querySelectorAll(".search-tab").forEach(t => t.classList.remove("active"));
            tabBtn.classList.add("active");
            activeTab = tabBtn.dataset.tab;
            render();
        });

        // Admin toggle
        adminToggleBtn.addEventListener("click", async function() {
            if (currentUser) { await logout(); return; }
            loginOverlay.classList.add("active");
            loginError.textContent = "";
            loginEmail.focus();
        });

        // Login
        loginBtn.addEventListener("click", login);
        loginPassword.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
        loginEmail.addEventListener("keydown", e => { if (e.key === "Enter") login(); });

        loginOverlay.addEventListener("click", function(e) { if (e.target === this) this.classList.remove("active"); });

        // Detail close
        detailCloseBtn.addEventListener("click", closeDetail);
        detailOverlay.addEventListener("click", function(e) { if (e.target === this) closeDetail(); });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") { closeDetail();
                loginOverlay.classList.remove("active"); }
        });

        // Admin CRUD
        addSongBtn.addEventListener("click", addSong);
        cancelEditBtn.addEventListener("click", cancelEdit);
        logoutBtn.addEventListener("click", logout);

        /* ============================================================
                   AUTH STATE & INIT
                   ============================================================ */
        async function checkUser() {
            const { data } = await supabaseClient.auth.getUser();
            if (data && data.user) {
                currentUser = data.user;
                adminPanel.classList.add("active");
                setAdminButton();
            }
        }

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                currentUser = session.user;
                adminPanel.classList.add("active");
                setAdminButton();
                renderAdminList();
            } else {
                currentUser = null;
                adminPanel.classList.remove("active");
                resetAdminButton();
            }
        });

        async function init() {
            initializeTheme();
            await checkUser();
            await loadSongs();
            // default tab: local
            activeTab = "local";
            document.querySelector('.search-tab[data-tab="local"]')?.classList.add("active");
            document.querySelector('.search-tab[data-tab="youtube"]')?.classList.remove("active");
            document.querySelector('.search-tab[data-tab="all"]')?.classList.remove("active");
            render();
        }

        init();

        // expose for debugging
        console.log("🙏 Jesus Songs loaded — search works like YouTube!");
    </script>

</body>
</html>
