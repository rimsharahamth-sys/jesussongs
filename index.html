<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jesus Songs</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --body-bg:#f7f3ee;
    --body-text:#222;
    --card-bg:#fff;
    --panel-bg:#fff;
    --modal-bg:#fff;

    --header-bg-1:#1a1a2e;
    --header-bg-2:#16213e;
    --header-text:#f5e6d3;

    --primary:#f0c040;
    --primary-dark:#b8860b;

    --title-color:#1a1a2e;
    --text-color:#222;
    --muted-text:#777;
    --preview-color:#555;

    --border-color:#eee;
    --soft-border:#f0ebe5;

    --input-bg:#fff;
    --input-text:#222;
    --input-border:#ddd;

    --link-color:#1a6fb5;

    --footer-bg:#1a1a2e;
    --footer-text:rgba(255,255,255,.4);

    --shadow:rgba(0,0,0,.08);
    --strong-shadow:rgba(0,0,0,.15);

    --overlay:rgba(0,0,0,.65);
}

body.dark-mode {

    --body-bg:#101114;
    --body-text:#eee;

    --card-bg:#1b1d22;
    --panel-bg:#1b1d22;
    --modal-bg:#1b1d22;

    --header-bg-1:#08090d;
    --header-bg-2:#151923;

    --title-color:#f5f5f5;
    --text-color:#eee;

    --muted-text:#a8a8a8;
    --preview-color:#bdbdbd;

    --border-color:#30333b;
    --soft-border:#353841;

    --input-bg:#111318;
    --input-text:#eee;
    --input-border:#3b3e47;

    --link-color:#5eb7ff;

    --footer-bg:#08090d;
    --footer-text:rgba(255,255,255,.55);

    --shadow:rgba(0,0,0,.35);
    --strong-shadow:rgba(0,0,0,.55);

    --overlay:rgba(0,0,0,.78);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {

    font-family:
        'Segoe UI',
        Roboto,
        sans-serif;

    background:var(--body-bg);
    color:var(--body-text);

    min-height:100vh;

    transition:.3s;
}

/* ============================================================
HEADER
============================================================ */

.header {

    background:
        linear-gradient(
            135deg,
            var(--header-bg-1),
            var(--header-bg-2)
        );

    color:var(--header-text);

    padding:1.2rem 2rem;

    display:flex;
    flex-wrap:wrap;

    align-items:center;
    justify-content:space-between;

    box-shadow:
        0 4px 15px rgba(0,0,0,.3);

    position:sticky;
    top:0;

    z-index:100;
}

.header h1 {

    font-size:1.9rem;

    display:flex;
    align-items:center;

    gap:.5rem;
}

.header h1 i {
    color:var(--primary);
}

.header-controls {

    display:flex;
    align-items:center;

    gap:1rem;

    flex-wrap:wrap;
}

/* ============================================================
MAIN SEARCH
============================================================ */

.search-wrap {

    position:relative;
}

.search-wrap > i:first-child {

    position:absolute;

    left:.8rem;
    top:50%;

    transform:translateY(-50%);

    color:rgba(255,255,255,.5);
}

#searchInput {

    padding:
        .65rem
        2.7rem
        .65rem
        2.2rem;

    border:none;

    border-radius:30px;

    font-size:.95rem;

    background:
        rgba(255,255,255,.15);

    color:#fff;

    outline:2px solid transparent;

    transition:.3s;

    min-width:260px;
}

#searchInput::placeholder {

    color:
        rgba(255,255,255,.6);
}

#searchInput:focus {

    outline-color:
        var(--primary);

    background:
        rgba(255,255,255,.25);
}

.search-clear {

    position:absolute;

    right:.8rem;
    top:50%;

    transform:translateY(-50%);

    color:
        rgba(255,255,255,.65);

    cursor:pointer;

    display:none;
}

.search-clear.active {
    display:block;
}

.search-info {

    position:absolute;

    top:calc(100% + 8px);

    left:10px;
    right:10px;

    background:var(--card-bg);
    color:var(--text-color);

    border-radius:10px;

    padding:.55rem .8rem;

    box-shadow:
        0 8px 25px var(--strong-shadow);

    font-size:.8rem;

    display:none;

    z-index:500;
}

.search-info.active {
    display:block;
}

/* ============================================================
BUTTONS
============================================================ */

.btn {

    padding:.5rem 1.2rem;

    border:none;

    border-radius:30px;

    font-weight:600;

    font-size:.9rem;

    cursor:pointer;

    transition:.25s;

    background:var(--primary);

    color:#1a1a2e;
}

.btn:hover {

    transform:scale(1.03);

    opacity:.9;
}

.btn:disabled {

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}

.btn-outline {

    background:transparent;

    border:
        2px solid var(--primary);

    color:var(--primary);
}

.btn-outline:hover {

    background:var(--primary);

    color:#1a1a2e;
}

.btn-danger {

    background:#c0392b;

    color:#fff;
}

.btn-edit {

    background:#3498db;

    color:#fff;
}

.btn-cancel {

    background:#777;

    color:#fff;
}

#themeToggleBtn {

    min-width:48px;

    height:42px;

    padding:.5rem .9rem;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:.4rem;

    background:transparent;

    border:
        2px solid var(--primary);

    color:var(--primary);

    border-radius:30px;

    cursor:pointer;

    font-size:1rem;

    transition:.25s;
}

#themeToggleBtn:hover {

    background:var(--primary);

    color:#1a1a2e;

    transform:scale(1.05);
}

.song-count {

    font-size:.9rem;

    color:
        rgba(255,255,255,.7);
}

/* ============================================================
MAIN
============================================================ */

.main {

    max-width:1200px;

    margin:0 auto;

    padding:2rem 1.5rem;
}

/* ============================================================
SEARCH STATUS
============================================================ */

.search-status {

    margin-bottom:1rem;

    display:none;

    padding:.75rem 1rem;

    background:var(--card-bg);

    border-radius:12px;

    color:var(--muted-text);

    box-shadow:
        0 4px 15px var(--shadow);

    font-size:.9rem;
}

.search-status.active {
    display:block;
}

/* ============================================================
SONG GRID
============================================================ */

.songs-grid {

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(300px,1fr)
        );

    gap:1.5rem;
}

/* ============================================================
SONG CARD
============================================================ */

.song-card {

    background:var(--card-bg);

    border-radius:16px;

    box-shadow:
        0 6px 20px var(--shadow);

    transition:.3s;

    border-left:
        5px solid var(--primary-dark);

    cursor:pointer;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    user-select:none;
}

.song-card:hover {

    transform:translateY(-4px);

    box-shadow:
        0 12px 30px var(--strong-shadow);
}

.song-card-header {

    padding:
        1.2rem
        1.5rem
        .5rem;
}

.song-title {

    font-size:1.15rem;

    font-weight:700;

    color:var(--title-color);
}

.song-title i {

    color:var(--primary-dark);

    margin-right:.4rem;
}

.song-card-body {

    padding:
        0
        1.5rem
        .8rem;

    flex:1;
}

.song-preview {

    color:var(--preview-color);

    font-style:italic;

    font-size:.9rem;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.song-link {

    padding:
        0
        1.5rem
        .7rem;
}

.song-link a {

    color:var(--link-color);

    text-decoration:none;

    font-size:.9rem;
}

.song-link a:hover {
    text-decoration:underline;
}

.song-footer {

    padding:
        .7rem
        1.5rem
        1rem;

    border-top:
        1px solid var(--soft-border);

    display:flex;

    justify-content:space-between;

    font-size:.8rem;

    color:var(--muted-text);
}

.relevance-badge {

    display:inline-block;

    margin-top:.5rem;

    padding:.18rem .55rem;

    border-radius:20px;

    background:
        rgba(240,192,64,.15);

    color:var(--primary-dark);

    font-size:.7rem;

    font-weight:700;
}

/* ============================================================
NO RESULTS
============================================================ */

.no-results {

    text-align:center;

    padding:5rem 2rem;

    grid-column:1/-1;

    color:var(--muted-text);
}

.no-results-icon {

    font-size:3.5rem;

    margin-bottom:1rem;

    color:var(--primary-dark);

    opacity:.8;
}

.no-results-title {

    font-size:1.25rem;

    font-weight:700;

    color:var(--title-color);

    margin-bottom:.5rem;
}

.no-results-text {

    font-size:.95rem;

    color:var(--muted-text);
}

/* ============================================================
ADMIN
============================================================ */

.admin-panel {

    display:none;

    background:var(--panel-bg);

    color:var(--text-color);

    border-radius:20px;

    box-shadow:
        0 8px 30px var(--shadow);

    padding:2rem;

    margin-bottom:2rem;
}

.admin-panel.active {
    display:block;
}

.admin-panel h2,
.admin-panel h3 {

    color:var(--title-color);
}

.admin-panel h2 {
    margin-bottom:1rem;
}

/* ============================================================
FORM
============================================================ */

.form-group {

    margin-bottom:1rem;
}

.form-group label {

    font-weight:600;

    display:block;

    margin-bottom:.3rem;

    color:var(--text-color);
}

.form-group input,
.form-group textarea {

    width:100%;

    padding:.7rem 1rem;

    border:
        2px solid var(--input-border);

    border-radius:8px;

    font-size:.95rem;

    font-family:inherit;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;

    transition:.25s;
}

.form-group input:focus,
.form-group textarea:focus {

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(240,192,64,.12);
}

.form-group textarea {

    min-height:140px;

    resize:vertical;
}

.form-actions {

    display:flex;

    gap:.7rem;

    flex-wrap:wrap;
}

.status-message {

    margin-top:.8rem;

    font-size:.9rem;

    min-height:1.2rem;
}

/* ============================================================
ADMIN SEARCH
============================================================ */

/*
   IMPORTANT:
   Admin search bar and search results are now one
   dedicated section.

   Search bar is always first.
   Results appear DIRECTLY UNDER the search bar.
*/

.admin-search-section {

    margin-top:1.5rem;

    background:
        var(--input-bg);

    border:
        1px solid var(--border-color);

    border-radius:16px;

    padding:1rem;

    box-shadow:
        0 4px 15px var(--shadow);
}

.admin-search-title {

    font-size:1rem;

    font-weight:700;

    color:var(--title-color);

    margin-bottom:.7rem;

    display:flex;

    align-items:center;

    gap:.5rem;
}

.admin-search-title i {

    color:var(--primary-dark);
}

.admin-search-wrap {

    position:relative;

    width:100%;
}

#adminSearchInput {

    width:100%;

    padding:
        .85rem
        3rem
        .85rem
        2.7rem;

    border:
        2px solid var(--input-border);

    border-radius:12px;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;

    font-size:.95rem;

    transition:.25s;
}

#adminSearchInput:focus {

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(240,192,64,.12);
}

.admin-search-icon {

    position:absolute;

    left:.9rem;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted-text);

    pointer-events:none;
}

.admin-search-clear {

    position:absolute;

    right:.9rem;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted-text);

    cursor:pointer;

    display:none;
}

.admin-search-clear.active {
    display:block;
}

.admin-search-result {

    margin-top:.7rem;

    margin-bottom:.7rem;

    font-size:.85rem;

    color:var(--muted-text);

    min-height:1.2rem;
}

/*
   Search results container directly below search bar.
*/

.admin-song-list {

    margin-top:.5rem;

    border-top:
        1px solid var(--border-color);

    padding-top:.5rem;
}

/* Individual admin result */

.admin-song-item {

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:1rem;

    padding:.8rem .7rem;

    border-bottom:
        1px solid var(--border-color);

    color:var(--text-color);

    border-radius:10px;

    transition:.2s;
}

.admin-song-item:last-child {
    border-bottom:none;
}

.admin-song-item:hover {

    background:
        rgba(240,192,64,.07);
}

.admin-song-item.match-first {

    border-left:
        4px solid var(--primary);

    padding-left:.7rem;

    background:
        rgba(240,192,64,.09);
}

.admin-song-name {

    display:flex;

    align-items:center;

    gap:.6rem;

    min-width:0;

    font-weight:600;
}

.admin-song-name i {

    color:var(--primary-dark);

    flex-shrink:0;
}

.admin-song-name span {

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.admin-song-item .actions {

    display:flex;

    gap:.5rem;

    flex-wrap:wrap;

    justify-content:flex-end;

    flex-shrink:0;
}

.edit-badge {

    display:inline-block;

    margin-left:.5rem;

    padding:.2rem .55rem;

    border-radius:12px;

    background:#eaf4ff;

    color:#2471a3;

    font-size:.72rem;

    font-weight:700;
}

/* ============================================================
LOGIN
============================================================ */

.login-overlay {

    display:none;

    position:fixed;

    inset:0;

    background:var(--overlay);

    backdrop-filter:blur(4px);

    z-index:200;

    justify-content:center;

    align-items:center;
}

.login-overlay.active {
    display:flex;
}

.login-modal {

    background:var(--modal-bg);

    color:var(--text-color);

    padding:2.5rem 2rem;

    border-radius:24px;

    max-width:380px;

    width:90%;

    box-shadow:
        0 20px 50px var(--strong-shadow);

    text-align:center;
}

.login-modal h2 {

    margin-bottom:1.5rem;

    color:var(--title-color);
}

.login-modal input {

    width:100%;

    padding:.7rem 1rem;

    margin-bottom:1rem;

    border:
        2px solid var(--input-border);

    border-radius:8px;

    font-size:1rem;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;
}

.login-modal input:focus {

    border-color:var(--primary);
}

.login-modal .btn {

    width:100%;

    padding:.7rem;
}

.login-error {

    color:#e74c3c;

    font-size:.9rem;

    margin-top:.7rem;
}

/* ============================================================
FULL SCREEN SONG DETAIL
============================================================ */

/*
   Song detail now uses the COMPLETE screen.
*/

.song-detail-overlay {

    display:none;

    position:fixed;

    inset:0;

    width:100vw;

    height:100vh;

    background:
        var(--body-bg);

    backdrop-filter:none;

    z-index:1000;

    justify-content:center;

    align-items:stretch;

    padding:0;

    overflow:hidden;
}

.song-detail-overlay.active {
    display:flex;
}

.song-detail-modal {

    background:var(--modal-bg);

    color:var(--text-color);

    border-radius:0;

    width:100%;

    max-width:none;

    height:100vh;

    max-height:none;

    padding:0;

    overflow-y:auto;

    position:relative;

    box-shadow:none;
}

.song-detail-header {

    position:sticky;

    top:0;

    z-index:10;

    background:
        linear-gradient(
            135deg,
            var(--header-bg-1),
            var(--header-bg-2)
        );

    color:#fff;

    padding:
        1rem
        1.5rem;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:1rem;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);
}

.song-detail-content {

    width:100%;

    max-width:1000px;

    margin:0 auto;

    padding:
        2rem
        2rem
        4rem;
}

.close-btn {

    position:relative;

    top:auto;
    right:auto;

    width:44px;
    height:44px;

    font-size:1.8rem;

    color:#fff;

    cursor:pointer;

    border:none;

    background:
        rgba(255,255,255,.12);

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    transition:.2s;
}

.close-btn:hover {

    background:
        rgba(255,255,255,.25);

    transform:scale(1.05);
}

.detail-title {

    font-size:2rem;

    font-weight:700;

    color:#fff;

    line-height:1.3;
}

.detail-title i {

    color:var(--primary);

    margin-right:.5rem;
}

/* ============================================================
DETAIL PLAYER
============================================================ */

.detail-player {

    margin:
        1.5rem 0;

    background:#000;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 8px 25px var(--shadow);
}

.detail-player iframe {

    width:100%;

    aspect-ratio:16/9;

    border:0;

    display:block;
}

.detail-player audio {

    width:100%;

    display:block;
}

/* ============================================================
DETAIL ACTIONS
============================================================ */

.detail-actions {

    display:flex;

    gap:.7rem;

    flex-wrap:wrap;

    margin:1rem 0 1.5rem;
}

.detail-actions .btn {

    display:inline-flex;

    align-items:center;

    gap:.45rem;
}

/* ============================================================
LYRICS
============================================================ */

.detail-lyrics {

    font-family:Georgia,serif;

    font-size:1.15rem;

    line-height:2;

    white-space:pre-line;

    color:var(--text-color);

    margin:1.5rem 0;

    padding:1.5rem 0;

    border-top:
        2px solid var(--soft-border);

    border-bottom:
        2px solid var(--soft-border);
}

.detail-link a {

    color:var(--link-color);

    text-decoration:none;
}

.detail-link a:hover {
    text-decoration:underline;
}

/* ============================================================
FOOTER
============================================================ */

.footer {

    background:var(--footer-bg);

    color:var(--footer-text);

    text-align:center;

    padding:1.2rem;

    font-size:.8rem;

    margin-top:2rem;
}

/* ============================================================
MOBILE
============================================================ */

@media(max-width:650px) {

    .header {

        flex-direction:column;

        align-items:stretch;

        gap:.8rem;
    }

    .header-controls {

        justify-content:center;
    }

    #searchInput {

        width:100%;

        min-width:150px;
    }

    .songs-grid {

        grid-template-columns:1fr;
    }

    .admin-panel {

        padding:1.2rem;
    }

    .admin-song-item {

        align-items:flex-start;

        flex-direction:column;

        gap:.7rem;
    }

    .admin-song-item .actions {

        width:100%;

        justify-content:flex-start;
    }

    .admin-search-section {

        padding:.8rem;
    }

    .song-detail-content {

        padding:
            1.2rem
            1rem
            3rem;
    }

    .song-detail-header {

        padding:
            .8rem
            1rem;
    }

    .detail-title {

        font-size:1.2rem;
    }

    .detail-lyrics {

        font-size:1rem;

        line-height:1.8;
    }
}

</style>
</head>

<body>

<!-- ============================================================
HEADER
============================================================ -->

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>

    <div class="header-controls">

        <div class="search-wrap">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
                autocomplete="off"
            >

            <i
                class="fas fa-times search-clear"
                id="searchClear"
            ></i>

            <div
                class="search-info"
                id="searchInfo"
            ></div>

        </div>

        <span
            class="song-count"
            id="songCount"
        >
            Loading...
        </span>

        <button
            id="themeToggleBtn"
            title="Change Theme"
        >

            <i
                class="fas fa-moon"
                id="themeIcon"
            ></i>

            <span id="themeText">
                Dark
            </span>

        </button>

        <button
            class="btn btn-outline"
            id="adminToggleBtn"
        >

            <i class="fas fa-user-shield"></i>

            Admin

        </button>

    </div>

</header>


<!-- ============================================================
LOGIN
============================================================ -->

<div
    class="login-overlay"
    id="loginOverlay"
>

    <div class="login-modal">

        <h2>

            <i class="fas fa-lock"></i>

            Admin Login

        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button
            class="btn"
            id="loginBtn"
        >
            Login
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- ============================================================
FULL SCREEN SONG DETAIL

/* ============================================================
TELUGU TRANSLITERATION
============================================================ */

const TELUGU_VOWELS = {

    "అ":"a",
    "ఆ":"aa",
    "ఇ":"i",
    "ఈ":"ee",
    "ఉ":"u",
    "ఊ":"oo",
    "ఋ":"ru",
    "ఎ":"e",
    "ఏ":"ee",
    "ఐ":"ai",
    "ఒ":"o",
    "ఓ":"oo",
    "ఔ":"au"
};


const TELUGU_CONSONANTS = {

    "క":"k",
    "ఖ":"kh",
    "గ":"g",
    "ఘ":"gh",
    "ఙ":"ng",

    "చ":"ch",
    "ఛ":"chh",
    "జ":"j",
    "ఝ":"jh",
    "ఞ":"ny",

    "ట":"t",
    "ఠ":"th",
    "డ":"d",
    "ఢ":"dh",
    "ణ":"n",

    "త":"t",
    "థ":"th",
    "ద":"d",
    "ధ":"dh",
    "న":"n",

    "ప":"p",
    "ఫ":"ph",
    "బ":"b",
    "భ":"bh",
    "మ":"m",

    "య":"y",
    "ర":"r",
    "ల":"l",
    "వ":"v",

    "శ":"sh",
    "ష":"sh",
    "స":"s",
    "హ":"h",

    "ళ":"l",
    "ఱ":"r"
};


const TELUGU_SIGNS = {

    "ా":"aa",
    "ి":"i",
    "ీ":"ee",
    "ు":"u",
    "ూ":"oo",
    "ృ":"ru",
    "ె":"e",
    "ే":"ee",
    "ై":"ai",
    "ొ":"o",
    "ో":"oo",
    "ౌ":"au"
};


const TELUGU_SPECIAL = {

    "ం":"m",
    "ః":"h",
    "ఁ":"m"
};


function transliterateTelugu(text) {

    if (!text) return "";

    const chars =
        Array.from(String(text));

    let result = "";

    for (
        let i = 0;
        i < chars.length;
        i++
    ) {

        const ch =
            chars[i];

        if (TELUGU_VOWELS[ch]) {

            result +=
                TELUGU_VOWELS[ch];

            continue;
        }

        if (TELUGU_SPECIAL[ch]) {

            result +=
                TELUGU_SPECIAL[ch];

            continue;
        }

        if (TELUGU_CONSONANTS[ch]) {

            const base =
                TELUGU_CONSONANTS[ch];

            const next =
                chars[i + 1];

            if (
                next &&
                TELUGU_SIGNS[next]
            ) {

                result +=
                    base +
                    TELUGU_SIGNS[next];

                i++;

                continue;
            }

            if (next === "్") {

                result += base;

                i++;

                continue;
            }

            result +=
                base + "a";

            continue;
        }

        if (ch === "్") {
            continue;
        }

        result += ch;
    }

    return result;
}


/* ============================================================
NORMALIZE
============================================================ */

function normalizeBasic(text) {

    if (!text) return "";

    return String(text)

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[\u200B-\u200D\uFEFF]/g,
            ""
        )

        .replace(
            /[’‘`]/g,
            "'"
        )

        .replace(
            /[^a-z0-9\u0C00-\u0C7F\s']/gi,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


function tokenize(text) {

    return normalizeBasic(text)

        .split(/\s+/)

        .filter(
            word =>
                word.length > 0
        );
}


/* ============================================================
ROMAN VARIANTS
============================================================ */

function createRomanVariants(text) {

    const base =
        normalizeBasic(text);

    const variants =
        new Set();

    if (!base) return [];

    variants.add(base);

    variants.add(
        base
            .replace(/aa/g,"a")
            .replace(/ee/g,"i")
            .replace(/ii/g,"i")
            .replace(/oo/g,"u")
            .replace(/uu/g,"u")
    );

    variants.add(
        base
            .replace(/ee/g,"e")
            .replace(/aa/g,"a")
            .replace(/oo/g,"o")
            .replace(/uu/g,"u")
    );

    variants.add(
        base
            .replace(/sh/g,"s")
            .replace(/chh/g,"ch")
            .replace(/kh/g,"k")
            .replace(/gh/g,"g")
            .replace(/dh/g,"d")
            .replace(/bh/g,"b")
            .replace(/ph/g,"p")
            .replace(/th/g,"t")
            .replace(/jh/g,"j")
    );

    return [...variants];
}


/* ============================================================
QUERY VARIANTS
============================================================ */

function getQueryVariants(query) {

    const raw =
        normalizeBasic(query);

    const teluguToRoman =
        normalizeBasic(
            transliterateTelugu(query)
        );

    const variants =
        new Set();

    if (raw) {
        variants.add(raw);
    }

    if (teluguToRoman) {
        variants.add(
            teluguToRoman
        );
    }

    createRomanVariants(raw)
        .forEach(
            x => variants.add(x)
        );

    createRomanVariants(
        teluguToRoman
    )
        .forEach(
            x => variants.add(x)
        );

    return [...variants];
}


/* ============================================================
SEARCH DATA
============================================================ */

function buildSearchData(song) {

    const title =
        song.title || "";

    const titleOriginal =
        normalizeBasic(title);

    const titleRoman =
        normalizeBasic(
            transliterateTelugu(title)
        );

    return {

        titleOriginal,

        titleRoman,

        titleWords:[
            ...tokenize(titleOriginal),
            ...tokenize(titleRoman)
        ]
    };
}


/* ============================================================
LEVENSHTEIN
============================================================ */

function levenshtein(a,b) {

    a=String(a||"");
    b=String(b||"");

    if(a===b) return 0;

    if(!a.length) return b.length;

    if(!b.length) return a.length;

    let previous =
        Array.from(
            {length:b.length+1},
            (_,i)=>i
        );

    for(
        let i=0;
        i<a.length;
        i++
    ){

        const current=[i+1];

        for(
            let j=0;
            j<b.length;
            j++
        ){

            const insert =
                current[j]+1;

            const remove =
                previous[j+1]+1;

            const replace =
                previous[j]+
                (a[i]===b[j]?0:1);

            current.push(
                Math.min(
                    insert,
                    remove,
                    replace
                )
            );
        }

        previous=current;
    }

    return previous[b.length];
}


/* ============================================================
FUZZY MATCH
============================================================ */

function fuzzyTokenMatch(
    queryWord,
    targetWords
){

    if(!queryWord) return false;

    for(
        const target of targetWords
    ){

        if(!target) continue;

        if(target===queryWord)
            return true;

        if(
            target.startsWith(queryWord) ||
            queryWord.startsWith(target)
        ){

            const difference =
                Math.abs(
                    target.length-
                    queryWord.length
                );

            if(difference<=2)
                return true;
        }

        if(
            queryWord.length>=4 &&
            target.length>=4
        ){

            const distance =
                levenshtein(
                    queryWord,
                    target
                );

            const allowed =
                queryWord.length>=7
                ?2
                :1;

            if(distance<=allowed)
                return true;
        }
    }

    return false;
}


/* ============================================================
SCORE
============================================================ */

function scoreSong(song,query){

    if(!query) return 0;

    const data =
        buildSearchData(song);

    const variants =
        getQueryVariants(query);

    const queryWords =
        tokenize(query);

    let bestScore=0;

    const titleOriginal =
        data.titleOriginal;

    const titleRoman =
        data.titleRoman;

    const titleWords =
        data.titleWords;

    for(
        const q of variants
    ){

        if(
            q===titleOriginal ||
            q===titleRoman
        ){

            bestScore =
                Math.max(
                    bestScore,
                    1000
                );
        }
    }

    for(
        const q of variants
    ){

        if(
            titleOriginal.startsWith(q) ||
            titleRoman.startsWith(q)
        ){

            bestScore =
                Math.max(
                    bestScore,
                    850
                );
        }
    }

    for(
        const q of variants
    ){

        if(
            q.length>=2 &&
            (
                titleOriginal.includes(q) ||
                titleRoman.includes(q)
            )
        ){

            bestScore =
                Math.max(
                    bestScore,
                    700
                );
        }
    }

    let matches=0;

    for(
        const word of queryWords
    ){

        const variants2 =
            getQueryVariants(word);

        let matched=false;

        for(
            const variant of variants2
        ){

            if(
                fuzzyTokenMatch(
                    variant,
                    titleWords
                )
            ){

                matched=true;
                break;
            }
        }

        if(matched)
            matches++;
    }

    if(
        queryWords.length>0 &&
        matches===queryWords.length
    ){

        bestScore =
            Math.max(
                bestScore,
                800
            );

    }else if(matches>0){

        bestScore =
            Math.max(
                bestScore,
                500+
                matches*30
            );
    }

    return bestScore;
}

}

            `${songs.length} song${songs.length!==1?"s":""}`;

        searchStatus.classList.remove(
            "active"
        );

        return;
    }

    const variants =
        [
            ...new Set(
                getQueryVariants(q)
                    .map(
                        v=>normalizeBasic(v)
                    )
                    .filter(Boolean)
            )
        ];

    function startsWithSearch(song){

        const data =
            buildSearchData(song);

        return variants.some(
            v=>
                data.titleOriginal.startsWith(v) ||
                data.titleRoman.startsWith(v)
        );
    }

    const matches =
        songs

        .map(
            (song,index)=>({

                song,

                index,

                score:
                    scoreSong(
                        song,
                        q
                    )
            })
        )

        .filter(
            item=>
                startsWithSearch(
                    item.song
                )
        )

        .sort(
            (a,b)=>{

                const aTitle =
                    normalizeBasic(
                        a.song.title||""
                    );

                const bTitle =
                    normalizeBasic(
                        b.song.title||""
                    );

                const aRoman =
                    normalizeBasic(
                        transliterateTelugu(
                            a.song.title||""
                        )
                    );

                const bRoman =
                    normalizeBasic(
                        transliterateTelugu(
                            b.song.title||""
                        )
                    );

                const aExact =
                    variants.some(
                        v=>
                            aTitle===v ||
                            aRoman===v
                    );

                const bExact =
                    variants.some(
                        v=>
                            bTitle===v ||
                            bRoman===v
                    );

                if(
                    aExact!==bExact
                ){

                    return aExact
                        ?-1
                        :1;
                }

                if(
                    aTitle.length!==
                    bTitle.length
                ){

                    return
                        aTitle.length-
                        bTitle.length;
                }

                return
                    a.index-
                    b.index;
            }
        );

    if(!matches.length){

        songCount.textContent=
            "0 results";

        searchStatus.classList.add(
            "active"
        );

        searchStatus.innerHTML=`

            <i class="fas fa-search"></i>

            No song title starts with

                "${escapeHTML(q)}"
            </strong>

        `;

        grid.innerHTML=`

            <div class="no-results">

                <div class="no-results-icon">
                    <i class="fas fa-search"></i>
                </div>

                <div class="no-results-title">
                    No starting-name matches
                </div>

                <div class="no-results-text">
                    Try the beginning of the song name.
                </div>

            </div>

        `;

        return;
    }

    songCount.textContent=
        `${matches.length} result${matches.length!==1?"s":""}`;

    searchStatus.classList.add(
        "active"
    );

    searchStatus.innerHTML=`

        <i class="fas fa-search"></i>

        Songs starting with

        <strong>
            "${escapeHTML(q)}"
        </strong>

        <span style="opacity:.75;">
            · ${matches.length} found
        </span>

    `;

    renderSongCards(
        matches,
        true
    );
}

/*
   THIS IS THE IMPORTANT UPDATED FUNCTION.

   Search bar:
       ↓
   Search result count:
       ↓
   Matching songs

   Only matching songs are shown while searching.
*/

function renderAdminList(){

    if(!currentUser){

        adminSongList.innerHTML="";

        adminSearchResult.textContent="";

        return;
    }

    const raw =
        adminSearchInput.value.trim();

    const q =
        normalizeBasic(raw);


    /*
       NO SEARCH:
       Show all songs directly under the search bar.
    */

    if(!q){

        adminSearchClear.classList.remove(
            "active"
        );

        adminSearchResult.innerHTML=
            `${songs.length} song${songs.length!==1?"s":""}`;

        if(!songs.length){

            adminSongList.innerHTML=`

                <div
                    style="
                        padding:1rem 0;
                        color:var(--muted-text);
                        text-align:center;
                    "
                >

                    <i class="fas fa-music"></i>

                    No songs added yet.

                </div>

            `;

            return;
        }

        adminSongList.innerHTML =
            songs.map(
                (song,index)=>
                    createAdminSongItem(
                        song,
                        index,
                        false
                    )
            )
            .join("");

        attachAdminEvents();

        return;
    }


    /*
       SEARCH ACTIVE
    */

    adminSearchClear.classList.add(
        "active"
    );

    const variants =
        getQueryVariants(q)
            .map(
                normalizeBasic
            )
            .filter(Boolean);


    const results =
        songs

        .map(
            (song,index)=>{

                const title =
                    normalizeBasic(
                        song.title||""
                    );

                const roman =
                    normalizeBasic(
                        transliterateTelugu(
                            song.title||""
                        )
                    );

                const starts =
                    variants.some(
                        v=>
                            title.startsWith(v) ||
                            roman.startsWith(v)
                    );

                const contains =
                    variants.some(
                        v=>
                            title.includes(v) ||
                            roman.includes(v)
                    );

                return {

                    song,

                    index,

                    starts,

                    contains
                };
            }
        )

        .filter(
            item=>
                item.contains
        )

        .sort(
            (a,b)=>{

                if(
                    a.starts!==b.starts
                ){

                    return a.starts
                        ?-1
                        :1;
                }

                return
                    a.index-
                    b.index;
            }
        );


    /*
       RESULT COUNT
       appears directly under search bar
    */

    if(results.length){

        adminSearchResult.innerHTML=`

            <i class="fas fa-check-circle"
               style="color:#2ecc71;">
            </i>

            <strong>
                ${results.length}
            </strong>

            result${results.length!==1?"s":""}
            found for

            <strong>
                "${escapeHTML(raw)}"
            </strong>

        `;

    }else{

        adminSearchResult.innerHTML=`

            <i class="fas fa-search"></i>

            No songs found for

            <strong>
                "${escapeHTML(raw)}"
            </strong>

        `;
    }


    /*
       SHOW RESULTS DIRECTLY BELOW SEARCH
    */

    if(!results.length){

        adminSongList.innerHTML=`

            <div
                style="
                    padding:1.5rem 1rem;
                    text-align:center;
                    color:var(--muted-text);
                "
            >

                <div
                    style="
                        font-size:2rem;
                        margin-bottom:.5rem;
                    "
                >
                    <i class="fas fa-search"></i>
                </div>

                No matching songs.

            </div>

        `;

        return;
    }


    adminSongList.innerHTML =
        results.map(
            item=>
                createAdminSongItem(
                    item.song,
                    item.index,
                    item.starts
                )
        )
        .join("");


    attachAdminEvents();
}

/* ============================================================
YOUTUBE ID
============================================================ */

function getYouTubeId(url){

    if(!url) return null;

    try{

        const u =
            new URL(url);

        if(
            u.hostname.includes(
                "youtu.be"
            )
        ){

            return u.pathname
                .replace("/","")
                .split("?")[0];
        }

        if(
            u.hostname.includes(
                "youtube.com"
            )
        ){

            if(
                u.pathname==="/watch"
            ){

                return u.searchParams.get(
                    "v"
                );
            }

            if(
                u.pathname.startsWith(
                    "/shorts/"
                )
            ){

                return u.pathname
                    .split("/")[2];
            }

            if(
                u.pathname.startsWith(
                    "/embed/"
                )
            ){

                return u.pathname
                    .split("/")[2];
            }
        }

    }catch(e){}

    return null;
}


/* ============================================================
SHARE URL
============================================================ */

function buildShareUrl(song){

    const u =
        new URL(
            window.location.href
        );

    u.search="";

    u.hash =
        `song=${encodeURIComponent(song.id)}`;

    return u.toString();
}


/* ============================================================
OPEN FULL SCREEN SONG
============================================================ */

function openDetail(
    song,
    updateUrl=true
){

    currentDetailSong =
        song;


    detailTitle.innerHTML=`

        <i class="fas fa-music"></i>

        ${escapeHTML(song.title)}

    `;


    detailLyrics.textContent =
        song.lyrics ||
        "No lyrics available.";


    detailPlayer.innerHTML="";


    const yt =
        getYouTubeId(
            song.audio_url||""
        );


    if(yt){

        const iframe =
            document.createElement(
                "iframe"
            );

        iframe.src =
            `https://www.youtube.com/embed/${encodeURIComponent(yt)}?autoplay=1&rel=0&playsinline=1`;

        iframe.title =
            song.title ||
            "Jesus Song";

        iframe.allow =
            "autoplay; encrypted-media; picture-in-picture";

        iframe.allowFullscreen=true;

        detailPlayer.appendChild(
            iframe
        );

        detailPlayBtn.innerHTML=`

            <i class="fas fa-play"></i>

            Playing / Watching

        `;

    }else if(song.audio_url){

        const audio =
            document.createElement(
                "audio"
            );

        audio.controls=true;

        audio.autoplay=true;

        audio.src =
            song.audio_url;

        audio.preload=
            "metadata";

        detailPlayer.appendChild(
            audio
        );

        detailPlayBtn.innerHTML=`

            <i class="fas fa-play"></i>

            Playing

        `;

    }else{

        detailPlayer.innerHTML=`

            <div
                style="
                    color:#fff;
                    padding:2rem;
                    text-align:center;
                "
            >

                <i class="fas fa-music"></i>

                No audio / YouTube link available.

            </div>

        `;

        detailPlayBtn.innerHTML=`

            <i class="fas fa-play"></i>

            Play / Watch

        `;
    }


    detailLink.innerHTML =
        song.audio_url
        ?
        `

        <a

            rel="noopener noreferrer"
        >

            <i class="fas fa-external-link-alt"></i>

            Open original link

        </a>

        `
        :
        "";


    detailOverlay.classList.add(
        "active"
    );


    document.body.style.overflow=
        "hidden";


    if(updateUrl){

        history.pushState(
            {
                songId:song.id
            },
            "",
            buildShareUrl(song)
        );
    }
}

CLOSE DETAIL
============================================================ */

    clearUrl=true
){

    detailOverlay.classList.remove(

    );

    currentDetailSong=null;

/* ============================================================
SHARE
============================================================ */

function shareCurrentSong(){

    if(!currentDetailSong)
        return;

    const url =
        buildShareUrl(
            currentDetailSong
        );

    const data={

        title:
            currentDetailSong.title ||
            "Jesus Song",

        text:
            `Listen to ${currentDetailSong.title || "this Jesus song"}`,

        url
    };


    if(navigator.share){

        navigator
            .share(data)
            .catch(
                ()=>{}
            );

        return;
    }


    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
            .writeText(url)
            .then(
                ()=>{
                    alert(
                        "✅ Song share link copied!"
                    );
                }
            )
            .catch(
                ()=>{
                    window.prompt(
                        "Copy this song link:",
                        url
                    );
                }
            );

    }else{

        window.prompt(
            "Copy this song link:",
            url
        );
    }
}

OPEN SONG FROM URL
============================================================ */

function openSongFromUrl(){

    const hash =
        window.location.hash;

    if(
        !hash.startsWith(
            "#song="
        )
    ){

        return;
    }

    const id =
        decodeURIComponent(
            hash.substring(6)
        );

    const song =
        songs.find(
            s=>
                String(s.id)===
                String(id)
        );

    if(song){

        openDetail(
            song,
            false
        );
    }
}

function startEditSong(id){

    const song =
        songs.find(

                Number(s.id)===
                Number(id)
        );


    if(!song)
        return;


    editingSongId.value=
        song.id;


    songTitle.value=
        song.title||"";

    songLyrics.value=
        song.lyrics||"";

    songLink.value=
        song.audio_url||"";

    songCategory.value=
        song.category||"";


    addSongBtn.innerHTML=`

        <i class="fas fa-save"></i>

    `;


    cancelEditBtn.style.display=
        "inline-block";


    formStatus.textContent=
        `Editing: ${song.title}`;

    formStatus.style.color=
        "#2471a3";


    renderAdminList();


    songTitle.scrollIntoView({

        behavior:"smooth",

        block:"center"

    songTitle.focus();
}

/* ============================================================
UPDATE SONG
============================================================ */

async function updateSong(id){

    const title =
        songTitle.value.trim();

    const lyrics =
        songLyrics.value.trim();

    const link =
        songLink.value.trim();

    const category =
        songCategory.value.trim();


    if(!title || !lyrics){

        alert(
            "Song title and lyrics are required."
        );

        return;
    }


    addSongBtn.disabled=true;

    cancelEditBtn.disabled=true;


    addSongBtn.innerHTML=`

        <i class="fas fa-spinner fa-spin"></i>

        Updating...

    `;


    const {
        error
    }=
    await supabaseClient
        .from("songs")
        .update({

            title,

            lyrics,

            audio_url:
                link || null,

            category:
                category ||
                "Worship"

        })
        .eq(
            "id",
            id
        );


    addSongBtn.disabled=false;

    cancelEditBtn.disabled=false;


    if(error){

        console.error(error);

        formStatus.textContent=
            "❌ Update failed: "+
            error.message;

        formStatus.style.color=
            "#c0392b";


        addSongBtn.innerHTML=`

            <i class="fas fa-save"></i>

            Update Song

        `;

    cancelEdit();

    await loadSongs();


    alert(
        "✅ Song updated successfully!"
    );
}

============================================================ */

async function deleteSong(id){

    if(!currentUser)
        return;


    const confirmed =
        confirm(
            "Are you sure you want to delete this song?"
        );


    if(!confirmed)
        return;


    const {
        error
    }=
    await supabaseClient
        .from("songs")
        .delete()
        .eq(

            id
        );


    if(error){

        console.error(error);

        alert(
            "❌ Delete failed:\n\n"+
            error.message
        );

        return;
    }


    if(
        Number(
            editingSongId.value
        )===Number(id)
    ){

        cancelEdit();
    }


    await loadSongs();


    alert(
        "✅ Song deleted successfully."
    );
}

/* ============================================================
URL EVENTS
============================================================ */

window.addEventListener(
    "popstate",
    ()=>{
        if(
            window.location.hash.startsWith(
                "#song="
            )
        ){

            openSongFromUrl();

        }else{

            closeDetail(false);
        }
    }
);


window.addEventListener(
    "hashchange",
    ()=>{
        if(
            window.location.hash.startsWith(
                "#song="
            )
        ){

            openSongFromUrl();

        }else{

            closeDetail(false);
        }
    }
);


/* ============================================================
CHECK USER
============================================================ */

async function checkUser(){

    const {
        data
    }=
    await supabaseClient.auth
        .getUser();


    if(
        data &&
        data.user
    ){

        currentUser=
            data.user;


        adminPanel.classList.add(
            "active"
        );


        setAdminButton();
    }
}


/* ============================================================
INIT
============================================================ */

async function init(){

    initializeTheme();

    await checkUser();

    await loadSongs();

    openSongFromUrl();
}


init();


/* ============================================================
AUTH STATE
============================================================ */

supabaseClient.auth.onAuthStateChange(
    (
        event,
        session
    )=>{

        if(
            session &&
            session.user
        ){

            currentUser =
                session.user;


            adminPanel.classList.add(
                "active"
            );


            setAdminButton();

            renderAdminList();

        }else{

            currentUser=null;

            adminPanel.classList.remove(
                "active"
            );

            resetAdminButton();

        }
    }
);

</script>

</body>
</html>
