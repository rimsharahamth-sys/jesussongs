<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jesus Songs</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --body-bg:#f7f3ee;
    --body-text:#222;
    --card-bg:#fff;
    --panel-bg:#fff;
    --modal-bg:#fff;

    --header-bg-1:#1a1a2e;
    --header-bg-2:#16213e;
    --header-text:#f5e6d3;

    --primary:#f0c040;
    --primary-dark:#b8860b;

    --title-color:#1a1a2e;
    --text-color:#222;
    --muted-text:#777;
    --preview-color:#555;

    --border-color:#eee;
    --soft-border:#f0ebe5;

    --input-bg:#fff;
    --input-text:#222;
    --input-border:#ddd;

    --link-color:#1a6fb5;

    --footer-bg:#1a1a2e;
    --footer-text:rgba(255,255,255,.4);

    --shadow:rgba(0,0,0,.08);
    --strong-shadow:rgba(0,0,0,.15);

    --overlay:rgba(0,0,0,.65);
}

body.dark-mode{
    --body-bg:#101114;
    --body-text:#eee;
    --card-bg:#1b1d22;
    --panel-bg:#1b1d22;
    --modal-bg:#1b1d22;

    --header-bg-1:#08090d;
    --header-bg-2:#151923;

    --title-color:#f5f5f5;
    --text-color:#eee;
    --muted-text:#a8a8a8;
    --preview-color:#bdbdbd;

    --border-color:#30333b;
    --soft-border:#353841;

    --input-bg:#111318;
    --input-text:#eee;
    --input-border:#3b3e47;

    --link-color:#5eb7ff;

    --footer-bg:#08090d;
    --footer-text:rgba(255,255,255,.55);

    --shadow:rgba(0,0,0,.35);
    --strong-shadow:rgba(0,0,0,.55);

    --overlay:rgba(0,0,0,.78);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Segoe UI',Roboto,sans-serif;
    background:var(--body-bg);
    color:var(--body-text);
    min-height:100vh;
    transition:.3s;
}

/* =========================================================
HEADER
========================================================= */

.header{
    background:linear-gradient(
        135deg,
        var(--header-bg-1),
        var(--header-bg-2)
    );

    color:var(--header-text);

    padding:1.2rem 2rem;

    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 4px 15px rgba(0,0,0,.3);

    position:sticky;
    top:0;

    z-index:1000;
}

.header h1{
    font-size:1.9rem;
    display:flex;
    align-items:center;
    gap:.5rem;
}

.header h1 i{
    color:var(--primary);
}

.header-controls{
    display:flex;
    align-items:center;
    gap:1rem;
    flex-wrap:wrap;
}

/* =========================================================
MAIN SEARCH
========================================================= */

.search-wrap{
    position:relative;
}

.search-wrap>i:first-child{
    position:absolute;
    left:.8rem;
    top:50%;
    transform:translateY(-50%);
    color:rgba(255,255,255,.5);
}

#searchInput{
    padding:.65rem 2.7rem .65rem 2.2rem;

    border:none;
    border-radius:30px;

    font-size:.95rem;

    background:rgba(255,255,255,.15);
    color:#fff;

    outline:2px solid transparent;

    transition:.3s;

    min-width:260px;
}

#searchInput::placeholder{
    color:rgba(255,255,255,.6);
}

#searchInput:focus{
    outline-color:var(--primary);
    background:rgba(255,255,255,.25);
}

.search-clear{
    position:absolute;
    right:.8rem;
    top:50%;
    transform:translateY(-50%);

    color:rgba(255,255,255,.65);

    cursor:pointer;
    display:none;
}

.search-clear.active{
    display:block;
}

/* =========================================================
MAIN SEARCH DROPDOWN
========================================================= */

.main-search-results{
    position:absolute;

    top:calc(100% + 10px);
    left:0;
    right:0;

    min-width:320px;
    max-height:430px;

    overflow-y:auto;

    background:var(--card-bg);
    color:var(--text-color);

    border-radius:14px;

    box-shadow:0 12px 35px var(--strong-shadow);

    padding:.5rem;

    display:none;

    z-index:2000;
}

.main-search-results.active{
    display:block;
}

.main-search-result-item{
    padding:.75rem;

    border-radius:10px;

    cursor:pointer;

    display:flex;
    align-items:center;

    gap:.7rem;

    transition:.2s;
}

.main-search-result-item:hover{
    background:rgba(240,192,64,.15);
}

.main-search-result-item i{
    color:var(--primary-dark);
}

.main-search-result-title{
    font-weight:700;
    font-size:.92rem;
}

.main-search-result-category{
    color:var(--muted-text);
    font-size:.75rem;
    margin-top:2px;
}

.main-search-no-result{
    padding:1rem;
    text-align:center;
    color:var(--muted-text);
}

/* =========================================================
BUTTONS
========================================================= */

.btn{
    padding:.5rem 1.2rem;

    border:none;
    border-radius:30px;

    font-weight:600;
    font-size:.9rem;

    cursor:pointer;

    transition:.25s;

    background:var(--primary);
    color:#1a1a2e;
}

.btn:hover{
    transform:scale(1.03);
    opacity:.9;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.btn-outline{
    background:transparent;
    border:2px solid var(--primary);
    color:var(--primary);
}

.btn-outline:hover{
    background:var(--primary);
    color:#1a1a2e;
}

.btn-danger{
    background:#c0392b;
    color:#fff;
}

.btn-edit{
    background:#3498db;
    color:#fff;
}

.btn-cancel{
    background:#777;
    color:#fff;
}

#themeToggleBtn{
    min-width:48px;
    height:42px;

    padding:.5rem .9rem;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:.4rem;

    background:transparent;

    border:2px solid var(--primary);
    color:var(--primary);

    border-radius:30px;

    cursor:pointer;

    font-size:1rem;

    transition:.25s;
}

#themeToggleBtn:hover{
    background:var(--primary);
    color:#1a1a2e;
    transform:scale(1.05);
}

.song-count{
    font-size:.9rem;
    color:rgba(255,255,255,.7);
}

/* =========================================================
MAIN
========================================================= */

.main{
    max-width:1200px;
    margin:0 auto;
    padding:2rem 1.5rem;
}

/* =========================================================
SEARCH STATUS
========================================================= */

.search-status{
    margin-bottom:1rem;

    display:none;

    padding:.75rem 1rem;

    background:var(--card-bg);

    border-radius:12px;

    color:var(--muted-text);

    box-shadow:0 4px 15px var(--shadow);

    font-size:.9rem;
}

.search-status.active{
    display:block;
}

/* =========================================================
GRID
========================================================= */

.songs-grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));

    gap:1.5rem;
}

/* =========================================================
CARD
========================================================= */

.song-card{
    background:var(--card-bg);

    border-radius:16px;

    box-shadow:0 6px 20px var(--shadow);

    transition:.3s;

    border-left:5px solid var(--primary-dark);

    overflow:hidden;

    display:flex;
    flex-direction:column;

    user-select:none;
}

.song-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px var(--strong-shadow);
}

.song-card-header{
    padding:1.2rem 1.5rem .5rem;
}

.song-title{
    font-size:1.15rem;
    font-weight:700;
    color:var(--title-color);
}

.song-title i{
    color:var(--primary-dark);
    margin-right:.4rem;
}

.song-card-body{
    padding:0 1.5rem .8rem;
    flex:1;
}

.song-preview{
    color:var(--preview-color);

    font-style:italic;
    font-size:.9rem;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.song-link{
    padding:0 1.5rem .7rem;
}

.song-link a{
    color:var(--link-color);
    text-decoration:none;
    font-size:.9rem;
}

.song-link a:hover{
    text-decoration:underline;
}

.song-footer{
    padding:.7rem 1.5rem 1rem;

    border-top:1px solid var(--soft-border);

    display:flex;
    justify-content:space-between;

    font-size:.8rem;

    color:var(--muted-text);
}

.relevance-badge{
    display:inline-block;

    margin-top:.5rem;

    padding:.18rem .55rem;

    border-radius:20px;

    background:rgba(240,192,64,.15);

    color:var(--primary-dark);

    font-size:.7rem;
    font-weight:700;
}

/* =========================================================
COMMENTS
========================================================= */

.comments-section{
    border-top:1px solid var(--soft-border);
    padding:1rem 1.5rem 1.2rem;

    background:rgba(240,192,64,.025);
}

.comments-title{
    font-size:.9rem;
    font-weight:700;

    color:var(--title-color);

    margin-bottom:.7rem;
}

.comment-login-box{
    display:flex;
    flex-direction:column;
    gap:.6rem;
}

.google-login-btn{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:.5rem;

    background:#fff;

    color:#333;

    border:1px solid #ddd;

    padding:.55rem .8rem;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;

    transition:.2s;
}

.google-login-btn:hover{
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

body.dark-mode .google-login-btn{
    background:#25272d;
    color:#fff;
    border-color:#444;
}

.comment-user-box{
    display:none;
}

.comment-user-box.active{
    display:block;
}

.comment-user-info{
    display:flex;
    align-items:center;
    gap:.5rem;
    margin-bottom:.5rem;
}

.comment-user-info img{
    width:30px;
    height:30px;

    border-radius:50%;

    object-fit:cover;
}

.comment-user-name{
    font-size:.8rem;
    font-weight:700;
}

.comment-input-wrap{
    display:flex;
    gap:.4rem;
}

.comment-input{
    width:100%;

    padding:.55rem .7rem;

    border:1px solid var(--input-border);

    border-radius:8px;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;
}

.comment-input:focus{
    border-color:var(--primary);
}

.comment-submit{
    padding:.55rem .75rem;

    border:none;

    border-radius:8px;

    background:var(--primary);

    color:#222;

    cursor:pointer;
}

.comments-list{
    margin-top:.8rem;

    display:flex;
    flex-direction:column;

    gap:.65rem;
}

.comment-item{
    display:flex;
    gap:.55rem;

    padding:.6rem;

    border-radius:9px;

    background:var(--card-bg);

    border:1px solid var(--soft-border);
}

.comment-avatar{
    width:32px;
    height:32px;

    border-radius:50%;

    object-fit:cover;

    flex-shrink:0;
}

.comment-content{
    min-width:0;
    flex:1;
}

.comment-author{
    font-size:.8rem;
    font-weight:700;

    color:var(--title-color);
}

.comment-date{
    font-size:.68rem;
    color:var(--muted-text);

    margin-left:.35rem;
}

.comment-text{
    margin-top:.25rem;

    font-size:.82rem;

    line-height:1.4;

    color:var(--text-color);

    white-space:pre-wrap;

    word-break:break-word;
}

.comment-actions{
    margin-top:.3rem;
}

.comment-delete{
    border:none;
    background:none;
    color:#e74c3c;

    cursor:pointer;

    font-size:.7rem;
}

.no-comments{
    color:var(--muted-text);
    font-size:.78rem;
    text-align:center;
    padding:.4rem;
}

/* =========================================================
NO RESULTS
========================================================= */

.no-results{
    text-align:center;
    padding:5rem 2rem;
    grid-column:1/-1;
    color:var(--muted-text);
}

.no-results-icon{
    font-size:3.5rem;
    margin-bottom:1rem;
    color:var(--primary-dark);
    opacity:.8;
}

.no-results-title{
    font-size:1.25rem;
    font-weight:700;
    color:var(--title-color);
    margin-bottom:.5rem;
}

.no-results-text{
    font-size:.95rem;
    color:var(--muted-text);
}

/* =========================================================
ADMIN
========================================================= */

.admin-panel{
    display:none;

    background:var(--panel-bg);

    color:var(--text-color);

    border-radius:20px;

    box-shadow:0 8px 30px var(--shadow);

    padding:2rem;

    margin-bottom:2rem;
}

.admin-panel.active{
    display:block;
}

.admin-panel h2,
.admin-panel h3{
    color:var(--title-color);
}

.admin-panel h2{
    margin-bottom:1rem;
}

.form-group{
    margin-bottom:1rem;
}

.form-group label{
    font-weight:600;
    display:block;

    margin-bottom:.3rem;

    color:var(--text-color);
}

.form-group input,
.form-group textarea{
    width:100%;

    padding:.7rem 1rem;

    border:2px solid var(--input-border);

    border-radius:8px;

    font-size:.95rem;

    font-family:inherit;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;

    transition:.25s;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:var(--primary);

    box-shadow:
    0 0 0 3px rgba(240,192,64,.12);
}

.form-group textarea{
    min-height:140px;
    resize:vertical;
}

.form-actions{
    display:flex;
    gap:.7rem;
    flex-wrap:wrap;
}

.status-message{
    margin-top:.8rem;
    font-size:.9rem;
    min-height:1.2rem;
}

.admin-song-list{
    margin-top:1rem;

    border-top:2px dashed var(--input-border);

    padding-top:1rem;
}

.admin-song-item{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:.7rem 0;

    border-bottom:1px solid var(--border-color);

    color:var(--text-color);
}

.admin-song-item .actions{
    display:flex;
    gap:.5rem;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.edit-badge{
    display:inline-block;

    margin-left:.5rem;

    padding:.2rem .55rem;

    border-radius:12px;

    background:#eaf4ff;

    color:#2471a3;

    font-size:.72rem;

    font-weight:700;
}

.admin-search-wrap{
    position:relative;

    margin-top:1rem;
    margin-bottom:.8rem;
}

#adminSearchInput{
    width:100%;

    padding:.7rem 1rem;

    border:2px solid var(--input-border);

    border-radius:10px;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;

    font-size:.95rem;
}

.admin-search-result{
    margin:.35rem 0 .8rem;

    font-size:.85rem;

    color:var(--muted-text);

    min-height:1.2rem;
}

.admin-song-item.match-first{
    border-left:4px solid var(--primary);

    padding-left:.7rem;

    background:rgba(240,192,64,.07);

    border-radius:8px;
}

/* =========================================================
LOGIN
========================================================= */

.login-overlay{
    display:none;

    position:fixed;

    inset:0;

    background:var(--overlay);

    backdrop-filter:blur(4px);

    z-index:3000;

    justify-content:center;
    align-items:center;
}

.login-overlay.active{
    display:flex;
}

.login-modal{
    background:var(--modal-bg);

    color:var(--text-color);

    padding:2.5rem 2rem;

    border-radius:24px;

    max-width:380px;

    width:90%;

    box-shadow:0 20px 50px var(--strong-shadow);

    text-align:center;
}

.login-modal h2{
    margin-bottom:1.5rem;
    color:var(--title-color);
}

.login-modal input{
    width:100%;

    padding:.7rem 1rem;

    margin-bottom:1rem;

    border:2px solid var(--input-border);

    border-radius:8px;

    font-size:1rem;

    background:var(--input-bg);

    color:var(--input-text);

    outline:none;
}

.login-modal .btn{
    width:100%;
    padding:.7rem;
}

.login-error{
    color:#e74c3c;

    font-size:.9rem;

    margin-top:.7rem;
}

/* =========================================================
SONG DETAIL
========================================================= */

.song-detail-overlay{
    display:none;

    position:fixed;

    inset:0;

    background:var(--overlay);

    backdrop-filter:blur(6px);

    z-index:2500;

    justify-content:center;

    align-items:center;

    padding:2rem;
}

.song-detail-overlay.active{
    display:flex;
}

.song-detail-modal{
    background:var(--modal-bg);

    color:var(--text-color);

    border-radius:0;

    max-width:720px;

    width:100%;

    padding:2.5rem;

    max-height:90vh;

    overflow-y:auto;

    position:relative;

    box-shadow:0 20px 60px var(--strong-shadow);
}

.close-btn{
    position:absolute;

    top:1rem;
    right:1.5rem;

    font-size:2rem;

    color:var(--muted-text);

    cursor:pointer;

    border:none;

    background:none;
}

.detail-title{
    font-size:2rem;

    font-weight:700;

    color:var(--title-color);

    padding-right:2rem;
}

.detail-title i{
    color:var(--primary-dark);
    margin-right:.5rem;
}

.detail-player{
    margin:1rem 0 1.25rem;

    background:#000;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 8px 25px var(--shadow);
}

.detail-player iframe{
    width:100%;

    aspect-ratio:16/9;

    border:0;

    display:block;
}

.detail-player audio{
    width:100%;
    display:block;
}

.detail-actions{
    display:flex;
    gap:.7rem;
    flex-wrap:wrap;
    margin:1rem 0;
}

.detail-actions .btn{
    display:inline-flex;
    align-items:center;
    gap:.45rem;
}

.detail-lyrics{
    font-family:Georgia,serif;

    font-size:1.1rem;

    line-height:1.9;

    white-space:pre-line;

    color:var(--text-color);

    margin:1.5rem 0;

    padding:1rem 0;

    border-top:2px solid var(--soft-border);

    border-bottom:2px solid var(--soft-border);
}

.detail-link a{
    color:var(--link-color);
    text-decoration:none;
}

/* =========================================================
FOOTER
========================================================= */

.footer{
    background:var(--footer-bg);

    color:var(--footer-text);

    text-align:center;

    padding:1.2rem;

    font-size:.8rem;

    margin-top:2rem;
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:650px){

    .header{
        flex-direction:column;
        align-items:stretch;
        gap:.8rem;
    }

    .header-controls{
        justify-content:center;
    }

    #searchInput{
        width:100%;
        min-width:150px;
    }

    .search-wrap{
        width:100%;
    }

    .main-search-results{
        min-width:0;
        width:100%;
    }

    .songs-grid{
        grid-template-columns:1fr;
    }

    .song-detail-modal{
        padding:1.5rem;
    }

    .admin-song-item{
        align-items:flex-start;
        gap:.7rem;
        flex-direction:column;
    }

    .admin-song-item .actions{
        width:100%;
        justify-content:flex-start;
    }

    .detail-title{
        font-size:1.5rem;
    }
}

</style>
</head>

<body>

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>

    <div class="header-controls">

        <!-- MAIN SEARCH -->
        <div class="search-wrap">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
                autocomplete="off"
            >

            <i
                class="fas fa-times search-clear"
                id="searchClear"
            ></i>

            <!-- NEW: RESULTS DIRECTLY BELOW MAIN SEARCH -->
            <div
                class="main-search-results"
                id="mainSearchResults"
            ></div>

        </div>

        <span
            class="song-count"
            id="songCount"
        >
            Loading...
        </span>

        <button
            id="themeToggleBtn"
            title="Change Theme"
        >
            <i
                class="fas fa-moon"
                id="themeIcon"
            ></i>

            <span id="themeText">
                Dark
            </span>
        </button>

        <button class="notification-btn" id="notificationBtn" type="button" title="Notifications">
            <i class="fas fa-bell"></i><span id="notificationBadge" class="notification-badge">0</span>
        </button>

        <button
            class="btn btn-outline"
            id="adminToggleBtn"
        >
            <i class="fas fa-user-shield"></i>
            Admin
        </button>

    </div>

</header>


<!-- =====================================================
ADMIN LOGIN
===================================================== -->

<div
    class="login-overlay"
    id="loginOverlay"
>

    <div class="login-modal">

        <h2>
            <i class="fas fa-lock"></i>
            Login
        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button

/* =========================================================
TELUGU TRANSLITERATION
========================================================= */

const TELUGU_VOWELS={

"అ":"a",
"ఆ":"aa",
"ఇ":"i",
"ఈ":"ee",
"ఉ":"u",
"ఊ":"oo",
"ఋ":"ru",
"ఎ":"e",
"ఏ":"ee",
"ఐ":"ai",
"ఒ":"o",
"ఓ":"oo",
"ఔ":"au"

};

const TELUGU_CONSONANTS={

"క":"k",
"ఖ":"kh",
"గ":"g",
"ఘ":"gh",
"ఙ":"ng",

"చ":"ch",
"ఛ":"chh",
"జ":"j",
"ఝ":"jh",
"ఞ":"ny",

"ట":"t",
"ఠ":"th",
"డ":"d",
"ఢ":"dh",
"ణ":"n",

"త":"t",
"థ":"th",
"ద":"d",
"ధ":"dh",
"న":"n",

"ప":"p",
"ఫ":"ph",
"బ":"b",
"భ":"bh",
"మ":"m",

"య":"y",
"ర":"r",
"ల":"l",
"వ":"v",

"శ":"sh",
"ష":"sh",
"స":"s",
"హ":"h",

"ళ":"l",
"ఱ":"r"

};

const TELUGU_SIGNS={

"ా":"aa",
"ి":"i",
"ీ":"ee",
"ు":"u",
"ూ":"oo",
"ృ":"ru",
"ె":"e",
"ే":"ee",
"ై":"ai",
"ొ":"o",
"ో":"oo",
"ౌ":"au"

};

const TELUGU_SPECIAL={

"ం":"m",
"ః":"h",
"ఁ":"m"

};


function transliterateTelugu(text){

    if(!text)return "";

    const chars =
    Array.from(String(text));

    let result="";

    for(
        let i=0;
        i<chars.length;
        i++
    ){

        const ch=chars[i];

        if(TELUGU_VOWELS[ch]){

            result +=
            TELUGU_VOWELS[ch];

            continue;
        }

        if(TELUGU_SPECIAL[ch]){

            result +=
            TELUGU_SPECIAL[ch];

            continue;
        }

        if(TELUGU_CONSONANTS[ch]){

            const base =
            TELUGU_CONSONANTS[ch];

            const next =
            chars[i+1];

            if(
                next &&
                TELUGU_SIGNS[next]
            ){

                result +=
                base +
                TELUGU_SIGNS[next];

                i++;

                continue;
            }

            if(next==="్"){

                result += base;

                i++;

                continue;
            }

            result +=
            base+"a";

            continue;
        }

        if(ch==="్")continue;

        result+=ch;
    }

    return result;
}


/* =========================================================
NORMALIZE
========================================================= */

function normalizeBasic(text){

    if(!text)return "";

    return String(text)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u200B-\u200D\uFEFF]/g,"")
    .replace(/[’‘`]/g,"'")
    .replace(
        /[^a-z0-9\u0C00-\u0C7F\s']/gi,
        " "
    )
    .replace(/\s+/g," ")
    .trim();
}


/* =========================================================
ROMAN VARIANTS
========================================================= */

function createRomanVariants(text){

    const base =
    normalizeBasic(text);

    const variants =
    new Set();

    if(!base)return [];

    variants.add(base);

    variants.add(
        base
        .replace(/aa/g,"a")
        .replace(/ee/g,"i")
        .replace(/ii/g,"i")
        .replace(/oo/g,"u")
        .replace(/uu/g,"u")
    );

    variants.add(
        base
        .replace(/ee/g,"e")
        .replace(/aa/g,"a")
        .replace(/oo/g,"o")
        .replace(/uu/g,"u")
    );

    variants.add(
        base
        .replace(/sh/g,"s")
        .replace(/chh/g,"ch")
        .replace(/kh/g,"k")
        .replace(/gh/g,"g")
        .replace(/dh/g,"d")
        .replace(/bh/g,"b")
        .replace(/ph/g,"p")
        .replace(/th/g,"t")
        .replace(/jh/g,"j")
    );

    return [...variants];
}


/* =========================================================
TOKENIZE
========================================================= */

function tokenize(text){

    return normalizeBasic(text)
    .split(/\s+/)
    .filter(Boolean);
}


/* =========================================================
SEARCH DATA
========================================================= */

function buildSearchData(song){

    const title =
    song.title || "";

    const titleOriginal =
    normalizeBasic(title);

    const titleRoman =
    normalizeBasic(
        transliterateTelugu(title)
    );

    return{

        titleOriginal,
        titleRoman,

        titleWords:[
            ...tokenize(titleOriginal),
            ...tokenize(titleRoman)
        ]

    };
}


function getQueryVariants(query){

    const raw =
    normalizeBasic(query);

    const roman =
    normalizeBasic(
        transliterateTelugu(query)
    );

    const variants =
    new Set();

    if(raw)variants.add(raw);

    if(roman)variants.add(roman);

    createRomanVariants(raw)
    .forEach(x=>variants.add(x));

    createRomanVariants(roman)
    .forEach(x=>variants.add(x));

    return [...variants];
}


/* =========================================================
LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

    a=String(a||"");
    b=String(b||"");

    if(a===b)return 0;

    if(!a.length)return b.length;

    if(!b.length)return a.length;

    let previous =
    Array.from(
        {length:b.length+1},
        (_,i)=>i
    );

    for(
        let i=0;
        i<a.length;
        i++
    ){

        const current=[i+1];

        for(
            let j=0;
            j<b.length;
            j++
        ){

            const insert =
            current[j]+1;

            const remove =
            previous[j+1]+1;

            const replace =
            previous[j]+
            (a[i]===b[j]?0:1);

            current.push(
                Math.min(
                    insert,
                    remove,
                    replace
                )
            );
        }

        previous=current;
    }

    return previous[b.length];
}


function fuzzyTokenMatch(
    queryWord,
    targetWords
){

    if(!queryWord)return false;

    for(
        const target of targetWords
    ){

        if(target===queryWord)
            return true;

        if(
            target.startsWith(queryWord) ||
            queryWord.startsWith(target)
        ){

            if(
                Math.abs(
                    target.length-
                    queryWord.length
                )<=2
            ){

                return true;
            }
        }

        if(
            queryWord.length>=4 &&
            target.length>=4
        ){

            const distance =
            levenshtein(
                queryWord,
                target
            );

            const allowed =
            queryWord.length>=7
            ?2
            :1;

            if(distance<=allowed)
                return true;
        }
    }

    return false;
}


/* =========================================================
SCORE
========================================================= */

function scoreSong(song,query){

    if(!query)return 0;

    const data =
    buildSearchData(song);

    const variants =
    getQueryVariants(query);

    const queryWords =
    tokenize(query);

    let best=0;

    const original =
    data.titleOriginal;

    const roman =
    data.titleRoman;

    const words =
    data.titleWords;

    for(
        const q of variants
    ){

        if(
            q===original ||
            q===roman
        ){

            best=Math.max(best,1000);
        }

        if(
            original.startsWith(q) ||
            roman.startsWith(q)
        ){

            best=Math.max(best,850);
        }

        if(
            q.length>=2 &&
            (
                original.includes(q) ||
                roman.includes(q)
            )
        ){

            best=Math.max(best,700);
        }
    }

    let matched=0;

    for(
        const word of queryWords
    ){

        const vars =
        getQueryVariants(word);

        if(
            vars.some(
                v=>fuzzyTokenMatch(
                    v,
                    words
                )
            )
        ){

            matched++;
        }
    }

    if(
        queryWords.length &&
        matched===queryWords.length
    ){

        best=Math.max(best,800);

    }else if(matched>0){

        best=Math.max(
            best,
            500+matched*30
        );
    }

    return best;
}

        );

        renderMainSearchResults("");

        return;
    }

    const variants=[
        ...new Set(
            getQueryVariants(q)
            .map(normalizeBasic)
            .filter(Boolean)
        )
    ];

    function startsWithSearch(song){

        const data =
        buildSearchData(song);

        return variants.some(
            v=>
            data.titleOriginal.startsWith(v) ||
            data.titleRoman.startsWith(v)
        );
    }

    const matches =
    songs
    .map(
        (song,index)=>({

            song,

            index,

            score:
            scoreSong(
                song,
                q
            )

        })
    )
    .filter(
        x=>startsWithSearch(
            x.song
        )
    )
    .sort(
        (a,b)=>{

            const aTitle=
            normalizeBasic(
                a.song.title||""
            );

            const bTitle=
            normalizeBasic(
                b.song.title||""
            );

            const aExact=
            variants.some(
                v=>
                aTitle===v ||
                normalizeBasic(
                    transliterateTelugu(
                        a.song.title||""
                    )
                )===v
            );

            const bExact=
            variants.some(
                v=>
                bTitle===v ||
                normalizeBasic(
                    transliterateTelugu(
                        b.song.title||""
                    )
                )===v
            );

            if(aExact!==bExact)
                return aExact?-1:1;

            if(
                aTitle.length!==
                bTitle.length
            )
                return aTitle.length-
                       bTitle.length;

            return a.index-b.index;
        }
    );


    if(!matches.length){

        songCount.textContent=
        "0 results";

        searchStatus.classList.add(
            "active"
        );

        searchStatus.innerHTML=`

        <i class="fas fa-search"></i>

        No song title starts with

        <strong>
            "${escapeHTML(q)}"
        </strong>

        `;

        grid.innerHTML=`

        <div class="no-results">

            <div class="no-results-icon">
                <i class="fas fa-search"></i>
            </div>

            <div class="no-results-title">
                No starting-name matches
            </div>

            <div class="no-results-text">
                Try the beginning of the song name.
            </div>

        </div>

        `;

        renderMainSearchResults(
            q
        );

        return;
    }

    songCount.textContent=
    `${matches.length} result${matches.length!==1?"s":""}`;

    searchStatus.classList.add(
        "active"
    );

    searchStatus.innerHTML=`

    <i class="fas fa-search"></i>

    Songs starting with

    <strong>
        "${escapeHTML(q)}"
    </strong>

    <span style="opacity:.75;">
        · ${matches.length} found
    </span>

    `;

    renderSongCards(
        matches,
        true
    );

    /*
       NEW:
       MAIN SEARCH RESULTS ARE SHOWN
       DIRECTLY UNDER SEARCH BAR
    */

    renderMainSearchResults(q);
}

/* =========================================================
MAIN SEARCH RESULTS BELOW SEARCH BAR
========================================================= */

function renderMainSearchResults(q){

    if(!q){

        mainSearchResults.classList.remove(
            "active"
        );

        mainSearchResults.innerHTML="";

        return;
    }

    const variants=
    getQueryVariants(q);

    const results=
    songs
    .map(
        (song,index)=>({

            song,

            index,

            score:
            scoreSong(
                song,
                q
            )

        })
    )
    .filter(
        x=>
        variants.some(
            v=>{

                const data=
                buildSearchData(
                    x.song
                );

                return(
                    data.titleOriginal.startsWith(v) ||
                    data.titleRoman.startsWith(v)
                );

            }
        )
    )
    .sort(
        (a,b)=>{

            if(b.score!==a.score)
                return b.score-a.score;

            return a.index-b.index;
        }
    )
    .slice(0,20);


    if(!results.length){

        mainSearchResults.innerHTML=`

        <div class="main-search-no-result">

            <i class="fas fa-search"></i>

            No songs found for

            <strong>
                "${escapeHTML(q)}"
            </strong>

        </div>

        `;

        mainSearchResults.classList.add(
            "active"
        );

        return;
    }


    mainSearchResults.innerHTML=
    results.map(item=>`

        <div
            class="main-search-result-item"
            data-search-song-id="${escapeHTML(item.song.id)}"
        >

            <i class="fas fa-music"></i>

            <div>

                <div class="main-search-result-title">

                    ${escapeHTML(
                        item.song.title
                    )}

                </div>

                <div class="main-search-result-category">

                    ${escapeHTML(
                        item.song.category ||
                        "Worship"
                    )}

                </div>

            </div>

        </div>

    `).join("");

    mainSearchResults.classList.add(
        "active"
    );
}


/* =========================================================
ADMIN LIST
========================================================= */

function renderAdminList(){

    if(!isAdminUser(currentUser)){

        adminSongList.innerHTML="";
        adminSearchResult.textContent="";

        return;
    }

    if(!songs.length){

        adminSongList.innerHTML=
        `<p style="color:var(--muted-text);">
            No songs added yet.
        </p>`;

        return;
    }

    const q=
    normalizeBasic(
        adminSearchInput.value||""
    );

    const variants=
    q
    ?
    getQueryVariants(q)
    .map(normalizeBasic)
    .filter(Boolean)
    :
    [];

    const list=
    songs
    .map(
        (song,index)=>{

            const title=
            normalizeBasic(
                song.title||""
            );

            const roman=
            normalizeBasic(
                transliterateTelugu(
                    song.title||""
                )
            );

            const match=
            !q ||
            variants.some(
                v=>
                title.includes(v) ||
                roman.includes(v)
            );

            const starts=
            q &&
            variants.some(
                v=>
                title.startsWith(v) ||
                roman.startsWith(v)
            );

            return{
                song,
                index,
                match,
                starts
            };

        }
    )
    .filter(x=>x.match)
    .sort(
        (a,b)=>{

            if(
                q &&
                a.starts!==b.starts
            )
                return a.starts?-1:1;

            return a.index-b.index;
        }
    );


    adminSearchResult.innerHTML=
    q
    ?
    (
        list.length
        ?
        `
        <i class="fas fa-search"></i>

        ${list.length}
        result${list.length!==1?"s":""}

        found for

        <strong>
            "${escapeHTML(
                adminSearchInput.value.trim()
            )}"
        </strong>
        `
        :
        `
        <i class="fas fa-search"></i>

        No songs found for

        <strong>
            "${escapeHTML(
                adminSearchInput.value.trim()
            )}"
        </strong>
        `
    )
    :
    `${songs.length} song${songs.length!==1?"s":""}`;


    if(!list.length){

        adminSongList.innerHTML=
        `
        <p style="color:var(--muted-text);padding:.5rem 0;">
            No matching songs.
        </p>
        `;

        return;
    }


    adminSongList.innerHTML=
    list.map(x=>{

        const song=x.song;

        const editing=
        Number(editingSongId.value)===
        Number(song.id);

        return`

        <div
            class="
                admin-song-item
                ${x.starts?"match-first":""}
            "
        >

            <span>

                ${escapeHTML(
                    song.title
                )}

                ${
                    editing
                    ?
                    `
                    <span class="edit-badge">
                        Editing
                    </span>
                    `
                    :
                    ""
                }

            </span>

            <div class="actions">

                <button
                    class="btn btn-edit edit-song"
                    data-id="${escapeHTML(song.id)}"
                    style="
                        padding:.25rem .8rem;
                        font-size:.8rem;
                    "
                >

                    <i class="fas fa-pen"></i>
                    Edit

                </button>

                <button
                    class="btn btn-danger delete-song"
                    data-id="${escapeHTML(song.id)}"
                    style="
                        padding:.25rem .8rem;
                        font-size:.8rem;
                    "
                >

                    <i class="fas fa-trash"></i>
                    Delete

                </button>

            </div>

        </div>

        `;

    }).join("");


    document
    .querySelectorAll(".edit-song")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{
                startEditSong(
                    Number(
                        button.dataset.id
                    )
                );
            }
        );

    });


    document
    .querySelectorAll(".delete-song")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{
                deleteSong(
                    Number(
                        button.dataset.id
                    )
                );
            }
        );

    });
}


/* =========================================================
YOUTUBE
========================================================= */

function getYouTubeId(url){

    if(!url)return null;

    try{

        const u=
        new URL(url);

        if(
            u.hostname.includes(
                "youtu.be"
            )
        ){

            return u.pathname
            .replace("/","")
            .split("?")[0];

        }

        if(
            u.hostname.includes(
                "youtube.com"
            )
        ){

            if(
                u.pathname==="/watch"
            )
                return u.searchParams.get("v");

            if(
                u.pathname.startsWith(
                    "/shorts/"
                )
            )
                return u.pathname
                .split("/")[2];

            if(
                u.pathname.startsWith(
                    "/embed/"
                )
            )
                return u.pathname
                .split("/")[2];

        }

    }catch(e){}

    return null;
}


/* =========================================================
SHARE
========================================================= */

function buildShareUrl(song){

    const u=
    new URL(
        window.location.href
    );

    u.search="";

    u.hash=
    `song=${encodeURIComponent(song.id)}`;

    return u.toString();
}


async function shareCurrentSong(){

    if(!currentDetailSong)
        return;

    const url=
    buildShareUrl(
        currentDetailSong
    );

    const data={

        title:
        currentDetailSong.title ||
        "Jesus Song",

        text:
        `Listen to ${currentDetailSong.title || "this Jesus song"}`,

        url

    };

    if(
        navigator.share
    ){

        try{

            await navigator.share(
                data
            );

        }catch(e){}

        return;
    }

    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        try{

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "✅ Song share link copied!"
            );

        }catch(e){

            window.prompt(
                "Copy this song link:",
                url
            );

        }

    }else{

        window.prompt(
            "Copy this song link:",
            url
        );

    }
}

    window.location.hash;

    if(
        !h.startsWith("#song=")
    )
        return;

    const id=
    decodeURIComponent(
        h.substring(6)
    );

    const song=
    songs.find(
        s=>
        String(s.id)===
        String(id)
    );

    if(song)
        openDetail(
            song,
            false
        );

/* =========================================================
COMMENT SUBMIT
========================================================= */

async function submitComment(
    songId, parentCommentId=null
){

    if(!currentUser){

        await loginWithGoogle();

        return;
    }

    const input=
    document.querySelector(
        `[data-comment-input="${CSS.escape(String(songId))}"]`
    );

    if(!input)
        return;

    const text=
    input.value.trim();

    if(!text){

        alert(
            "Please enter a comment."
        );

        return;
    }


    input.disabled=true;

    const metadata=
    currentUser.user_metadata ||
    {};

    const name=
    metadata.full_name ||
    metadata.name ||
    currentUser.email ||
    "User";

    const avatar=
    metadata.avatar_url ||
    metadata.picture ||
    defaultAvatar();


    const {
        data,
        error
    }=
    await supabaseClient
    .from("song_comments")
    .insert([{

        song_id:Number(songId),

        user_id:
        currentUser.id,

        user_name:name,

        user_email:null,

        user_avatar:avatar,

        comment:text

    }])
    .select()
    .single();


    input.disabled=false;


    if(error){

        console.error(error);

        alert(
            "❌ Comment failed:\n\n"+
            error.message
        );

        return;
    }


    input.value="";

    comments.push(data);

    const id=
    String(data.song_id);

    if(!commentsBySong[id])
        commentsBySong[id]=[];

    commentsBySong[id].push(data);

    renderSongs();

    /*
       Keep current search after rendering.
    */

    if(searchQuery.trim())
        renderSongs();

}


/* =========================================================
DELETE COMMENT
========================================================= */

async function deleteComment(
    commentId
){

    if(!currentUser)
        return;

    const confirmed=
    confirm(
        "Delete this comment?"
    );

    if(!confirmed)
        return;


    const {
        error
    }=
    await supabaseClient
    .from("song_comments")
    .delete()
    .eq(
        "id",
        commentId
    )
    .eq(
        "user_id",
        currentUser.id
    );


    if(error){

        console.error(error);

        alert(
            "❌ Delete failed:\n\n"+
            error.message
        );

        return;
    }


    comments=
    comments.filter(
        c=>
        String(c.id)!==
        String(commentId)
    );


    Object.keys(
        commentsBySong
    ).forEach(songId=>{

        commentsBySong[songId]=
        commentsBySong[songId]
        .filter(
            c=>
            String(c.id)!==
            String(commentId)
        );

    });


    renderSongs();

}

========================================================= */

function cancelEdit(){

    editingSongId.value="";

    songTitle.value="";
    songLyrics.value="";
    songLink.value="";
    songCategory.value="";

    addSongBtn.disabled=false;

    addSongBtn.innerHTML=
    `
    <i class="fas fa-save"></i>
    Add Song
    `;

    cancelEditBtn.disabled=false;

    cancelEditBtn.style.display=
    "none";

    formStatus.textContent="";

    renderAdminList();
}


/* =========================================================
UPDATE SONG
========================================================= */

async function updateSong(id){

    if(!isAdminUser(currentUser)){
        alert("Please login as admin first.");
        return;
    }

    const title=
    songTitle.value.trim();

    const lyrics=
    songLyrics.value.trim();

    const link=
    songLink.value.trim();

    const category=
    songCategory.value.trim();


    if(!title || !lyrics){

        alert(
            "Song title and lyrics are required."
        );

        return;
    }


    addSongBtn.disabled=true;

    cancelEditBtn.disabled=true;

    addSongBtn.innerHTML=
    `
    <i class="fas fa-spinner fa-spin"></i>
    Updating...
    `;


    const {
        error
    }=
    await supabaseClient
    .from("songs")
    .update({

        title,

        lyrics,

        audio_url:
        link||null,

        category:
        category||
        "Worship"

    })
    .eq(
        "id",
        id
    );


    addSongBtn.disabled=false;

    cancelEditBtn.disabled=false;


    if(error){

        formStatus.textContent=
        "❌ Update failed: "+
        error.message;

        formStatus.style.color=
        "#c0392b";

        return;
    }


    cancelEdit();

    await loadSongs();

    alert(
        "✅ Song updated successfully!"
    );
}


/* =========================================================
DELETE SONG
========================================================= */

async function deleteSong(id){

    if(!isAdminUser(currentUser))return;


    const confirmed=
    confirm(
        "Are you sure you want to delete this song?"
    );

    if(!confirmed)return;


    const {
        error
    }=
    await supabaseClient
    .from("songs")
    .delete()
    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "❌ Delete failed:\n\n"+
            error.message
        );

        return;
    }


    if(
        Number(editingSongId.value)===
        Number(id)
    ){

        cancelEdit();

    }


    await loadSongs();


    alert(
        "✅ Song deleted successfully."
    );
}

/* =========================================================
SONG CARD CLICK
========================================================= */

grid.addEventListener(
    "click",
    async e=>{

        /*
           GOOGLE LOGIN
        */

        const googleBtn=
        e.target.closest(
            "[data-google-login]"
        );

        if(googleBtn){

            e.stopPropagation();

            await loginWithGoogle();

            return;
        }


        /*
           COMMENT SUBMIT
        */

        const submitBtn=
        e.target.closest(
            "[data-comment-submit]"
        );

        if(submitBtn){

            e.stopPropagation();

            await submitComment(
                submitBtn.dataset.commentSubmit
            );

            return;
        }


        /*
           DELETE COMMENT
        */

        const deleteBtn=
        e.target.closest(
            ".comment-delete"
        );

        if(deleteBtn){

            e.stopPropagation();

            await deleteComment(
                deleteBtn.dataset.commentId
            );

            return;
        }


        /*
           COMMENT INPUT
        */

        if(
            e.target.closest(
                ".comment-input"
            )
        ){

            e.stopPropagation();

            return;
        }


        /*
           PLAY LINK
        */

        const playLink=
        e.target.closest(
            ".inline-play-link"
        );

        if(playLink){

            e.preventDefault();

            e.stopPropagation();

            const song=
            songs.find(
                s=>
                Number(s.id)===
                Number(
                    playLink.dataset.id
                )
            );

            if(song)
                openDetail(song);

            return;
        }


        /*
           Don't open detail when
           clicking other links/buttons.
        */

        if(
            e.target.closest("button") ||
            e.target.closest("a")
        )
            return;


        const card=
        e.target.closest(
            ".song-card"
        );

        if(!card)return;


        const id=
        Number(
            card.dataset.id
        );

        const song=
        songs.find(
            s=>
            Number(s.id)===id
        );

        if(song)
            openDetail(song);

    }
);


/* =========================================================
COMMENT ENTER KEY
========================================================= */

grid.addEventListener(
    "keydown",
    e=>{

        if(
            e.key!=="Enter"
        )
            return;

        if(
            !e.target.classList.contains(
                "comment-input"
            )
        )
            return;

        e.preventDefault();

        const songId=
        e.target.dataset.commentInput;

        submitComment(songId);

);

/* =========================================================
CHECK USER
========================================================= */

async function checkUser(){

    const { data } = await supabaseClient.auth.getUser();

    currentUser = data && data.user ? data.user : null;

    if(isAdminUser(currentUser)){
        adminPanel.classList.add("active");
        setAdminButton();
        renderAdminList();
    }else{
        adminPanel.classList.remove("active");
        resetAdminButton();
    }

}


/* =========================================================
AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (event, session)=>{
        setTimeout(async ()=>{
            currentUser = session && session.user ? session.user : null;

            if(isAdminUser(currentUser)){
                adminPanel.classList.add("active");
                setAdminButton();
                renderAdminList();
            }else{
                adminPanel.classList.remove("active");
                resetAdminButton();
            }

            /* Comments use currentUser, including Google users. */
            await loadNotifications();
            subscribeRealtime();
            if(isAdminUser(currentUser)) await renderAdminComments();
            renderSongs();
        },0);
    }
);


/* =========================================================
INITIALIZE
========================================================= */

async function init(){

    initializeTheme();

    await checkUser();

    await loadSongs();

    openSongFromUrl();

}

init();
