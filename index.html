<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jesus Songs</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ===== ROOT ===== */
        :root {
            --body-bg: #f7f3ee;
            --body-text: #222;
            --card-bg: #fff;
            --panel-bg: #fff;
            --modal-bg: #fff;
            --header-bg-1: #1a1a2e;
            --header-bg-2: #16213e;
            --header-text: #f5e6d3;
            --primary: #f0c040;
            --primary-dark: #b8860b;
            --title-color: #1a1a2e;
            --text-color: #222;
            --muted-text: #777;
            --preview-color: #555;
            --border-color: #eee;
            --soft-border: #f0ebe5;
            --input-bg: #fff;
            --input-text: #222;
            --input-border: #ddd;
            --link-color: #1a6fb5;
            --footer-bg: #1a1a2e;
            --footer-text: rgba(255, 255, 255, .4);
            --shadow: rgba(0, 0, 0, .08);
            --strong-shadow: rgba(0, 0, 0, .15);
            --overlay: rgba(0, 0, 0, .65);
            --search-highlight: rgba(240, 192, 64, .35);
            --card-radius: 16px;
            --transition: .25s;
        }

        body.dark-mode {
            --body-bg: #101114;
            --body-text: #eee;
            --card-bg: #1b1d22;
            --panel-bg: #1b1d22;
            --modal-bg: #1b1d22;
            --header-bg-1: #08090d;
            --header-bg-2: #151923;
            --title-color: #f5f5f5;
            --text-color: #eee;
            --muted-text: #a8a8a8;
            --preview-color: #bdbdbd;
            --border-color: #30333b;
            --soft-border: #353841;
            --input-bg: #111318;
            --input-text: #eee;
            --input-border: #3b3e47;
            --link-color: #5eb7ff;
            --footer-bg: #08090d;
            --footer-text: rgba(255, 255, 255, .55);
            --shadow: rgba(0, 0, 0, .35);
            --strong-shadow: rgba(0, 0, 0, .55);
            --overlay: rgba(0, 0, 0, .78);
            --search-highlight: rgba(240, 192, 64, .35);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--body-bg);
            color: var(--body-text);
            min-height: 100vh;
            transition: var(--transition);
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--header-bg-1), var(--header-bg-2));
            color: var(--header-text);
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .3);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: .8rem;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            white-space: nowrap;
        }
        .header h1 i {
            color: var(--primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: .8rem;
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        /* ===== SEARCH ===== */
        .search-wrap {
            position: relative;
            flex: 1 1 260px;
            min-width: 160px;
            max-width: 400px;
        }

        .search-wrap i.fa-search {
            position: absolute;
            left: .9rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, .5);
            font-size: .9rem;
            pointer-events: none;
            transition: var(--transition);
        }

        #searchInput {
            width: 100%;
            padding: .6rem 2.5rem .6rem 2.4rem;
            border: none;
            border-radius: 30px;
            font-size: .95rem;
            background: rgba(255, 255, 255, .12);
            color: #fff;
            outline: 2px solid transparent;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, .55);
        }

        #searchInput:focus {
            outline-color: var(--primary);
            background: rgba(255, 255, 255, .22);
            box-shadow: 0 0 0 4px rgba(240, 192, 64, .12);
        }

        .search-clear {
            position: absolute;
            right: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, .6);
            cursor: pointer;
            display: none;
            font-size: .9rem;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .search-clear:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }
        .search-clear.active {
            display: block;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: .5rem 1.2rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: var(--transition);
            background: var(--primary);
            color: #1a1a2e;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            white-space: nowrap;
        }
        .btn:hover {
            transform: scale(1.03);
            opacity: .92;
        }
        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #1a1a2e;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }
        .btn-danger:hover {
            background: #a93226;
        }

        .btn-edit {
            background: #3498db;
            color: #fff;
        }
        .btn-edit:hover {
            background: #2e86c1;
        }

        .btn-cancel {
            background: #777;
            color: #fff;
        }
        .btn-cancel:hover {
            background: #666;
        }

        #themeToggleBtn {
            min-width: 44px;
            height: 40px;
            padding: .4rem .9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 30px;
            cursor: pointer;
            font-size: .95rem;
            transition: var(--transition);
        }
        #themeToggleBtn:hover {
            background: var(--primary);
            color: #1a1a2e;
            transform: scale(1.04);
        }

        .song-count {
            font-size: .85rem;
            color: rgba(255, 255, 255, .7);
            white-space: nowrap;
            font-weight: 500;
        }

        /* ===== MAIN ===== */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.8rem 1.5rem;
        }

        /* ===== SEARCH STATUS BAR ===== */
        .search-status {
            margin-bottom: 1.2rem;
            display: none;
            padding: .7rem 1.2rem;
            background: var(--card-bg);
            border-radius: 12px;
            color: var(--muted-text);
            box-shadow: 0 4px 15px var(--shadow);
            font-size: .9rem;
            border-left: 4px solid var(--primary);
            align-items: center;
            gap: .6rem;
            flex-wrap: wrap;
        }
        .search-status.active {
            display: flex;
        }
        .search-status strong {
            color: var(--text-color);
        }

        /* ===== GRID ===== */
        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* ===== CARD ===== */
        .song-card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: 0 6px 20px var(--shadow);
            transition: var(--transition);
            border-left: 5px solid var(--primary-dark);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            position: relative;
        }
        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 35px var(--strong-shadow);
        }

        .song-card-header {
            padding: 1.1rem 1.4rem .3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: .5rem;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--title-color);
            line-height: 1.3;
        }
        .song-title i {
            color: var(--primary-dark);
            margin-right: .3rem;
        }
        .song-title .highlight {
            background: var(--search-highlight);
            padding: 0 2px;
            border-radius: 3px;
        }

        .relevance-badge {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .15rem .6rem;
            border-radius: 20px;
            background: rgba(240, 192, 64, .18);
            color: var(--primary-dark);
            font-size: .68rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .relevance-badge i {
            font-size: .6rem;
        }

        .song-card-body {
            padding: .2rem 1.4rem .6rem;
            flex: 1;
        }
        .song-preview {
            color: var(--preview-color);
            font-style: italic;
            font-size: .88rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .song-preview .highlight {
            background: var(--search-highlight);
            padding: 0 2px;
            border-radius: 3px;
        }

        .song-link {
            padding: 0 1.4rem .5rem;
        }
        .song-link a {
            color: var(--link-color);
            text-decoration: none;
            font-size: .85rem;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            transition: var(--transition);
        }
        .song-link a:hover {
            text-decoration: underline;
            opacity: .8;
        }

        .song-footer {
            padding: .6rem 1.4rem .9rem;
            border-top: 1px solid var(--soft-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .78rem;
            color: var(--muted-text);
        }
        .song-footer i {
            color: var(--primary-dark);
        }

        /* ===== NO RESULTS ===== */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
            color: var(--muted-text);
        }
        .no-results-icon {
            font-size: 3.2rem;
            margin-bottom: 1rem;
            color: var(--primary-dark);
            opacity: .7;
        }
        .no-results-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: .4rem;
        }
        .no-results-text {
            font-size: .92rem;
            color: var(--muted-text);
            line-height: 1.6;
        }
        .no-results-text strong {
            color: var(--text-color);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            display: none;
            background: var(--panel-bg);
            color: var(--text-color);
            border-radius: 20px;
            box-shadow: 0 8px 30px var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .admin-panel.active {
            display: block;
        }
        .admin-panel h2,
        .admin-panel h3 {
            color: var(--title-color);
        }
        .admin-panel h2 {
            margin-bottom: 1.2rem;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: .3rem;
            color: var(--text-color);
            font-size: .9rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: .7rem 1rem;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: .95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(240, 192, 64, .10);
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: .7rem;
            flex-wrap: wrap;
            margin-top: .2rem;
        }

        .status-message {
            margin-top: .7rem;
            font-size: .9rem;
            min-height: 1.2rem;
            font-weight: 500;
        }

        .admin-song-list {
            margin-top: 1.8rem;
            border-top: 2px dashed var(--input-border);
            padding-top: 1.2rem;
        }

        .admin-song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .6rem 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            gap: .8rem;
            flex-wrap: wrap;
        }
        .admin-song-item .actions {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .edit-badge {
            display: inline-block;
            margin-left: .4rem;
            padding: .15rem .5rem;
            border-radius: 12px;
            background: #eaf4ff;
            color: #2471a3;
            font-size: .7rem;
            font-weight: 700;
        }
        body.dark-mode .edit-badge {
            background: #1a2a3a;
            color: #7bb8e0;
        }

        /* ===== LOGIN ===== */
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .login-overlay.active {
            display: flex;
        }

        .login-modal {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 2.5rem 2rem;
            border-radius: 28px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 50px var(--strong-shadow);
            text-align: center;
        }
        .login-modal h2 {
            margin-bottom: 1.5rem;
            color: var(--title-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
        }
        .login-modal input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
            transition: var(--transition);
        }
        .login-modal input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(240, 192, 64, .10);
        }
        .login-modal .btn {
            width: 100%;
            padding: .75rem;
            justify-content: center;
        }
        .login-error {
            color: #e74c3c;
            font-size: .9rem;
            margin-top: .7rem;
            min-height: 1.2rem;
        }

        /* ===== DETAIL ===== */
        .song-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(6px);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .song-detail-overlay.active {
            display: flex;
        }

        .song-detail-modal {
            background: var(--modal-bg);
            color: var(--text-color);
            border-radius: 28px;
            max-width: 720px;
            width: 100%;
            padding: 2.5rem;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px var(--strong-shadow);
        }

        .close-btn {
            position: absolute;
            top: .8rem;
            right: 1.2rem;
            font-size: 2rem;
            color: var(--muted-text);
            cursor: pointer;
            border: none;
            background: none;
            line-height: 1;
            padding: 4px 10px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .close-btn:hover {
            background: var(--soft-border);
            color: var(--text-color);
        }

        .detail-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--title-color);
            padding-right: 2.5rem;
        }
        .detail-title i {
            color: var(--primary-dark);
            margin-right: .5rem;
        }

        .detail-lyrics {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.05rem;
            line-height: 1.9;
            white-space: pre-line;
            color: var(--text-color);
            margin: 1.2rem 0;
            padding: 1rem 0;
            border-top: 2px solid var(--soft-border);
            border-bottom: 2px solid var(--soft-border);
        }

        .detail-link a {
            color: var(--link-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            font-weight: 500;
        }
        .detail-link a:hover {
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 1rem;
            font-size: .8rem;
            margin-top: 2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: .6rem;
                padding: .8rem 1rem;
            }
            .header h1 {
                font-size: 1.5rem;
                justify-content: center;
            }
            .header-controls {
                justify-content: center;
                flex-wrap: wrap;
                gap: .6rem;
            }
            .search-wrap {
                flex: 1 1 100%;
                max-width: 100%;
                min-width: 0;
            }
            #searchInput {
                font-size: .9rem;
                padding: .55rem 2.2rem .55rem 2rem;
            }
            .songs-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .song-detail-modal {
                padding: 1.5rem;
                border-radius: 20px;
            }
            .detail-title {
                font-size: 1.4rem;
            }
            .admin-panel {
                padding: 1.2rem;
            }
            .admin-song-item {
                flex-direction: column;
                align-items: stretch;
                gap: .5rem;
            }
            .admin-song-item .actions {
                width: 100%;
                justify-content: flex-start;
            }
            .song-count {
                font-size: .75rem;
            }
            #themeToggleBtn {
                min-width: 38px;
                height: 36px;
                padding: .3rem .7rem;
                font-size: .85rem;
            }
            .btn {
                padding: .4rem 1rem;
                font-size: .82rem;
            }
        }

        @media (max-width: 450px) {
            .header h1 {
                font-size: 1.2rem;
            }
            .song-title {
                font-size: 1rem;
            }
            .song-detail-modal {
                padding: 1rem;
            }
            .detail-title {
                font-size: 1.2rem;
            }
            .detail-lyrics {
                font-size: .95rem;
            }
        }

        /* scrollbar */
        .song-detail-modal::-webkit-scrollbar {
            width: 6px;
        }
        .song-detail-modal::-webkit-scrollbar-track {
            background: var(--soft-border);
            border-radius: 10px;
        }
        .song-detail-modal::-webkit-scrollbar-thumb {
            background: var(--primary-dark);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <h1>
            <i class="fas fa-cross"></i>
            Jesus Songs
        </h1>

        <div class="header-controls">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input
                type="text"
                id="searchInput"
                placeholder="Search songs…"
                autocomplete="off"
                />
                <i class="fas fa-times search-clear" id="searchClear"></i>
            </div>

            <span class="song-count" id="songCount">Loading…</span>

            <button id="themeToggleBtn" title="Toggle theme">
                <i class="fas fa-moon" id="themeIcon"></i>
                <span id="themeText">Dark</span>
            </button>

            <button class="btn btn-outline" id="adminToggleBtn">
                <i class="fas fa-user-shield"></i> Admin
            </button>
        </div>
    </header>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <input type="email" id="loginEmail" placeholder="Admin Email" />
            <input type="password" id="loginPassword" placeholder="Password" />
            <button class="btn" id="loginBtn">Login</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ===== SONG DETAIL OVERLAY ===== -->
    <div class="song-detail-overlay" id="songDetailOverlay">
        <div class="song-detail-modal">
            <button class="close-btn" id="detailCloseBtn">&times;</button>
            <div class="detail-title" id="detailTitle">Song</div>
            <div class="detail-lyrics" id="detailLyrics"></div>
            <div class="detail-link" id="detailLink"></div>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <main class="main">

        <!-- Search Status -->
        <div class="search-status" id="searchStatus"></div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <input type="hidden" id="editingSongId" value="" />

            <h2><i class="fas fa-plus-circle"></i> Add New Song</h2>

            <div class="form-group">
                <label>Song Title *</label>
                <input type="text" id="songTitle" placeholder="e.g. Amazing Grace" />
            </div>

            <div class="form-group">
                <label>Lyrics *</label>
                <textarea id="songLyrics" placeholder="Enter full lyrics…"></textarea>
            </div>

            <div class="form-group">
                <label>Audio / YouTube Link</label>

        // ================================================================
        //  TELUGU TRANSLITERATION
        // ================================================================
        const TELUGU_VOWELS = {
            "అ": "a",
            "ఆ": "aa",
            "ఇ": "i",
            "ఈ": "ee",
            "ఉ": "u",
            "ఊ": "oo",
            "ఋ": "ru",
            "ఎ": "e",
            "ఏ": "ee",
            "ఐ": "ai",
            "ఒ": "o",
            "ఓ": "oo",
            "ఔ": "au"
        };

        const TELUGU_CONSONANTS = {
            "క": "k",
            "ఖ": "kh",
            "గ": "g",
            "ఘ": "gh",
            "ఙ": "ng",
            "చ": "ch",
            "ఛ": "chh",
            "జ": "j",
            "ఝ": "jh",
            "ఞ": "ny",
            "ట": "t",
            "ఠ": "th",
            "డ": "d",
            "ఢ": "dh",
            "ణ": "n",
            "త": "t",
            "థ": "th",
            "ద": "d",
            "ధ": "dh",
            "న": "n",
            "ప": "p",
            "ఫ": "ph",
            "బ": "b",
            "భ": "bh",
            "మ": "m",
            "య": "y",
            "ర": "r",
            "ల": "l",
            "వ": "v",
            "శ": "sh",
            "ష": "sh",
            "స": "s",
            "హ": "h",
            "ళ": "l",
            "ఱ": "r"
        };

        const TELUGU_SIGNS = {
            "ా": "aa",
            "ి": "i",
            "ీ": "ee",
            "ు": "u",
            "ూ": "oo",
            "ృ": "ru",
            "ె": "e",
            "ే": "ee",
            "ై": "ai",
            "ొ": "o",
            "ో": "oo",
            "ౌ": "au"
        };

        const TELUGU_SPECIAL = {
            "ం": "m",
            "ః": "h",
            "ఁ": "m"
        };

        function transliterateTelugu(text) {
            if (!text) return "";
            const chars = Array.from(String(text));
            let result = "";
            for (let i = 0; i < chars.length; i++) {
                const ch = chars[i];
                if (TELUGU_VOWELS[ch]) { result += TELUGU_VOWELS[ch]; continue; }
                if (TELUGU_SPECIAL[ch]) { result += TELUGU_SPECIAL[ch]; continue; }
                if (TELUGU_CONSONANTS[ch]) {
                    const base = TELUGU_CONSONANTS[ch];
                    const next = chars[i + 1];
                    if (next && TELUGU_SIGNS[next]) { result += base + TELUGU_SIGNS[next];
                        i++; continue; }
                    if (next === "్") { result += base;
                        i++; continue; }
                    result += base + "a";
                    continue;
                }
                if (ch === "్") continue;
                result += ch;
            }
            return result;
        }

        function createRomanVariants(text) {
            const base = normalizeBasic(text);
            if (!base) return [];
            const set = new Set([base]);
            set.add(base.replace(/aa/g, "a").replace(/ee/g, "i").replace(/ii/g, "i").replace(/oo/g, "u").replace(/uu/g,
                "u"));
            set.add(base.replace(/ee/g, "e").replace(/aa/g, "a").replace(/oo/g, "o").replace(/uu/g, "u"));
            set.add(base.replace(/sh/g, "s").replace(/chh/g, "ch").replace(/kh/g, "k").replace(/gh/g, "g")
                .replace(/dh/g, "d").replace(/bh/g, "b").replace(/ph/g, "p").replace(/th/g, "t")
                .replace(/jh/g, "j"));
            return [...set];
        }

        function normalizeBasic(text) {
            if (!text) return "";
            return String(text)
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[\u200B-\u200D\uFEFF]/g, "")
                .replace(/[’‘`]/g, "'")
                .replace(/[^a-z0-9\u0C00-\u0C7F\s']/gi, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function tokenize(text) {
            return normalizeBasic(text).split(/\s+/).filter(w => w.length > 0);
        }

        // ================================================================
        //  LEVENSHTEIN
        // ================================================================
        function levenshtein(a, b) {
            a = String(a || "");
            b = String(b || "");
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;
            let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
            for (let i = 0; i < a.length; i++) {
                const cur = [i + 1];
                for (let j = 0; j < b.length; j++) {
                    const ins = cur[j] + 1;
                    const del = prev[j + 1] + 1;
                    const rep = prev[j] + (a[i] === b[j] ? 0 : 1);
                    cur.push(Math.min(ins, del, rep));
                }
                prev = cur;
            }
            return prev[b.length];
        }

        function fuzzyTokenMatch(queryWord, targetWords) {
            if (!queryWord) return false;
            for (const target of targetWords) {
                if (!target) continue;
                if (target === queryWord) return true;
                if (target.startsWith(queryWord) || queryWord.startsWith(target)) {
                    if (Math.abs(target.length - queryWord.length) <= 2) return true;
                }
                if (queryWord.length >= 4 && target.length >= 4) {
                    const allowed = queryWord.length >= 7 ? 2 : 1;
                    if (levenshtein(queryWord, target) <= allowed) return true;
                }
            }
            return false;
        }

        // ================================================================
        //  SEARCH DATA
        // ================================================================
        function buildSearchData(song) {
            const title = song.title || "";
            const artist = song.artist || "";
            const lyrics = song.lyrics || "";
            const category = song.category || "";
            const original = normalizeBasic(`${title} ${artist} ${lyrics} ${category}`);
            const titleOriginal = normalizeBasic(title);
            const titleRoman = normalizeBasic(transliterateTelugu(title));
            const lyricsRoman = normalizeBasic(transliterateTelugu(lyrics));
            const artistRoman = normalizeBasic(transliterateTelugu(artist));
            const categoryRoman = normalizeBasic(transliterateTelugu(category));
            const allRoman = normalizeBasic(transliterateTelugu(`${title} ${artist} ${lyrics} ${category}`));
            return { original, titleOriginal, titleRoman, lyricsRoman, artistRoman, categoryRoman, allRoman };
        }

        function getQueryVariants(query) {
            const raw = normalizeBasic(query);
            const teluguToRoman = normalizeBasic(transliterateTelugu(query));
            const set = new Set();
            if (raw) set.add(raw);
            if (teluguToRoman) set.add(teluguToRoman);
            createRomanVariants(raw).forEach(x => set.add(x));
            createRomanVariants(teluguToRoman).forEach(x => set.add(x));
            return [...set];
        }

        // ================================================================
        //  SCORE SONG  —  YouTube / Google style
        // ================================================================
        function scoreSong(song, query) {
            if (!query) return 0;
            const data = buildSearchData(song);
            const queryVariants = getQueryVariants(query);
            const queryWords = tokenize(query);
            let best = 0;

            // --- Exact title match (highest) ---
            for (const q of queryVariants) {
                if (q === data.titleOriginal || q === data.titleRoman) {
                    best = Math.max(best, 1000);
                }
            }

            // --- Title starts with query ---
            for (const q of queryVariants) {
                if (data.titleOriginal.startsWith(q) || data.titleRoman.startsWith(q)) {
                    best = Math.max(best, 880);
                }
            }

            // --- Query inside title ---
            for (const q of queryVariants) {
                if (q.length >= 2 && (data.titleOriginal.includes(q) || data.titleRoman.includes(q))) {
                    best = Math.max(best, 750);
                }
            }

            // --- All query words in title (fuzzy) ---
            const titleWords = [...tokenize(data.titleOriginal), ...tokenize(data.titleRoman)];
            let titleWordMatches = 0;
            for (const qw of queryWords) {
                const variants = getQueryVariants(qw);
                let matched = false;
                for (const v of variants) {
                    if (fuzzyTokenMatch(v, titleWords)) { matched = true; break; }
                }
                if (matched) titleWordMatches++;
            }
            if (queryWords.length > 0 && titleWordMatches === queryWords.length) {
                best = Math.max(best, 820);
            } else if (titleWordMatches > 0) {
                best = Math.max(best, 500 + titleWordMatches * 30);
            }

            // --- Lyrics match ---
            for (const q of queryVariants) {
                if (q.length >= 2 && data.lyricsRoman.includes(q)) {
                    best = Math.max(best, 320);
                }
                if (q.length >= 2 && data.original.includes(q)) {
                    best = Math.max(best, 260);
                }
            }

            // --- Artist ---
            for (const q of queryVariants) {
                if (data.artistRoman.includes(q)) best = Math.max(best, 180);
            }

            // --- Category ---
            for (const q of queryVariants) {
                if (data.categoryRoman.includes(q)) best = Math.max(best, 90);
            }

            return best;
        }

        function songMatchesSearch(song, query) {
            if (!query.trim()) return true;
            return scoreSong(song, query) > 0;
        }

        // ================================================================
        //  ESCAPE
        // ================================================================
        function escapeHTML(v) { return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        function escapeAttribute(v) { return escapeHTML(v); }

        // ================================================================
        //  HIGHLIGHT
        // ================================================================
        function highlightText(text, query) {
            if (!query || !text) return escapeHTML(text);
            const q = normalizeBasic(query);
            if (!q) return escapeHTML(text);
            const words = q.split(/\s+/).filter(w => w.length >= 2);
            if (!words.length) return escapeHTML(text);
            let result = escapeHTML(text);
            for (const w of words) {
                const pattern = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                result = result.replace(pattern, '<span class="highlight">$1</span>');
            }
            return result;
        }

        function highlightPreview(text, query) {
            if (!query || !text) return escapeHTML(text);
            const q = normalizeBasic(query);
            if (!q) return escapeHTML(text);
            const words = q.split(/\s+/).filter(w => w.length >= 2);
            if (!words.length) return escapeHTML(text);
            let result = escapeHTML(text);
            for (const w of words) {
                const pattern = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                result = result.replace(pattern, '<span class="highlight">$1</span>');
            }
            return result;
        }

        function renderSongs() {

                songCount.textContent = `${songs.length} song${songs.length !== 1 ? "s" : ""}`;
                searchStatus.classList.remove("active");
                return;
            }

            const results = songs
                .map(song => ({ song, score: scoreSong(song, q) }))
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score);

            songCount.textContent = `${results.length} result${results.length !== 1 ? "s" : ""}`;

            searchStatus.classList.add("active");

            if (!results.length) {
                grid.innerHTML = `

        // ================================================================

        function renderCards(results, showScore) {
            grid.innerHTML = results.map(item => {
                const song = item.song;

                const badgeHtml = showScore && item.score > 700 ?

                    (showScore && item.score > 400 ?

                        (showScore && item.score > 0 ?
                            `<span class="relevance-badge"><i class="fas fa-check"></i> Match</span>` :
                            ""));

                return `
              <div class="song-card" data-id="${escapeAttribute(song.id)}">
                <div class="song-card-header">
                  <span class="song-title"><i class="fas fa-music"></i> ${titleHtml}</span>

                <div class="song-card-body">

                ${link ? `

        async function addSong() {
            if (!currentUser) { alert("Please login as admin first."); return; }
            const editId = Number(editingSongId.value);
            if (editId) { await updateSong(editId); return; }

            const title = songTitle.value.trim();

                alert("Song title and lyrics are required.");

            addSongBtn.disabled = true;
            addSongBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving…`;

            const { error } = await supabaseClient.from("songs").insert([{
                title,
                artist: "Jesus Songs",
                lyrics,
                audio_url: link || null,
                category: category || "Worship"

            addSongBtn.disabled = false;

            songLink.value = song.audio_url || "";
            songCategory.value = song.category || "";
            addSongBtn.innerHTML = `<i class="fas fa-save"></i> Update Song`;
            cancelEditBtn.style.display = "inline-block";
            formStatus.textContent = `Editing: ${song.title}`;
            formStatus.style.color = "#2471a3";
            renderAdminList();
            songTitle.scrollIntoView({ behavior: "smooth", block: "center" });
            songTitle.focus();
        }

        function cancelEdit() {
            editingSongId.value = "";
            songTitle.value = "";
            songLyrics.value = "";
            songLink.value = "";
            songCategory.value = "";
            addSongBtn.innerHTML = `<i class="fas fa-save"></i> Add Song`;
            cancelEditBtn.style.display = "none";
            formStatus.textContent = "";
            renderAdminList();
        }

        async function updateSong(id) {
            const title = songTitle.value.trim();
            const lyrics = songLyrics.value.trim();
            const link = songLink.value.trim();
            const category = songCategory.value.trim();

            if (!title || !lyrics) {
                alert("Song title and lyrics are required.");
                return;
            }

            addSongBtn.disabled = true;
            cancelEditBtn.disabled = true;
            addSongBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Updating…`;

            const { error } = await supabaseClient.from("songs").update({
                title,
                lyrics,
                audio_url: link || null,
                category: category || "Worship"
            }).eq("id", id);

            addSongBtn.disabled = false;
            cancelEditBtn.disabled = false;

            if (error) {
                console.error(error);
                formStatus.textContent = "❌ Update failed: " + error.message;
                formStatus.style.color = "#c0392b";
                addSongBtn.innerHTML = `<i class="fas fa-save"></i> Update Song`;
                return;
            }
            cancelEdit();
            await loadSongs();
            alert("✅ Song updated successfully!");
        }

        async function deleteSong(id) {
            if (!currentUser) return;
            if (!confirm("Are you sure you want to delete this song?")) return;
            const { error } = await supabaseClient.from("songs").delete().eq("id", id);
            if (error) {
                console.error(error);
                alert("❌ Delete failed:\n\n" + error.message);
                return;
            }
            if (Number(editingSongId.value) === Number(id)) cancelEdit();
            await loadSongs();
            alert("✅ Song deleted successfully.");
        }

        // ================================================================
        //  SEARCH INPUT — real-time with debounce
        // ================================================================
        let searchTimeout = null;

        searchInput.addEventListener("input", function() {
            const val = this.value;
            searchQuery = val;

            if (val.trim()) {
                searchClear.classList.add("active");
            } else {
                searchClear.classList.remove("active");
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderSongs();
            }, 120);
        });

        searchClear.addEventListener("click", function() {
            searchInput.value = "";
            searchQuery = "";
            searchClear.classList.remove("active");
            searchInput.focus();
            clearTimeout(searchTimeout);
            renderSongs();
        });

        // ================================================================
        //  EVENT BINDINGS
        // ================================================================
        adminToggleBtn.addEventListener("click", async function() {
            if (currentUser) { await logout(); return; }
            loginOverlay.classList.add("active");
            loginError.textContent = "";
            loginEmail.focus();
        });

        loginBtn.addEventListener("click", login);
        loginPassword.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
        loginEmail.addEventListener("keydown", e => { if (e.key === "Enter") login(); });

        loginOverlay.addEventListener("click", function(e) {
            if (e.target === this) loginOverlay.classList.remove("active");
        });

        detailCloseBtn.addEventListener("click", closeDetail);
        detailOverlay.addEventListener("click", function(e) {
            if (e.target === this) closeDetail();
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") { closeDetail();
                loginOverlay.classList.remove("active"); }
        });

        grid.addEventListener("click", function(e) {
            if (e.target.closest("a")) return;
            const card = e.target.closest(".song-card");
            if (!card) return;
            const id = Number(card.dataset.id);
            const song = songs.find(s => Number(s.id) === id);
            if (song) openDetail(song);
        });

        addSongBtn.addEventListener("click", addSong);
        cancelEditBtn.addEventListener("click", cancelEdit);
        logoutBtn.addEventListener("click", logout);

        // ================================================================
        //  CHECK USER
        // ================================================================
        async function checkUser() {
            const { data } = await supabaseClient.auth.getUser();
            if (data && data.user) {
                currentUser = data.user;
                adminPanel.classList.add("active");
                setAdminButton();
            }
        }

        // ================================================================
        //  AUTH STATE CHANGE
        // ================================================================
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                currentUser = session.user;
                adminPanel.classList.add("active");
                setAdminButton();
                renderAdminList();
            } else {
                currentUser = null;
                adminPanel.classList.remove("active");
                resetAdminButton();
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        async function init() {
            initializeTheme();
            await checkUser();
            await loadSongs();
        }

        init();
    </script>

</body>
</html>
