<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🙏 Jesus Songs – Admin & Public</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#f7f3ee;
    --surface:#fff;
    --surface-2:#fbf8f4;
    --text:#222;
    --muted:#666;
    --border:#e8e0d7;
    --gold:#b8860b;
    --shadow:0 6px 20px rgba(0,0,0,.06);
}

body.dark{
    --bg:#0f1117;
    --surface:#181b24;
    --surface-2:#20242f;
    --text:#f2f4f8;
    --muted:#aeb6c4;
    --border:#303644;
    --gold:#f0c040;
    --shadow:0 8px 28px rgba(0,0,0,.35);
}

body{
    font-family:'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.25s;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    color:#f5e6d3;
    padding:1.2rem 2rem;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    position:sticky;
    top:0;
    z-index:100;
}

.header h1{
    font-size:1.9rem;
    display:flex;
    align-items:center;
    gap:.5rem;
}

.header h1 i{
    color:#f0c040;
}

.header-controls{
    display:flex;
    align-items:center;
    gap:1rem;
    flex-wrap:wrap;
}

.search-wrap{
    position:relative;
}

.search-wrap i{
    position:absolute;
    left:.8rem;
    top:50%;
    transform:translateY(-50%);
    color:rgba(255,255,255,.5);
}

#searchInput{
    padding:.5rem 1rem .5rem 2.2rem;
    border:none;
    border-radius:30px;
    font-size:.95rem;
    background:rgba(255,255,255,.15);
    color:#fff;
    outline:2px solid transparent;
    min-width:200px;
}

#searchInput::placeholder{
    color:rgba(255,255,255,.6);
}

#searchInput:focus{
    outline-color:#f0c040;
}

.btn{
    padding:.5rem 1.2rem;
    border:none;
    border-radius:30px;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    transition:.25s;
    background:#f0c040;
    color:#1a1a2e;
}

.btn:hover{
    transform:scale(1.03);
    opacity:.9;
}

.btn-outline{
    background:transparent;
    border:2px solid #f0c040;
    color:#f0c040;
}

.btn-danger{
    background:#c0392b;
    color:#fff;
}

.btn-edit{
    background:#3498db;
    color:#fff;
}

.theme-btn{
    width:44px;
    height:44px;
    padding:0;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    max-width:1200px;
    margin:auto;
    padding:2rem 1.5rem;
}

.songs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1.5rem;
}

.song-card{
    background:var(--surface);
    border-radius:16px;
    box-shadow:var(--shadow);
    transition:.3s;
    border-left:5px solid var(--gold);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    user-select:none;
}

.song-card:hover{
    transform:translateY(-4px);
}

.song-card-header{
    padding:1.2rem 1.5rem .5rem;
}

.song-title{
    font-size:1.15rem;
    font-weight:700;
}

.song-title i{
    color:var(--gold);
    margin-right:.4rem;
}

.song-card-body{
    padding:0 1.5rem .8rem;
    flex:1;
}

.song-preview{
    color:var(--muted);
    font-style:italic;
    font-size:.9rem;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.song-actions{
    display:flex;
    gap:.55rem;
    flex-wrap:wrap;
    padding:.2rem 1.5rem .9rem;
}

.song-action-btn{
    padding:.45rem .8rem;
    border:0;
    border-radius:22px;
    cursor:pointer;
    font-weight:700;
    font-size:.82rem;
    background:#f0c040;
    color:#1a1a2e;
}

.song-action-btn.secondary{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--border);
}

.song-footer{
    padding:.7rem 1.5rem 1rem;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    font-size:.8rem;
    color:var(--muted);
}

.no-results{
    text-align:center;
    padding:3rem;
    grid-column:1/-1;
    color:var(--muted);
}

/* =========================================================
   ADMIN
========================================================= */

.admin-panel{
    display:none;
    background:var(--surface);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:2rem;
    margin-bottom:2rem;
}

.admin-panel.active{
    display:block;
}

.form-group{
    margin-bottom:1rem;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:.3rem;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:.7rem 1rem;
    border:2px solid var(--border);
    border-radius:8px;
    font-size:.95rem;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
}

.form-group textarea{
    min-height:140px;
    resize:vertical;
}

.form-actions{
    display:flex;
    gap:.7rem;
    flex-wrap:wrap;
}

.btn-cancel{
    background:#777;
    color:#fff;
}

.status-message{
    margin-top:.8rem;
    min-height:1.2rem;
}

.admin-song-list{
    margin-top:2rem;
    border-top:2px dashed var(--border);
    padding-top:1.5rem;
}

.admin-song-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.7rem 0;
    border-bottom:1px solid var(--border);
}

.admin-song-item .actions{
    display:flex;
    gap:.5rem;
}

.edit-badge{
    display:inline-block;
    margin-left:.5rem;
    padding:.2rem .55rem;
    border-radius:12px;
    background:#eaf4ff;
    color:#3498db;
    font-size:.72rem;
    font-weight:700;
}

/* =========================================================
   LOGIN
========================================================= */

.login-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(4px);
    z-index:1000;
    justify-content:center;
    align-items:center;
}

.login-overlay.active{
    display:flex;
}

.login-modal{
    background:var(--surface);
    padding:2.5rem 2rem;
    border-radius:24px;
    max-width:380px;
    width:90%;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    text-align:center;
}

.login-modal h2{
    margin-bottom:1.5rem;
}

.login-modal input{
    width:100%;
    padding:.7rem 1rem;
    margin-bottom:1rem;
    border:2px solid var(--border);
    border-radius:8px;
    font-size:1rem;
    background:var(--surface);
    color:var(--text);
}

.login-modal .btn{
    width:100%;
}

.login-error{
    color:#c0392b;
    font-size:.9rem;
    margin-top:.7rem;
}

/* =========================================================
   LYRICS MODAL
========================================================= */

.song-detail-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(6px);
    z-index:800;
    justify-content:center;
    align-items:center;
    padding:2rem;
}

.song-detail-overlay.active{
    display:flex;
}

.song-detail-modal{
    background:var(--surface);
    border-radius:28px;
    max-width:720px;
    width:100%;
    padding:2.5rem;
    max-height:90vh;
    overflow-y:auto;
    position:relative;
}

.close-btn{
    position:absolute;
    top:1rem;
    right:1.5rem;
    font-size:2rem;
    color:#888;
    cursor:pointer;
    border:none;
    background:none;
}

.detail-title{
    font-size:2rem;
    font-weight:700;
    padding-right:2rem;
}

.detail-title i{
    color:var(--gold);
    margin-right:.5rem;
}

.detail-lyrics{
    font-family:Georgia,serif;
    font-size:1.1rem;
    line-height:1.9;
    white-space:pre-line;
    color:var(--text);
    margin:1.5rem 0;
    padding:1rem 0;
    border-top:2px solid var(--border);
    border-bottom:2px solid var(--border);
}

/* =========================================================
   MUSIC MINI PLAYER
========================================================= */

.youtube-player{
    position:fixed;
    right:18px;
    bottom:18px;
    width:360px;
    max-width:calc(100vw - 36px);
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.3);
    z-index:700;
    display:none;
}

.youtube-player.active{
    display:block;
}

/* Hidden YouTube player */

#youtubeAudioFrame{
    position:fixed;
    width:1px;
    height:1px;
    left:-9999px;
    top:-9999px;
    opacity:0;
    pointer-events:none;
    border:0;
}

/* PLAYER HEADER */

.player-head{
    min-height:65px;
    padding:.7rem .8rem;
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.7rem;
}

/*
   IMPORTANT:
   Mini player song area is clickable.
   Clicking it opens lyrics.
*/

.player-info{
    display:flex;
    align-items:center;
    min-width:0;
    gap:.7rem;
    cursor:pointer;
    flex:1;
    border-radius:12px;
    padding:.2rem;
    transition:.2s;
}

.player-info:hover{
    background:rgba(240,192,64,.12);
}

.player-info:active{
    transform:scale(.98);
}

.music-icon{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f0c040;
    color:#1a1a2e;
}

.player-text{
    min-width:0;
}

.player-title{
    font-weight:700;
    font-size:.88rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-status{
    color:var(--muted);
    font-size:.7rem;
    margin-top:2px;
}

.player-actions{
    display:flex;
    gap:.15rem;
    flex-shrink:0;
}

.player-actions button{
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--text);
    cursor:pointer;
}

.player-actions button:hover{
    background:var(--border);
}

/* TIME */

.player-time{
    display:flex;
    align-items:center;
    gap:.5rem;
    padding:.55rem .8rem .15rem;
    color:var(--muted);
    font-size:.7rem;
}

.player-time span{
    min-width:34px;
}

#playerDuration{
    text-align:right;
}

/* SEEK */

#seekBar{
    width:100%;
    height:5px;
    accent-color:#f0c040;
    cursor:pointer;
}

/* CONTROLS */

.player-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.7rem;
    padding:.45rem .7rem .75rem;
}

.control-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.control-btn:hover{
    background:var(--border);
}

.control-btn.play-pause{
    width:46px;
    height:46px;
    background:#f0c040;
    color:#1a1a2e;
    font-size:1rem;
}

.volume-wrap{
    display:flex;
    align-items:center;
    gap:.3rem;
    margin-left:.25rem;
}

#volumeBar{
    width:65px;
    accent-color:#f0c040;
    cursor:pointer;
}

/* PROGRESS */

.progress-bottom{
    height:3px;
    background:var(--border);
}

.progress-bottom span{
    display:block;
    height:100%;
    width:0%;
    background:#f0c040;
}

/* COMPACT */

.youtube-player.compact{
    width:240px;
}

.youtube-player.compact .player-status,
.youtube-player.compact .player-time,
.youtube-player.compact .player-controls,
.youtube-player.compact .progress-bottom{
    display:none;
}

.youtube-player.compact .player-head{
    min-height:58px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:#1a1a2e;
    color:rgba(255,255,255,.4);
    text-align:center;
    padding:1.2rem;
    font-size:.8rem;
    margin-top:2rem;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .header{
        flex-direction:column;
        align-items:stretch;
        gap:.8rem;
    }

    .header-controls{
        justify-content:center;
    }

    #searchInput{
        width:100%;
    }

    .songs-grid{
        grid-template-columns:1fr;
    }

    .song-detail-modal{
        padding:1.5rem;
        max-height:88vh;
    }

    .youtube-player{
        right:10px;
        bottom:10px;
        width:calc(100vw - 20px);
        max-width:calc(100vw - 20px);
    }

    .admin-song-item{
        flex-direction:column;
        align-items:flex-start;
        gap:.7rem;
    }

}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <h1>
        <i class="fas fa-cross"></i>
        Jesus Songs
    </h1>

    <div class="header-controls">

        <div class="search-wrap">

            <i class="fas fa-search"></i>

            <input
                id="searchInput"
                type="text"
                placeholder="Search songs..."
            >

        </div>

        <span
            class="song-count"
            id="songCount"
        >
            Loading...
        </span>

        <button
            class="btn btn-outline theme-btn"
            id="themeToggleBtn"
            type="button"
        >
            <i class="fas fa-moon"></i>
        </button>

        <button
            class="btn btn-outline"
            id="adminToggleBtn"
            type="button"
        >
            <i class="fas fa-user-shield"></i>
            Admin
        </button>

    </div>

</header>


<!-- =========================================================
     LOGIN
========================================================= -->

<div
    class="login-overlay"
    id="loginOverlay"
>

    <div class="login-modal">

        <h2>
            <i class="fas fa-lock"></i>
            Admin Login
        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button
            class="btn"
            id="loginBtn"
        >
            Login
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- =========================================================
     LYRICS MODAL
========================================================= -->

<div
    class="song-detail-overlay"
    id="songDetailOverlay"
>

    <div class="song-detail-modal">

        <button
            class="close-btn"
            id="detailCloseBtn"
            type="button"
        >
            &times;
        </button>

        <div
            class="detail-title"
            id="detailTitle"
        >
            Song
        </div>

        <div
            class="detail-lyrics"
            id="detailLyrics"
        ></div>

        <div id="detailLink"></div>

    </div>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

    <!-- ADMIN -->

    <div
        class="admin-panel"
        id="adminPanel"
    >

        <input
            type="hidden"
            id="editingSongId"
        >

        <h2>
            <i class="fas fa-plus-circle"></i>
            Add New Song
        </h2>

        <div class="form-group">

            <label>Song Title *</label>

            <input
                id="songTitle"
                type="text"
                placeholder="Amazing Grace"
            >

        </div>

        <div class="form-group">

            <label>Lyrics *</label>

            <textarea
                id="songLyrics"
                placeholder="Enter full lyrics..."
            ></textarea>

        </div>

        <div class="form-group">

            <label>Audio / YouTube Link</label>

            <input
                id="songLink"
                type="url"
                placeholder="https://www.youtube.com/watch?v=..."
            >

        </div>

        <div class="form-group">

            <label>Category</label>

            <input
                id="songCategory"
                type="text"
                placeholder="Worship"
            >

        </div>

        <div class="form-actions">

            <button
                class="btn"
                id="addSongBtn"
                type="button"
            >
                <i class="fas fa-save"></i>
                Add Song
            </button>

            <button
                class="btn btn-cancel"
                id="cancelEditBtn"
                type="button"
                style="display:none"
            >
                Cancel
            </button>

        </div>

        <div
            class="status-message"
            id="formStatus"
        ></div>

        <hr style="margin:1.5rem 0">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
        ">

            <h3>Existing Songs</h3>

            <button
                class="btn btn-danger"
                id="logoutBtn"
                type="button"
            >
                Logout
            </button>

        </div>

        <div
            class="admin-song-list"
            id="adminSongList"
        ></div>

    </div>


    <!-- SONGS -->

    <div
        class="songs-grid"
        id="songsGrid"
    ></div>

</main>


<!-- =========================================================
     CUSTOM MUSIC PLAYER
========================================================= -->

<div
    class="youtube-player"
    id="youtubePlayer"
>

    <div class="player-head">

        <!--
            CLICK THIS AREA TO OPEN LYRICS
        -->

        <div
            class="player-info"
            id="playerInfo"
            title="Click to view lyrics"
        >

            <div class="music-icon">

                <i class="fas fa-music"></i>

            </div>

            <div class="player-text">

                <div
                    class="player-title"
                    id="playerTitle"
                >
                    Now Playing
                </div>

                <div class="player-status">
                    ♪ Playing from YouTube · Click for lyrics
                </div>

            </div>

        </div>


        <div class="player-actions">

            <button
                id="compactBtn"
                title="Mini Player"
                type="button"
            >
                <i class="fas fa-minus"></i>
            </button>

            <button
                id="closePlayerBtn"
                title="Stop"
                type="button"
            >
                <i class="fas fa-times"></i>
            </button>

        </div>

    </div>


    <!-- CURRENT TIME + TOTAL DURATION -->

    <div class="player-time">

        <span id="playerCurrentTime">
            0:00
        </span>

        <input
            id="seekBar"
            type="range"
            min="0"
            max="100"
            step="0.1"
            value="0"
        >

        <span id="playerDuration">
            0:00
        </span>

    </div>


    <!-- CONTROLS -->

    <div class="player-controls">

        <button
            class="control-btn"
            id="back15Btn"
            title="Back 15 seconds"
            type="button"
        >
            <i class="fas fa-rotate-left"></i>
        </button>

        <button
            class="control-btn play-pause"
            id="playPauseBtn"
            title="Play/Pause"
            type="button"
        >
            <i class="fas fa-pause"></i>
        </button>

        <button
            class="control-btn"
            id="forward15Btn"
            title="Forward 15 seconds"
            type="button"
        >
            <i class="fas fa-rotate-right"></i>
        </button>

        <div class="volume-wrap">

            <i class="fas fa-volume-up"></i>

            <input
                id="volumeBar"
                type="range"
                min="0"
                max="100"
                value="100"
            >

        </div>

    </div>


    <div class="progress-bottom">

        <span id="progressFill"></span>

    </div>

</div>


<!-- =========================================================
     HIDDEN YOUTUBE PLAYER
========================================================= -->

<div id="youtubeAudioFrame"></div>


<footer class="footer">

    ✝️ Jesus Songs · Powered by Branks3

</footer>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://nlybxlbtqvueulacwwju.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_PzB8o8cCresQ496jXnimbA_UyJ0yJ-6";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   STATE
========================================================= */

let songs = [];

let searchQuery = "";

let currentUser = null;

let youtubePlayerAPI = null;

let currentSong = null;

let playerReady = false;

let playerTimer = null;

let userSeeking = false;


/* =========================================================
   DOM
========================================================= */

const grid =
document.getElementById("songsGrid");

const searchInput =
document.getElementById("searchInput");

const songCount =
document.getElementById("songCount");

const adminPanel =
document.getElementById("adminPanel");

const adminToggleBtn =
document.getElementById("adminToggleBtn");

const loginOverlay =
document.getElementById("loginOverlay");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");

const logoutBtn =
document.getElementById("logoutBtn");

/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady(){

    youtubePlayerAPI =
    new YT.Player(
        "youtubeAudioFrame",
        {
            width:"1",
            height:"1",

            playerVars:{
                autoplay:0,
                controls:0,
                disablekb:1,
                fs:0,
                rel:0,
                modestbranding:1,
                playsinline:1
            },

            events:{

                onReady:function(){

                    playerReady = true;

                },

                onStateChange:function(event){

                    handlePlayerState(event);

                }

            }

        }
    );

}


/* =========================================================
   YOUTUBE URL → VIDEO ID
========================================================= */

function getYouTubeId(url){

    if(!url) return null;

    const value =
    String(url).trim();

    const patterns = [

        /youtu\.be\/([^?&#/]+)/i,

        /youtube\.com\/watch\?[^#]*v=([^?&#/]+)/i,

        /youtube\.com\/shorts\/([^?&#/]+)/i,

        /youtube\.com\/embed\/([^?&#/]+)/i,

        /youtube-nocookie\.com\/embed\/([^?&#/]+)/i

    ];

    for(const pattern of patterns){

        const match =
        value.match(pattern);

        if(match && match[1]){

            return match[1];

        }

    }

    if(
        /^[a-zA-Z0-9_-]{11}$/.test(value)
    ){

        return value;

    }

    return null;

}


/* =========================================================
   PLAY SONG
========================================================= */

function playYouTube(song){

    const videoId =
    getYouTubeId(song.audio_url);

    if(!videoId){

        alert(
            "Invalid YouTube link.\n\n" +
            "Example:\n" +
            "https://www.youtube.com/watch?v=VIDEO_ID"
        );

        return;

    }

    currentSong = song;

    playerTitle.textContent =
    song.title || "Now Playing";

    customPlayer.classList.add("active");

    customPlayer.classList.remove("compact");

    seekBar.value = 0;

    playerCurrentTime.textContent =
    "0:00";

    playerDuration.textContent =
    "0:00";

    progressFill.style.width =
    "0%";

    playPauseBtn.innerHTML =
    `<i class="fas fa-pause"></i>`;

    if(!playerReady){

        alert(
            "YouTube player is still loading. " +
            "Please click Play again."
        );

        return;

    }

    youtubePlayerAPI.loadVideoById({

        videoId:videoId,

        startSeconds:0

    });

    youtubePlayerAPI.setVolume(
        Number(volumeBar.value)
    );

    youtubePlayerAPI.playVideo();

    startPlayerTimer();

}

/* =========================================================
   PLAYER STATE
========================================================= */

function handlePlayerState(event){

    if(event.data === YT.PlayerState.PLAYING){

        playPauseBtn.innerHTML =
        `<i class="fas fa-pause"></i>`;

        startPlayerTimer();

    }

    else if(
        event.data === YT.PlayerState.PAUSED
    ){

        playPauseBtn.innerHTML =
        `<i class="fas fa-play"></i>`;

        stopPlayerTimer();

    }

    else if(
        event.data === YT.PlayerState.ENDED
    ){

        playPauseBtn.innerHTML =
        `<i class="fas fa-play"></i>`;

        stopPlayerTimer();

        seekBar.value = 100;

        progressFill.style.width =
        "100%";

    }

}


/* =========================================================
   PLAYER TIMER
========================================================= */

function startPlayerTimer(){

    stopPlayerTimer();

    playerTimer =
    setInterval(
        updatePlayerProgress,
        500
    );

}


function stopPlayerTimer(){

    if(playerTimer){

        clearInterval(playerTimer);

        playerTimer = null;

    }

}


function updatePlayerProgress(){

    if(
        !youtubePlayerAPI ||
        !playerReady ||
        userSeeking
    ){

        return;

    }

    const duration =
    youtubePlayerAPI.getDuration();

    const current =
    youtubePlayerAPI.getCurrentTime();

    if(!duration || duration <= 0){

        return;

    }

    playerCurrentTime.textContent =
    formatTime(current);

    playerDuration.textContent =
    formatTime(duration);

    const percent =
    (current / duration) * 100;

    seekBar.value =
    Math.min(
        100,
        Math.max(0,percent)
    );

    progressFill.style.width =
    percent + "%";

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds){

    seconds =
    Math.max(
        0,
        Math.floor(
            Number(seconds) || 0
        )
    );

    const hours =
    Math.floor(
        seconds / 3600
    );

    const minutes =
    Math.floor(
        (seconds % 3600) / 60
    );

    const secs =
    String(
        seconds % 60
    ).padStart(2,"0");

    if(hours > 0){

        return (
            hours +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            secs
        );

    }

    return (
        minutes +
        ":" +
        secs
    );

}


/* =========================================================
   SEEK BAR
========================================================= */

seekBar.addEventListener(
    "mousedown",
    function(){

        userSeeking = true;

    }
);

seekBar.addEventListener(
    "touchstart",
    function(){

        userSeeking = true;

    },
    {passive:true}
);

seekBar.addEventListener(
    "input",
    function(){

        const duration =
        youtubePlayerAPI
        ? youtubePlayerAPI.getDuration()
        : 0;

        if(!duration) return;

        const target =
        (
            Number(this.value) / 100
        ) * duration;

        playerCurrentTime.textContent =
        formatTime(target);

        progressFill.style.width =
        this.value + "%";

    }
);


function finishSeek(){

    if(!youtubePlayerAPI){

        userSeeking = false;

        return;

    }

    const duration =
    youtubePlayerAPI.getDuration();

    if(duration){

        const target =
        (
            Number(seekBar.value) / 100
        ) * duration;

        youtubePlayerAPI.seekTo(
            target,
            true
        );

    }

    userSeeking = false;

}


seekBar.addEventListener(
    "change",
    finishSeek
);

seekBar.addEventListener(
    "mouseup",
    finishSeek
);

seekBar.addEventListener(
    "touchend",
    finishSeek
);

/* =========================================================
   DARK / LIGHT
========================================================= */

function applyTheme(theme){

    const dark =
    theme === "dark";

    document.body.classList.toggle(
        "dark",
        dark
    );

    themeToggleBtn.innerHTML =
    dark
    ? `<i class="fas fa-sun"></i>`
    : `<i class="fas fa-moon"></i>`;

    localStorage.setItem(
        "jesusSongsTheme",
        theme
    );

}


function initTheme(){

    const saved =
    localStorage.getItem(
        "jesusSongsTheme"
    );

    if(
        saved === "dark" ||
        saved === "light"
    ){

        applyTheme(saved);

        return;

    }

    const dark =
    window.matchMedia &&
    window.matchMedia(
        "(prefers-color-scheme: dark)"
    ).matches;

    applyTheme(
        dark ? "dark" : "light"
    );

}


themeToggleBtn.addEventListener(
    "click",
    function(){

        applyTheme(
            document.body.classList.contains("dark")
            ? "light"
            : "dark"
        );

    }
);


/* =========================================================
   LOAD SONGS
========================================================= */

async function loadSongs(){

    songCount.textContent =
    "Loading...";

    const {
        data,
        error
    } =
    await supabaseClient
    .from("songs")
    .select("*")
    .order("id",{ascending:true});

    if(error){

        console.error(error);

        grid.innerHTML = `

            <div class="no-results">

                <i
                    class="fas fa-exclamation-triangle"
                    style="font-size:2rem"
                ></i>

                <p>
                    Failed to load songs.
                </p>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

        songCount.textContent =
        "0 songs";

        return;

    }

    songs =
    data || [];

    renderSongs();

    renderAdminList();

}


/* =========================================================
   RENDER SONGS
========================================================= */

function renderSongs(){

    const q =
    searchQuery
    .toLowerCase()
    .trim();

    const filtered =
    songs.filter(song => {

        return (

            String(song.title || "")
            .toLowerCase()
            .includes(q)

            ||

            String(song.lyrics || "")
            .toLowerCase()
            .includes(q)

            ||

            String(song.category || "")
            .toLowerCase()
            .includes(q)

        );

    });


    songCount.textContent =
    `${filtered.length} song${filtered.length !== 1 ? "s" : ""}`;


    if(filtered.length === 0){

        grid.innerHTML = `

            <div class="no-results">

                <i
                    class="fas fa-music"
                    style="font-size:2rem;opacity:.4"
                ></i>

                <p>
                    No songs found
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
    filtered.map(song => {

        const preview =
        String(song.lyrics || "")
        .split("\n")
        .find(
            x => x.trim()
        )
        ||
        "...";

        const link =
        song.audio_url || "";

        return `

        <div
            class="song-card"
            data-id="${escapeAttribute(song.id)}"
        >

            <div class="song-card-header">

                <span class="song-title">

                    <i class="fas fa-music"></i>

                    ${escapeHTML(song.title)}

                </span>

            </div>


            <div class="song-card-body">

                <div class="song-preview">

                    ${escapeHTML(preview)}

                </div>

            </div>


            <div class="song-actions">

                ${
                    link
                    ?
                    `
                    <button
                        type="button"
                        class="song-action-btn play-song"
                        data-id="${escapeAttribute(song.id)}"
                    >

                        <i class="fas fa-play"></i>

                        Play

                    </button>
                    `
                    :
                    ""
                }


                <button
                    type="button"
                    class="song-action-btn secondary view-song"
                    data-id="${escapeAttribute(song.id)}"
                >

                    <i class="far fa-eye"></i>

                    View

                </button>

            </div>


            <div class="song-footer">

                <span>

                    <i class="far fa-eye"></i>

                    Tap to view full

                </span>

                <i
                    class="fas fa-arrow-right"
                    style="color:var(--gold)"
                ></i>

            </div>

        </div>

        `;

    }).join("");

}


/* =========================================================
   SONG CLICK
========================================================= */

grid.addEventListener(
    "click",
    function(e){

        const playButton =
        e.target.closest(".play-song");

        const viewButton =
        e.target.closest(".view-song");


        if(playButton || viewButton){

            e.stopPropagation();

            const id =
            Number(
                (
                    playButton ||
                    viewButton
                ).dataset.id
            );

            const song =
            songs.find(
                s =>
                Number(s.id) === id
            );

            if(!song) return;


            if(playButton){

                playYouTube(song);

            }else{

                openDetail(song);

            }

            return;

        }


        const card =
        e.target.closest(".song-card");

        if(!card) return;

        const id =
        Number(card.dataset.id);

        const song =
        songs.find(
            s =>
            Number(s.id) === id
        );

        if(song){

            openDetail(song);

        }

    }
);


/* =========================================================
   LYRICS
========================================================= */

function openDetail(song){

    if(!song){

        return;

    }

    detailTitle.innerHTML = `

        <i class="fas fa-music"></i>

        ${escapeHTML(song.title)}

    `;


    detailLyrics.textContent =
    song.lyrics ||
    "No lyrics available.";


    if(song.audio_url){

        detailLink.innerHTML = `

            <button
                type="button"
                class="song-action-btn"
                id="detailPlayBtn"
            >

                <i class="fas fa-play"></i>

                Play Song

            </button>

        `;


        document
        .getElementById("detailPlayBtn")
        .addEventListener(
            "click",
            function(){

                /*
                   Keep lyrics modal open.
                   Start/restart this song.
                */

                playYouTube(song);

            }
        );

    }else{

        detailLink.innerHTML = `

            <span style="color:var(--muted)">

                <i class="fas fa-info-circle"></i>

                No YouTube link added.

            </span>

        `;

    }


    detailOverlay.classList.add(
        "active"
    );

    document.body.style.overflow =
    "hidden";

}


function closeDetail(){

    detailOverlay.classList.remove(
        "active"
    );

    document.body.style.overflow =
    "";

}


detailCloseBtn.addEventListener(
    "click",
    closeDetail
);


detailOverlay.addEventListener(
    "click",
    function(e){

        if(e.target === this){

            closeDetail();

        }

    }
);

/* =========================================================
   ADMIN LIST
========================================================= */

function renderAdminList(){

    if(!currentUser){

        adminSongList.innerHTML =
        "";

        return;

    }


    if(!songs.length){

        adminSongList.innerHTML =
        "<p style='color:#999'>No songs yet.</p>";

        return;

    }


    adminSongList.innerHTML =
    songs.map(song => `

        <div class="admin-song-item">

            <span>

                ${escapeHTML(song.title)}

                ${
                    Number(editingSongId.value)
                    ===
                    Number(song.id)

                    ?

                    `<span class="edit-badge">
                        Editing
                    </span>`

                    :

                    ""
                }

            </span>


            <div class="actions">

                <button
                    type="button"
                    class="btn btn-edit edit-song"
                    data-id="${escapeAttribute(song.id)}"
                >

                    <i class="fas fa-pen"></i>

                    Edit

                </button>


                <button
                    type="button"
                    class="btn btn-danger delete-song"
                    data-id="${escapeAttribute(song.id)}"
                >

                    <i class="fas fa-trash"></i>

                    Delete

                </button>

            </div>

        </div>

    `).join("");


    document
    .querySelectorAll(".edit-song")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                startEditSong(
                    Number(this.dataset.id)
                );

            }
        );

    });


    document
    .querySelectorAll(".delete-song")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                deleteSong(
                    Number(this.dataset.id)
                );

            }
        );

    });

}

    loginPassword.value;

        "Please enter email and password.";

        return;

    "Logging in...";


    const {
        data,
        error
    } =
    await supabaseClient.auth
    .signInWithPassword({

        email,

        password

    });


    if(error){

    currentUser =
    data.user;


    loginOverlay.classList.remove(
        "active"
    );


    adminPanel.classList.add(
        "active"
    );


    setAdminLoggedIn();

    renderAdminList();

/* =========================================================
   ADD SONG
========================================================= */

async function addSong(){

    if(!currentUser){

        alert(
            "Please login as admin first."
        );

        return;

    }


    const editId =
    Number(editingSongId.value);


    if(editId){

        await updateSong(editId);

        return;

    }


    const title =
    songTitle.value.trim();

    const lyrics =
    songLyrics.value.trim();

    const link =
    songLink.value.trim();

    const category =
    songCategory.value.trim();


    if(!title || !lyrics){

        alert(
            "Song title and lyrics are required."
        );

        return;

    }


    addSongBtn.disabled =
    true;

    addSongBtn.textContent =
    "Saving...";


    const {
        error
    } =
    await supabaseClient
    .from("songs")
    .insert([{

        title:title,

        artist:"Jesus Songs",

        lyrics:lyrics,

        audio_url:
        link || null,

        category:
        category || "Worship"

    }]);


    addSongBtn.disabled =
    false;

    addSongBtn.innerHTML =
    `<i class="fas fa-save"></i> Add Song`;


    if(error){

        alert(
            "❌ Failed:\n" +
            error.message
        );

        return;

    }


    clearForm();

    await loadSongs();

    alert(
        "✅ Song added successfully!"
    );

}


addSongBtn.addEventListener(
    "click",
    addSong
);

function startEditSong(id){

    const song =
    songs.find(
        s =>
        Number(s.id) === Number(id)
    );

    if(!song) return;


    editingSongId.value =
    song.id;

    songTitle.value =
    song.title || "";

    songLyrics.value =
    song.lyrics || "";

    songLink.value =
    song.audio_url || "";

    songCategory.value =
    song.category || "";


    addSongBtn.innerHTML =
    `<i class="fas fa-save"></i> Update Song`;

    cancelEditBtn.style.display =
    "inline-block";

    formStatus.textContent =
    "Editing: " +
    (song.title || "Song");


    renderAdminList();

    songTitle.focus();

}

/* =========================================================
   UPDATE
========================================================= */

async function updateSong(id){

    const title =
    songTitle.value.trim();

    const lyrics =
    songLyrics.value.trim();

    const link =
    songLink.value.trim();

    const category =
    songCategory.value.trim();


    if(!title || !lyrics){

        alert(
            "Song title and lyrics are required."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("songs")
    .update({

        title:title,

        lyrics:lyrics,

        audio_url:
        link || null,

        category:
        category || "Worship"

    })
    .eq("id",id);


    if(error){

        alert(
            "❌ Update failed:\n" +
            error.message
        );

        return;

    }


    clearForm();

    await loadSongs();

    alert(
        "✅ Song updated!"
    );

}


/* =========================================================

========================================================= */

async function deleteSong(id){

    if(!confirm(
        "Are you sure you want to delete this song?"
    )){

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("songs")
    .delete()
    .eq("id",id);


    if(error){

        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        return;

    }


    await loadSongs();

    alert(
        "✅ Song deleted."
    );

}

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================================================
   CHECK USER
========================================================= */

async function checkUser(){

    const {
        data
    } =
    await supabaseClient.auth
    .getUser();


    if(data && data.user){

        currentUser =
        data.user;

        adminPanel.classList.add(
            "active"
        );

        setAdminLoggedIn();

    }

}


/* =========================================================
   AUTH LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (event,session) => {

        currentUser =
        session?.user || null;

    }
);


/* =========================================================
   START
========================================================= */

async function init(){

    initTheme();

    await checkUser();

    await loadSongs();

}

init();
