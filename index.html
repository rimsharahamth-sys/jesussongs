<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jesus Songs</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        :root {
            --body-bg: #f7f3ee;
            --body-text: #222;
            --card-bg: #fff;
            --panel-bg: #fff;
            --modal-bg: #fff;
            --header-bg-1: #1a1a2e;
            --header-bg-2: #16213e;
            --header-text: #f5e6d3;
            --primary: #f0c040;
            --primary-dark: #b8860b;
            --title-color: #1a1a2e;
            --text-color: #222;
            --muted-text: #777;
            --preview-color: #555;
            --border-color: #eee;
            --soft-border: #f0ebe5;
            --input-bg: #fff;
            --input-text: #222;
            --input-border: #ddd;
            --link-color: #1a6fb5;
            --footer-bg: #1a1a2e;
            --footer-text: rgba(255, 255, 255, .4);
            --shadow: rgba(0, 0, 0, .08);
            --strong-shadow: rgba(0, 0, 0, .15);
            --overlay: rgba(0, 0, 0, .65);
        }

        body.dark-mode {
            --body-bg: #101114;
            --body-text: #eee;
            --card-bg: #1b1d22;
            --panel-bg: #1b1d22;
            --modal-bg: #1b1d22;
            --header-bg-1: #08090d;
            --header-bg-2: #151923;
            --title-color: #f5f5f5;
            --text-color: #eee;
            --muted-text: #a8a8a8;
            --preview-color: #bdbdbd;
            --border-color: #30333b;
            --soft-border: #353841;
            --input-bg: #111318;
            --input-text: #eee;
            --input-border: #3b3e47;
            --link-color: #5eb7ff;
            --footer-bg: #08090d;
            --footer-text: rgba(255, 255, 255, .55);
            --shadow: rgba(0, 0, 0, .35);
            --strong-shadow: rgba(0, 0, 0, .55);
            --overlay: rgba(0, 0, 0, .78);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--body-bg);
            color: var(--body-text);
            min-height: 100vh;
            transition: .3s;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--header-bg-1), var(--header-bg-2));
            color: var(--header-text);
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.9rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .header h1 i {
            color: var(--primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* SEARCH */
        .search-wrap {
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, .5);
        }

        #searchInput {
            padding: .65rem 2.7rem .65rem 2.2rem;
            border: none;
            border-radius: 30px;
            font-size: .95rem;
            background: rgba(255, 255, 255, .15);
            color: #fff;
            outline: 2px solid transparent;
            transition: .3s;
            min-width: 260px;
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, .6);
        }

        #searchInput:focus {
            outline-color: var(--primary);
            background: rgba(255, 255, 255, .25);
        }

        .search-clear {
            position: absolute;
            right: .8rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, .65);
            cursor: pointer;
            display: none;
        }

        .search-clear.active {
            display: block;
        }

        .search-info {
            position: absolute;
            top: calc(100% + 8px);
            left: 10px;
            right: 10px;
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 10px;
            padding: .55rem .8rem;
            box-shadow: 0 8px 25px var(--strong-shadow);
            font-size: .8rem;
            display: none;
            z-index: 500;
        }

        .search-info.active {
            display: block;
        }

        /* BUTTONS */
        .btn {
            padding: .5rem 1.2rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: .25s;
            background: var(--primary);
            color: #1a1a2e;
        }

        .btn:hover {
            transform: scale(1.03);
            opacity: .9;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: #1a1a2e;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }

        .btn-edit {
            background: #3498db;
            color: #fff;
        }

        .btn-cancel {
            background: #777;
            color: #fff;
        }

        #themeToggleBtn {
            min-width: 48px;
            height: 42px;
            padding: .5rem .9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: .25s;
        }

        #themeToggleBtn:hover {
            background: var(--primary);
            color: #1a1a2e;
            transform: scale(1.05);
        }

        .song-count {
            font-size: .9rem;
            color: rgba(255, 255, 255, .7);
        }

        /* MAIN */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* SEARCH STATUS */
        .search-status {
            margin-bottom: 1rem;
            display: none;
            padding: .75rem 1rem;
            background: var(--card-bg);
            border-radius: 12px;
            color: var(--muted-text);
            box-shadow: 0 4px 15px var(--shadow);
            font-size: .9rem;
        }

        .search-status.active {
            display: block;
        }

        /* GRID */
        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* CARD */
        .song-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 6px 20px var(--shadow);
            transition: .3s;
            border-left: 5px solid var(--primary-dark);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .song-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px var(--strong-shadow);
        }

        .song-card-header {
            padding: 1.2rem 1.5rem .5rem;
        }

        .song-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--title-color);
        }

        .song-title i {
            color: var(--primary-dark);
            margin-right: .4rem;
        }

        .song-card-body {
            padding: 0 1.5rem .8rem;
            flex: 1;
        }

        .song-preview {
            color: var(--preview-color);
            font-style: italic;
            font-size: .9rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .song-link {
            padding: 0 1.5rem .7rem;
        }

        .song-link a {
            color: var(--link-color);
            text-decoration: none;
            font-size: .9rem;
        }

        .song-link a:hover {
            text-decoration: underline;
        }

        .song-footer {
            padding: .7rem 1.5rem 1rem;
            border-top: 1px solid var(--soft-border);
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            color: var(--muted-text);
        }

        /* SEARCH SCORE BADGE */
        .relevance-badge {
            display: inline-block;
            margin-top: .5rem;
            padding: .18rem .55rem;
            border-radius: 20px;
            background: rgba(240, 192, 64, .15);
            color: var(--primary-dark);
            font-size: .7rem;
            font-weight: 700;
        }

        /* NO RESULTS */
        .no-results {
            text-align: center;
            padding: 5rem 2rem;
            grid-column: 1 / -1;
            color: var(--muted-text);
        }

        .no-results-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--primary-dark);
            opacity: .8;
        }

        .no-results-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: .5rem;
        }

        .no-results-text {
            font-size: .95rem;
            color: var(--muted-text);
        }

        /* ADMIN */
        .admin-panel {
            display: none;
            background: var(--panel-bg);
            color: var(--text-color);
            border-radius: 20px;
            box-shadow: 0 8px 30px var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h2,
        .admin-panel h3 {
            color: var(--title-color);
        }

        .admin-panel h2 {
            margin-bottom: 1rem;
        }

        /* FORM */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: .3rem;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: .7rem 1rem;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: .95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
            transition: .25s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(240, 192, 64, .12);
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: .7rem;
            flex-wrap: wrap;
        }

        .status-message {
            margin-top: .8rem;
            font-size: .9rem;
            min-height: 1.2rem;
        }

        /* ADMIN SONG LIST */
        .admin-song-list {
            margin-top: 2rem;
            border-top: 2px dashed var(--input-border);
            padding-top: 1.5rem;
        }

        .admin-song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .7rem 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .admin-song-item .actions {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .edit-badge {
            display: inline-block;
            margin-left: .5rem;
            padding: .2rem .55rem;
            border-radius: 12px;
            background: #eaf4ff;
            color: #2471a3;
            font-size: .72rem;
            font-weight: 700;
        }

        /* LOGIN */
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-modal {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px var(--strong-shadow);
            text-align: center;
        }

        .login-modal h2 {
            margin-bottom: 1.5rem;
            color: var(--title-color);
        }

        .login-modal input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--input-text);
            outline: none;
        }

        .login-modal input:focus {
            border-color: var(--primary);
        }

        .login-modal .btn {
            width: 100%;
            padding: .7rem;
        }

        .login-error {
            color: #e74c3c;
            font-size: .9rem;
            margin-top: .7rem;
        }

        /* DETAIL */
        .song-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(6px);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .song-detail-overlay.active {
            display: flex;
        }

        .song-detail-modal {
            background: var(--modal-bg);
            color: var(--text-color);
            border-radius: 28px;
            max-width: 720px;
            width: 100%;
            padding: 2.5rem;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px var(--strong-shadow);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: var(--muted-text);
            cursor: pointer;
            border: none;
            background: none;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--title-color);
            padding-right: 2rem;
        }

        .detail-title i {
            color: var(--primary-dark);
            margin-right: .5rem;
        }

        .detail-lyrics {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            line-height: 1.9;
            white-space: pre-line;
            color: var(--text-color);
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 2px solid var(--soft-border);
            border-bottom: 2px solid var(--soft-border);
        }

        .detail-link a {
            color: var(--link-color);
            text-decoration: none;
        }

        /* FOOTER */
        .footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 1.2rem;
            font-size: .8rem;
            margin-top: 2rem;
        }

        /* MOBILE */
        @media (max-width: 650px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: .8rem;
            }
            .header-controls {
                justify-content: center;
            }
            #searchInput {
                width: 100%;
                min-width: 150px;
            }
            .songs-grid {
                grid-template-columns: 1fr;
            }
            .song-detail-modal {
                padding: 1.5rem;
            }
            .admin-song-item {
                align-items: flex-start;
                gap: .7rem;
                flex-direction: column;
            }
            .admin-song-item .actions {
                width: 100%;
                justify-content: flex-start;
            }
            .detail-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>
            <i class="fas fa-cross"></i>
            Jesus Songs
        </h1>

        <div class="header-controls">

            <div class="search-wrap">

                <i class="fas fa-search"></i>

                <input type="text" id="searchInput" placeholder="Search songs..." autocomplete="off">

                <i class="fas fa-times search-clear" id="searchClear"></i>

                <div class="search-info" id="searchInfo"></div>

            </div>

            <span class="song-count" id="songCount">Loading...</span>

            <button id="themeToggleBtn" title="Change Theme">
                <i class="fas fa-moon" id="themeIcon"></i>
                <span id="themeText">Dark</span>
            </button>

            <button class="btn btn-outline" id="adminToggleBtn">
                <i class="fas fa-user-shield"></i>
                Admin
            </button>

        </div>

    </header>

    <!-- LOGIN -->

    <div class="login-overlay" id="loginOverlay">

        <div class="login-modal">

            <h2>
                <i class="fas fa-lock"></i>
                Admin Login
            </h2>

            <input type="email" id="loginEmail" placeholder="Admin Email">

            <input type="password" id="loginPassword" placeholder="Password">

            <button class="btn" id="loginBtn">Login</button>

            <div class="login-error" id="loginError"></div>

        </div>

    </div>

    <!-- SONG DETAIL -->

    <div class="song-detail-overlay" id="songDetailOverlay">

        <div class="song-detail-modal">

            <button class="close-btn" id="detailCloseBtn">&times;</button>

            <div class="detail-title" id="detailTitle">Song</div>

            <div class="detail-lyrics" id="detailLyrics"></div>

            <div class="detail-link" id="detailLink"></div>

        </div>

    </div>

    <main class="main">

        <div class="search-status" id="searchStatus"></div>

        <!-- ADMIN -->

        <div class="admin-panel" id="adminPanel">

            <input type="hidden" id="editingSongId" value="">

            <h2>
                <i class="fas fa-plus-circle"></i>
                Add New Song
            </h2>

            <div class="form-group">
                <label>Song Title *</label>
                <input type="text" id="songTitle" placeholder="e.g. Amazing Grace">
            </div>

            <div class="form-group">
                <label>Lyrics *</label>
                <textarea id="songLyrics" placeholder="Enter full lyrics..."></textarea>
            </div>

            <div class="form-group">
                <label>Audio / YouTube Link</label>
                <input type="url" id="songLink" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="songCategory" placeholder="Worship">
            </div>

            <div class="form-actions">

                <button class="btn" id="addSongBtn">
                    <i class="fas fa-save"></i>
                    Add Song
                </button>

                <button class="btn btn-cancel" id="cancelEditBtn" type="button" style="display:none;">
                    <i class="fas fa-times"></i>
                    Cancel Edit
                </button>

            </div>

            <div class="status-message" id="formStatus"></div>

            <hr style="margin:1.5rem 0; border:none; border-top:1px solid var(--border-color);">

            <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem;">

                <h3>Existing Songs</h3>

                <button class="btn btn-danger" id="logoutBtn">Logout</button>

            </div>

            <div class="admin-song-list" id="adminSongList"></div>

        </div>

        <!-- SONGS -->

        <div class="songs-grid" id="songsGrid"></div>

    </main>

    <footer class="footer">

        <p>
            ✝️ Jesus Songs · Powered by Branks3
        </p>

    </footer>

    <script>
        /* ============================================================
           SUPABASE
        ============================================================ */

        const SUPABASE_URL =
            "https://jxbjjbmwlqjfonnuhjrx.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_D9ppxxYrbWMUsMxTnxdnhA_hQORxcXH";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        /* ============================================================
           STATE
        ============================================================ */

        let songs = [];
        let searchQuery = "";
        let currentUser = null;

        /* ============================================================
           DOM
        ============================================================ */

        const grid =
            document.getElementById("songsGrid");

        const searchInput =
            document.getElementById("searchInput");

        const searchClear =
            document.getElementById("searchClear");

        const searchInfo =
            document.getElementById("searchInfo");

        const searchStatus =
            document.getElementById("searchStatus");

        const songCount =
            document.getElementById("songCount");

        const adminPanel =
            document.getElementById("adminPanel");

        const adminToggleBtn =
            document.getElementById("adminToggleBtn");

        const loginOverlay =
            document.getElementById("loginOverlay");

        const loginEmail =
            document.getElementById("loginEmail");

        const loginPassword =
            document.getElementById("loginPassword");

        const loginBtn =
            document.getElementById("loginBtn");

        const loginError =
            document.getElementById("loginError");

        const logoutBtn =
            document.getElementById("logoutBtn");

        const addSongBtn =
            document.getElementById("addSongBtn");

        const cancelEditBtn =
            document.getElementById("cancelEditBtn");

        const editingSongId =
            document.getElementById("editingSongId");

        const formStatus =
            document.getElementById("formStatus");

        const songTitle =
            document.getElementById("songTitle");

        const songLyrics =
            document.getElementById("songLyrics");

        const songLink =
            document.getElementById("songLink");

        const songCategory =
            document.getElementById("songCategory");

        const adminSongList =
            document.getElementById("adminSongList");

        const detailOverlay =
            document.getElementById("songDetailOverlay");

        const detailCloseBtn =
            document.getElementById("detailCloseBtn");

        const detailTitle =
            document.getElementById("detailTitle");

        const detailLyrics =
            document.getElementById("detailLyrics");

        const detailLink =
            document.getElementById("detailLink");

        const themeToggleBtn =
            document.getElementById("themeToggleBtn");

        const themeIcon =
            document.getElementById("themeIcon");

        const themeText =
            document.getElementById("themeText");

        /* ============================================================
           THEME
        ============================================================ */

        function applyTheme(theme) {

            if (theme === "dark") {

                document.body.classList.add(
                    "dark-mode"
                );

                themeIcon.className =
                    "fas fa-sun";

                themeText.textContent =
                    "Light";

            } else {

                document.body.classList.remove(
                    "dark-mode"
                );

                themeIcon.className =
                    "fas fa-moon";

                themeText.textContent =
                    "Dark";
            }

            localStorage.setItem(
                "jesusSongsTheme",
                theme
            );
        }

        function initializeTheme() {

            const saved =
                localStorage.getItem(
                    "jesusSongsTheme"
                );

            if (saved) {

                applyTheme(saved);

                return;
            }

            const dark =
                window.matchMedia &&
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches;

            applyTheme(
                dark ? "dark" : "light"
            );
        }

        themeToggleBtn.addEventListener(
            "click",
            () => {

                const dark =
                    document.body.classList.contains(
                        "dark-mode"
                    );

                applyTheme(
                    dark ? "light" : "dark"
                );

            }
        );

        /* ============================================================
           TELUGU TRANSLITERATION
           Improved Roman Telugu search engine
        ============================================================ */

        const TELUGU_VOWELS = {

            "అ": "a",
            "ఆ": "aa",
            "ఇ": "i",
            "ఈ": "ee",
            "ఉ": "u",
            "ఊ": "oo",
            "ఋ": "ru",
            "ఎ": "e",
            "ఏ": "ee",
            "ఐ": "ai",
            "ఒ": "o",
            "ఓ": "oo",
            "ఔ": "au"
        };

        const TELUGU_CONSONANTS = {

            "క": "k",
            "ఖ": "kh",
            "గ": "g",
            "ఘ": "gh",
            "ఙ": "ng",

            "చ": "ch",
            "ఛ": "chh",
            "జ": "j",
            "ఝ": "jh",
            "ఞ": "ny",

            "ట": "t",
            "ఠ": "th",
            "డ": "d",
            "ఢ": "dh",
            "ణ": "n",

            "త": "t",
            "థ": "th",
            "ద": "d",
            "ధ": "dh",
            "న": "n",

            "ప": "p",
            "ఫ": "ph",
            "బ": "b",
            "భ": "bh",
            "మ": "m",

            "య": "y",
            "ర": "r",
            "ల": "l",
            "వ": "v",

            "శ": "sh",
            "ష": "sh",
            "స": "s",
            "హ": "h",

            "ళ": "l",
            "ఱ": "r"
        };

        const TELUGU_SIGNS = {

            "ా": "aa",
            "ి": "i",
            "ీ": "ee",
            "ు": "u",
            "ూ": "oo",
            "ృ": "ru",
            "ె": "e",
            "ే": "ee",
            "ై": "ai",
            "ొ": "o",
            "ో": "oo",
            "ౌ": "au"
        };

        const TELUGU_SPECIAL = {

            "ం": "m",
            "ః": "h",
            "ఁ": "m"
        };

        function transliterateTelugu(text) {

            if (!text) {
                return "";
            }

            const chars =
                Array.from(String(text));

            let result = "";

            for (
                let i = 0;
                i < chars.length;
                i++
            ) {

                const ch =
                    chars[i];

                /* Independent vowel */

                if (
                    TELUGU_VOWELS[ch]
                ) {

                    result +=
                        TELUGU_VOWELS[ch];

                    continue;
                }

                /* Special */

                if (
                    TELUGU_SPECIAL[ch]
                ) {

                    result +=
                        TELUGU_SPECIAL[ch];

                    continue;
                }

                /* Consonant */

                if (
                    TELUGU_CONSONANTS[ch]
                ) {

                    const base =
                        TELUGU_CONSONANTS[ch];

                    const next =
                        chars[i + 1];

                    /* Vowel sign */

                    if (
                        next &&
                        TELUGU_SIGNS[next]
                    ) {

                        result +=
                            base +
                            TELUGU_SIGNS[next];

                        i++;

                        continue;
                    }

                    /* Virama */

                    if (
                        next === "్"
                    ) {

                        result += base;

                        i++;

                        continue;
                    }

                    /* Default inherent 'a' */

                    result +=
                        base + "a";

                    continue;
                }

                /* Ignore virama when it wasn't consumed above. */

                if (ch === "్") {
                    continue;
                }

                result += ch;
            }

            return result;
        }

        /* ============================================================
           ROMAN TELUGU ALTERNATIVE FORMS
        ============================================================ */

        function createRomanVariants(text) {

            const base =
                normalizeBasic(text);

            const variants =
                new Set();

            if (!base) {
                return [];
            }

            variants.add(base);

            /*
               Common Roman Telugu differences.
            */

            variants.add(
                base
                .replace(/aa/g, "a")
                .replace(/ee/g, "i")
                .replace(/ii/g, "i")
                .replace(/oo/g, "u")
                .replace(/uu/g, "u")
            );

            variants.add(
                base
                .replace(/ee/g, "e")
                .replace(/aa/g, "a")
                .replace(/oo/g, "o")
                .replace(/uu/g, "u")
            );

            variants.add(
                base
                .replace(/sh/g, "s")
                .replace(/chh/g, "ch")
                .replace(/kh/g, "k")
                .replace(/gh/g, "g")
                .replace(/dh/g, "d")
                .replace(/bh/g, "b")
                .replace(/ph/g, "p")
                .replace(/th/g, "t")
                .replace(/jh/g, "j")
            );

            return [...variants];
        }

        /* ============================================================
           BASIC NORMALIZATION
        ============================================================ */

        function normalizeBasic(text) {

            if (!text) {
                return "";
            }

            return String(text)

                .toLowerCase()

                .normalize("NFD")

                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )

                .replace(
                    /[\u200B-\u200D\uFEFF]/g,
                    ""
                )

                .replace(
                    /[’‘`]/g,
                    "'"
                )

                .replace(
                    /[^a-z0-9\u0C00-\u0C7F\s']/gi,
                    " "
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();
        }

        /* ============================================================
           SEARCH TEXT CREATION — TITLE ONLY
        ============================================================ */

        function buildSearchData(song) {

            const title =
                song.title || "";

            const titleOriginal =
                normalizeBasic(title);

            const titleRoman =
                normalizeBasic(
                    transliterateTelugu(title)
                );

            return {
                titleOriginal,
                titleRoman,
                titleWords: [
                    ...tokenize(titleOriginal),
                    ...tokenize(titleRoman)
                ]
            };
        }

        /* ============================================================
           TOKENIZE
        ============================================================ */

        function tokenize(text) {

            return normalizeBasic(text)

                .split(/\s+/)

                .filter(
                    word => word.length > 0
                );
        }

        /* ============================================================
           LEVENSHTEIN DISTANCE
        ============================================================ */

        function levenshtein(a, b) {

            a = String(a || "");
            b = String(b || "");

            if (a === b) {
                return 0;
            }

            if (!a.length) {
                return b.length;
            }

            if (!b.length) {
                return a.length;
            }

            let previous =
                Array.from({ length: b.length + 1 }, (_, i) => i);

            for (
                let i = 0;
                i < a.length;
                i++
            ) {

                const current =
                    [i + 1];

                for (
                    let j = 0;
                    j < b.length;
                    j++
                ) {

                    const insert =
                        current[j] + 1;

                    const remove =
                        previous[j + 1] + 1;

                    const replace =
                        previous[j] +
                        (a[i] === b[j] ? 0 : 1);

                    current.push(
                        Math.min(
                            insert,
                            remove,
                            replace
                        )
                    );
                }

                previous = current;
            }

            return previous[b.length];
        }

        /* ============================================================
           FUZZY TOKEN MATCH
        ============================================================ */

        function fuzzyTokenMatch(
            queryWord,
            targetWords
        ) {

            if (!queryWord) {
                return false;
            }

            for (
                const target of targetWords
            ) {

                if (!target) {
                    continue;
                }

                /* Exact */

                if (
                    target === queryWord
                ) {
                    return true;
                }

                /* Prefix */

                if (
                    target.startsWith(queryWord) ||
                    queryWord.startsWith(target)
                ) {

                    const difference =
                        Math.abs(
                            target.length -
                            queryWord.length
                        );

                    if (
                        difference <= 2
                    ) {

                        return true;
                    }
                }

                /* Small spelling error */

                if (
                    queryWord.length >= 4 &&
                    target.length >= 4
                ) {

                    const distance =
                        levenshtein(
                            queryWord,
                            target
                        );

                    const allowed =
                        queryWord.length >= 7 ?
                        2 :
                        1;

                    if (
                        distance <= allowed
                    ) {

                        return true;
                    }
                }
            }

            return false;
        }

        /* ============================================================
           GET QUERY VARIANTS
        ============================================================ */

        function getQueryVariants(query) {

            const raw =
                normalizeBasic(query);

            const teluguToRoman =
                normalizeBasic(
                    transliterateTelugu(query)
                );

            const variants =
                new Set();

            if (raw) {
                variants.add(raw);
            }

            if (teluguToRoman) {
                variants.add(teluguToRoman);
            }

            /*
               Add alternative Roman spellings.
            */

            createRomanVariants(raw)
                .forEach(
                    x => variants.add(x)
                );

            createRomanVariants(
                    teluguToRoman
                )
                .forEach(
                    x => variants.add(x)
                );

            return [...variants];
        }

        /* ============================================================
           SCORE SONG — TITLE ONLY
           YouTube-style relevance ranking based on song name
        ============================================================ */

        function scoreSong(song, query) {

            if (!query) {
                return 0;
            }

            const data =
                buildSearchData(song);

            const queryVariants =
                getQueryVariants(query);

            const queryWords =
                tokenize(query);

            let bestScore = 0;

            const titleOriginal = data.titleOriginal || "";
            const titleRoman = data.titleRoman || "";
            const titleWords = data.titleWords || [];

            /*
               ========================================================
               EXACT TITLE MATCH
               ========================================================
            */

            for (
                const q of queryVariants
            ) {

                if (
                    q === titleOriginal ||
                    q === titleRoman
                ) {

                    bestScore =
                        Math.max(
                            bestScore,
                            1000
                        );
                }
            }

            /*
               ========================================================
               TITLE STARTS WITH QUERY
               ========================================================
            */

            for (
                const q of queryVariants
            ) {

                if (
                    titleOriginal
                    .startsWith(q) ||
                    titleRoman
                    .startsWith(q)
                ) {

                    bestScore =
                        Math.max(
                            bestScore,
                            850
                        );
                }
            }

            /*
               ========================================================
               QUERY IS INSIDE TITLE
               ========================================================
            */

            for (
                const q of queryVariants
            ) {

                if (
                    q.length >= 2 &&
                    (
                        titleOriginal
                        .includes(q) ||
                        titleRoman
                        .includes(q)
                    )
                ) {

                    bestScore =
                        Math.max(
                            bestScore,
                            700
                        );
                }
            }

            /*
               ========================================================
               ALL QUERY WORDS IN TITLE
               ========================================================
            */

            let titleWordMatches = 0;

            for (
                const queryWord of queryWords
            ) {

                const variants =
                    getQueryVariants(
                        queryWord
                    );

                let matched = false;

                for (
                    const variant of variants
                ) {

                    if (
                        fuzzyTokenMatch(
                            variant,
                            titleWords
                        )
                    ) {

                        matched = true;
                        break;
                    }
                }

                if (matched) {
                    titleWordMatches++;
                }
            }

            if (
                queryWords.length > 0 &&
                titleWordMatches ===
                queryWords.length
            ) {

                bestScore =
                    Math.max(
                        bestScore,
                        800
                    );

            } else if (
                titleWordMatches > 0
            ) {

                bestScore =
                    Math.max(
                        bestScore,
                        500 +
                        titleWordMatches * 30
                    );
            }

            return bestScore;
        }

        /* ============================================================
           SEARCH MATCH
        ============================================================ */

        function songMatchesSearch(
            song,
            query
        ) {

            if (!query.trim()) {
                return true;
            }

            return (
                scoreSong(song, query) > 0
            );
        }

        /* ============================================================
           ESCAPE
        ============================================================ */

        function escapeHTML(value) {

            return String(value ?? "")

                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {

            return escapeHTML(value);
        }

        /* ============================================================
           LOAD SONGS
        ============================================================ */

        async function loadSongs() {

            songCount.textContent =
                "Loading...";

            const {
                data,
                error
            } =
            await supabaseClient
                .from("songs")
                .select("*")
                .order(
                    "id", { ascending: true }
                );

            if (error) {

                console.error(
                    "Supabase Error:",
                    error
                );

                grid.innerHTML = `

                        <div class="no-results">

                            <div class="no-results-icon">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>

                            <div class="no-results-title">
                                Unable to load songs
                            </div>

                            <div class="no-results-text">
                                ${escapeHTML(error.message)}
                            </div>

                        </div>

                    `;

                songCount.textContent =
                    "0 songs";

                return;
            }

            songs =
                Array.isArray(data) ?
                data :
                [];

            renderSongs();

            renderAdminList();
        }

        /* ============================================================
           RENDER SONGS
        ============================================================ */

        function renderSongs() {

            const q = searchQuery.trim();

            if (!songs.length) {
                songCount.textContent = "0 songs";
                grid.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon"><i class="fas fa-music"></i></div>
                        <div class="no-results-title">No songs found</div>
                        <div class="no-results-text">Admin hasn't added any songs yet.</div>
                    </div>
                `;
                searchStatus.classList.remove("active");
                return;
            }

            /* Empty search = show every song */
            if (!q) {
                renderSongCards(
                    songs.map(song => ({ song, score: 0 })),
                    false
                );
                songCount.textContent = `${songs.length} song${songs.length !== 1 ? "s" : ""}`;
                searchStatus.classList.remove("active");
                return;
            }

            /*
               STARTING-NAME SEARCH

               Example: Search "yesu"
               Shows: Yesu Naa Rakshaka, Yesu Naa Prabhu, Yesu Neeve
               Does NOT show: Naa Yesu Prabhu, Naatho Yesu, Oka Yesu Song

               The COMPLETE song title must START with the searched name.
               Telugu and Roman-Telugu are both supported.
            */

            const variants = [
                ...new Set(
                    getQueryVariants(q)
                        .map(v => normalizeBasic(v))
                        .filter(Boolean)
                )
            ];

            function startsWithSearch(song) {
                const data = buildSearchData(song);
                const titleOriginal = data.titleOriginal || "";
                const titleRoman = data.titleRoman || "";

                return variants.some(v =>
                    titleOriginal.startsWith(v) ||
                    titleRoman.startsWith(v)
                );
            }

            const startingMatches = songs
                .map((song, originalIndex) => ({
                    song,
                    originalIndex,
                    score: scoreSong(song, q)
                }))
                .filter(item => startsWithSearch(item.song))
                .sort((a, b) => {
                    const aTitle = normalizeBasic(a.song.title || "");
                    const bTitle = normalizeBasic(b.song.title || "");
                    const aRoman = normalizeBasic(transliterateTelugu(a.song.title || ""));
                    const bRoman = normalizeBasic(transliterateTelugu(b.song.title || ""));

                    const aExact = variants.some(v => aTitle === v || aRoman === v);
                    const bExact = variants.some(v => bTitle === v || bRoman === v);

                    if (aExact !== bExact) return aExact ? -1 : 1;

                    /* Shorter matching title first; database order for ties. */
                    if (aTitle.length !== bTitle.length) {
                        return aTitle.length - bTitle.length;
                    }

                    return a.originalIndex - b.originalIndex;
                });

            if (!startingMatches.length) {
                songCount.textContent = "0 results";
                searchStatus.classList.add("active");
                searchStatus.innerHTML = `
                    <i class="fas fa-search"></i>
                    No song title starts with <strong>"${escapeHTML(q)}"</strong>
                `;

                grid.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon"><i class="fas fa-search"></i></div>
                        <div class="no-results-title">No starting-name matches</div>
                        <div class="no-results-text">Try the beginning of the song name.</div>
                    </div>
                `;
                return;
            }

            songCount.textContent =
                `${startingMatches.length} result${startingMatches.length !== 1 ? "s" : ""}`;

            searchStatus.classList.add("active");
            searchStatus.innerHTML = `
                <i class="fas fa-search"></i>
                Songs starting with <strong>"${escapeHTML(q)}"</strong>
                <span style="opacity:.75;"> · ${startingMatches.length} found</span>
            `;

            renderSongCards(startingMatches, true);
        }

        /* ============================================================
           RENDER CARDS
        ============================================================ */

        function renderSongCards(
            results,
            showScore
        ) {

            grid.innerHTML =
                results.map(
                    item => {

                        const song =
                            item.song;

                        const preview =
                            (song.lyrics || "")
                            .split("\n")
                            .filter(
                                x =>
                                x.trim()
                            )[0] ||
                            "...";

                        const link =
                            song.audio_url || "";

                        return `

                                <div
                                    class="song-card"
                                    data-id="${escapeAttribute(song.id)}"
                                >

                                    <div class="song-card-header">

                                        <span class="song-title">

                                            <i class="fas fa-music"></i>

                                            ${escapeHTML(song.title)}

                                        </span>

                                        ${ showScore ?
                                        `
                                        <div>

                                            <span class="relevance-badge">

                                                <i class="fas fa-play"></i>

                                                Starts With

                                            </span>

                                        </div>
                                        ` :
                                        "" }

                                    </div>

                                    <div class="song-card-body">

                                        <div class="song-preview">

                                            ${escapeHTML(preview)}

                                        </div>

                                    </div>

                                    ${ link ?
                                    `

                                    <div class="song-link">

                                        <a
                                            href="${escapeAttribute(link)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >

                                            <i class="fas fa-play-circle"></i>

                                            Play / Watch

                                        </a>

                                    </div>

                                    ` :
                                    "" }

                                    <div class="song-footer">

                                        <span>

                                            <i class="far fa-eye"></i>

                                            Tap to view full

                                        </span>

                                        <i
                                            class="fas fa-arrow-right"
                                            style="color:var(--primary-dark);"
                                        ></i>

                                    </div>

                                </div>

                            `;
                    }
                )
                .join("");
        }

        /* ============================================================
           LOGIN
        ============================================================ */

        async function login() {

            const email =
                loginEmail.value.trim();

            const password =
                loginPassword.value;

            if (!email || !password) {

                loginError.textContent =
                    "Please enter email and password.";

                return;
            }

            loginError.textContent =
                "Logging in...";

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({

                    email,
                    password

                });

            if (error) {

                console.error(error);

                loginError.textContent =
                    "❌ " +
                    error.message;

                return;
            }

            currentUser =
                data.user;

            loginOverlay.classList.remove(
                "active"
            );

            adminPanel.classList.add(
                "active"
            );

            setAdminButton();

            renderAdminList();

            loginEmail.value = "";
            loginPassword.value = "";
        }

        /* ============================================================
           ADD SONG
        ============================================================ */

        async function addSong() {

            if (!currentUser) {

                alert(
                    "Please login as admin first."
                );

                return;
            }

            const editId =
                Number(
                    editingSongId.value
                );

            if (editId) {

                await updateSong(editId);

                return;
            }

            const title =
                songTitle.value.trim();

            const lyrics =
                songLyrics.value.trim();

            const link =
                songLink.value.trim();

            const category =
                songCategory.value.trim();

            if (!title || !lyrics) {

                alert(
                    "Song title and lyrics are required."
                );

                return;
            }

            addSongBtn.disabled = true;

            addSongBtn.innerHTML =
                `<i class="fas fa-spinner fa-spin"></i> Saving...`;

            const {
                error
            } =
            await supabaseClient
                .from("songs")
                .insert([{

                    title,
                    artist: "Jesus Songs",
                    lyrics,
                    audio_url: link || null,
                    category: category || "Worship"
                }]);

            addSongBtn.disabled = false;

            addSongBtn.innerHTML =
                `<i class="fas fa-save"></i> Add Song`;

            if (error) {

                console.error(error);

                alert(
                    "❌ Failed to add song:\n\n" +
                    error.message
                );

                return;
            }

            cancelEdit();

            await loadSongs();

            alert(
                "✅ Song added successfully!"
            );
        }

        /* ============================================================
           EDIT
        ============================================================ */

        function startEditSong(id) {

            const song =
                songs.find(
                    s =>
                    Number(s.id) ===
                    Number(id)
                );

            if (!song) {
                return;
            }

            editingSongId.value =
                song.id;

            songTitle.value =
                song.title || "";

            songLyrics.value =
                song.lyrics || "";

            songLink.value =
                song.audio_url || "";

            songCategory.value =
                song.category || "";

            addSongBtn.innerHTML =
                `<i class="fas fa-save"></i> Update Song`;

            cancelEditBtn.style.display =
                "inline-block";

            formStatus.textContent =
                `Editing: ${song.title}`;

            formStatus.style.color =
                "#2471a3";

            renderAdminList();

            songTitle.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            songTitle.focus();
        }

        /* ============================================================
           CANCEL EDIT
        ============================================================ */

        function cancelEdit() {

            editingSongId.value = "";

            songTitle.value = "";
            songLyrics.value = "";
            songLink.value = "";
            songCategory.value = "";

            addSongBtn.disabled = false;

            addSongBtn.innerHTML =
                `<i class="fas fa-save"></i> Add Song`;

            cancelEditBtn.disabled = false;

            cancelEditBtn.style.display =
                "none";

            formStatus.textContent = "";

            renderAdminList();
        }

        /* ============================================================
           UPDATE
        ============================================================ */

        async function updateSong(id) {

            const title =
                songTitle.value.trim();

            const lyrics =
                songLyrics.value.trim();

            const link =
                songLink.value.trim();

            const category =
                songCategory.value.trim();

            if (!title || !lyrics) {

                alert(
                    "Song title and lyrics are required."
                );

                return;
            }

            addSongBtn.disabled = true;

            cancelEditBtn.disabled = true;

            addSongBtn.innerHTML =
                `<i class="fas fa-spinner fa-spin"></i> Updating...`;

            const {
                error
            } =
            await supabaseClient
                .from("songs")
                .update({

                    title,
                    lyrics,

                    audio_url: link || null,

                    category: category || "Worship"

                })
                .eq(
                    "id",
                    id
                );

            addSongBtn.disabled = false;

            cancelEditBtn.disabled = false;

            if (error) {

                console.error(error);

                formStatus.textContent =
                    "❌ Update failed: " +
                    error.message;

                formStatus.style.color =
                    "#c0392b";

                addSongBtn.innerHTML =
                    `<i class="fas fa-save"></i> Update Song`;

                return;
            }

            cancelEdit();

            await loadSongs();

            alert(
                "✅ Song updated successfully!"
            );
        }

        /* ============================================================
           DELETE
        ============================================================ */

        async function deleteSong(id) {

            if (!currentUser) {
                return;
            }

            const confirmed =
                confirm(
                    "Are you sure you want to delete this song?"
                );

            if (!confirmed) {
                return;
            }

            const {
                error
            } =
            await supabaseClient
                .from("songs")
                .delete()
                .eq(
                    "id",
                    id
                );

            if (error) {

                console.error(error);

                alert(
                    "❌ Delete failed:\n\n" +
                    error.message
                );

                return;
            }

            if (
                Number(
                    editingSongId.value
                ) === Number(id)
            ) {

                cancelEdit();
            }

            await loadSongs();

            alert(
                "✅ Song deleted successfully."
            );
        }

        /* ============================================================
           SEARCH INPUT
        ============================================================ */

        searchInput.addEventListener(
            "input",
            function() {

                searchQuery =
                    this.value;

                if (
                    this.value.trim()
                ) {

                    searchClear.classList.add(
                        "active"
                    );

                } else {

                    searchClear.classList.remove(
                        "active"
                    );
                }

                renderSongs();

            }
        );

        /* ============================================================
           CLEAR SEARCH
        ============================================================ */

        searchClear.addEventListener(
            "click",
            function() {

                searchInput.value = "";

                searchQuery = "";

                searchClear.classList.remove(
                    "active"
                );

                searchInput.focus();

                renderSongs();

            }
        );

        /* ============================================================
           ADMIN BUTTON
        ============================================================ */

        adminToggleBtn.addEventListener(
            "click",
            async function() {

                if (currentUser) {

                    await logout();

                    return;
                }

                loginOverlay.classList.add(
                    "active"
                );

                loginError.textContent =
                    "";

                loginEmail.focus();

            }
        );

        /* ============================================================
           LOGIN
        ============================================================ */

        loginBtn.addEventListener(
            "click",
            login
        );

        loginPassword.addEventListener(
            "keydown",
            function(e) {

                if (e.key === "Enter") {
                    login();
                }

            }
        );

        loginEmail.addEventListener(
            "keydown",
            function(e) {

                if (e.key === "Enter") {
                    login();
                }

            }
        );

        /* ============================================================
           CLOSE LOGIN
        ============================================================ */

        loginOverlay.addEventListener(
            "click",
            function(e) {

                if (e.target === this) {

                    loginOverlay.classList.remove(
                        "active"
                    );

                }

            }
        );

        /* ============================================================
           CLOSE DETAIL
        ============================================================ */

        detailCloseBtn.addEventListener(
            "click",
            closeDetail
        );

        detailOverlay.addEventListener(
            "click",
            function(e) {

                if (e.target === this) {

                    closeDetail();

                }

            }
        );

        /* ============================================================
           ESC
        ============================================================ */

        document.addEventListener(
            "keydown",
            function(e) {

                if (e.key !== "Escape") {
                    return;
                }

                closeDetail();

                loginOverlay.classList.remove(
                    "active"
                );

            }
        );

        /* ============================================================
           SONG CARD CLICK
        ============================================================ */

        grid.addEventListener(
            "click",
            function(e) {

                if (
                    e.target.closest("a")
                ) {
                    return;
                }

                const card =
                    e.target.closest(
                        ".song-card"
                    );

                if (!card) {
                    return;
                }

                const id =
                    Number(
                        card.dataset.id
                    );

                const song =
                    songs.find(
                        s =>
                        Number(s.id) ===
                        id
                    );

                if (song) {

                    openDetail(song);

                }

            }
        );

        /* ============================================================
           ADMIN EVENTS
        ============================================================ */

        addSongBtn.addEventListener(
            "click",
            addSong
        );

        cancelEditBtn.addEventListener(
            "click",
            cancelEdit
        );

        logoutBtn.addEventListener(
            "click",
            logout
        );

        /* ============================================================
           CHECK LOGIN
        ============================================================ */

        async function checkUser() {

            const {
                data
            } =
            await supabaseClient.auth
                .getUser();

            if (
                data &&
                data.user
            ) {

                currentUser =
                    data.user;

                adminPanel.classList.add(
                    "active"
                );

                setAdminButton();

            }
        }

        /* ============================================================
           INIT
        ============================================================ */

        async function init() {

            initializeTheme();

            await checkUser();

            await loadSongs();

        }

        init();

        /* ============================================================
           AUTH STATE
        ============================================================ */

        supabaseClient.auth.onAuthStateChange(
            (
                event,
                session
            ) => {

                if (
                    session &&
                    session.user
                ) {

                    currentUser =
                        session.user;

                    adminPanel.classList.add(
                        "active"
                    );

                    setAdminButton();

                    renderAdminList();

                } else {

                    currentUser = null;

                    adminPanel.classList.remove(
                        "active"
                    );

                    resetAdminButton();

                }

            }
        );
    </script>

</body>
</html>
